(function(){
  'use strict';
  var CLIENT_ID='1001667206230-ljl0oogq5vmgia28sk37bo3restv23gc.apps.googleusercontent.com', ALLOWED_EMAIL_SHA256='495ed02ac491c3efc228c562f2c25462b044f78d37526d24c8c2e25eb82855d2';
  var $=function(i){return document.getElementById(i);};
  var msg=$('msg'), err=$('err');

  function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
  function payloadOf(jwt){
    var p=jwt.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');
    return JSON.parse(decodeURIComponent(escape(atob(p+'==='.slice((p.length+3)%4)))));
  }
  async function sha256hex(s){
    var d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));
    return Array.prototype.map.call(new Uint8Array(d),function(b){return ('0'+b.toString(16)).slice(-2);}).join('');
  }
  // 許可メールは平文で持たずSHA-256で照合する（公開リポにアドレスを載せない）
  async function verified(jwt){
    try{
      var c=payloadOf(jwt);
      if(!((c.iss==='accounts.google.com'||c.iss==='https://accounts.google.com')
        && c.aud===CLIENT_ID && c.email_verified===true && c.exp*1000>Date.now())) return false;
      return (await sha256hex(String(c.email).toLowerCase()))===ALLOWED_EMAIL_SHA256;
    }catch(e){return false;}
  }
  async function decrypt(pp){
    var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pp),'PBKDF2',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(PAYLOAD.salt),iterations:PAYLOAD.iters,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    var buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(PAYLOAD.iv)},key,b64(PAYLOAD.ct));
    return new TextDecoder().decode(buf);
  }
  function show(html){document.open();document.write(html);document.close();}

  async function unlock(){
    msg.textContent='復号中…'; err.textContent='';
    var pp=null; try{pp=localStorage.getItem('jm_pp');}catch(e){}
    if(pp){
      try{show(await decrypt(pp));return;}
      catch(e){try{localStorage.removeItem('jm_pp');}catch(_){}}
    }
    msg.textContent='パスフレーズを入力してください（この端末では初回のみ）';
    $('pp-form').style.display='block';
    $('pp').focus();
  }
  $('pp-form').addEventListener('submit',async function(ev){
    ev.preventDefault(); err.textContent='';
    var v=$('pp').value;
    try{
      var html=await decrypt(v);
      try{localStorage.setItem('jm_pp',v);}catch(e){}
      show(html);
    }catch(e){err.textContent='パスフレーズが違います';}
  });

  async function onCredential(res){
    if(await verified(res.credential)){
      try{sessionStorage.setItem('jm_idt',res.credential);}catch(e){}
      unlock();
    }else{
      msg.textContent='このアカウントでは閲覧できません';
      err.textContent='許可されたGoogleアカウントでログインしてください';
      try{google.accounts.id.disableAutoSelect();}catch(e){}
    }
  }

  async function boot(){
  var cached=null; try{cached=sessionStorage.getItem('jm_idt');}catch(e){}
  if(cached&&await verified(cached)){unlock();return;}

  var s=document.createElement('script');
  s.src='https://accounts.google.com/gsi/client';
  s.onload=function(){
    google.accounts.id.initialize({client_id:CLIENT_ID,callback:onCredential,auto_select:true});
    google.accounts.id.prompt();
    // One Tap が出ない場合の非常口（?sso=manual 時のみ、インラインの標準ボタン）
    if(location.search.indexOf('sso=manual')!==-1){
      google.accounts.id.renderButton($('g-btn'),{theme:'filled_blue',size:'large',text:'signin_with'});
    }
  };
  s.onerror=function(){msg.textContent='Googleログインを読み込めませんでした';};
  document.head.appendChild(s);
  msg.textContent='Googleアカウントでログインしてください';
  }
  boot();
})();
