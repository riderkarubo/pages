  if(cached&&await verified(cached)){unlock();return;}

  var s=document.createElement('script');
  s.src='https://accounts.google.com/gsi/client';
  s.onload=function(){
    google.accounts.id.initialize({client_id:CLIENT_ID,callback:onCredential,auto_select:true});
    google.accounts.id.prompt();
    // One Tap が出ない場合の非常口（?sso=manual 時のみ、インラインの標準ボタン）
    if(location.search.indexOf('sso=manual')!==-1){
      google.accounts.id.renderButton($('g-btn'),{theme:'filled_blue',size:'large',text:'signin_with'});
    }
  };
  s.onerror=function(){msg.textContent='Googleログインを読み込めませんでした';};
  document.head.appendChild(s);
  msg.textContent='Googleアカウントでログインしてください';
  }
  boot();
})();
</script>
</body>
</html>
