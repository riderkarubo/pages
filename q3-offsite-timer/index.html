<!DOCTYPE html>
<html lang="ja">
<head>
  <script src="../mccm-proposal/auth.js"></script>
  <script>document.addEventListener('DOMContentLoaded',function(){FireworkSSO.protect();});</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FY26 Q3 OffSite Timer</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⏱️</text></svg>">
  <meta name="description" content="Firework Japan FY26 Q3 OffSite のタイムキープアプリ">
  <meta property="og:title" content="FY26 Q3 OffSite Timer">
  <meta property="og:description" content="Firework Japan FY26 Q3 OffSite のタイムキープアプリ">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://riderkarubo.github.io/pages/q3-offsite-timer/">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="FY26 Q3 OffSite Timer">
  <meta name="twitter:description" content="Firework Japan FY26 Q3 OffSite のタイムキープアプリ">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .session-card {
      transition: all 0.2s ease;
    }
    .session-card:hover {
      transform: translateX(4px);
    }
    .current-session {
      animation: pulse-border 2s infinite;
    }
    @keyframes pulse-border {
      0%, 100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.5); }
      50% { box-shadow: 0 0 0 8px rgba(59, 130, 246, 0); }
    }
    .delay-btn {
      min-width: 44px;
      height: 44px;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      cursor: pointer;
      user-select: none;
    }
    button {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen">
  <div id="app" class="max-w-2xl mx-auto p-4 pb-24">
    <!-- Header -->
    <header class="bg-white rounded-xl shadow-lg p-4 mb-4 sticky top-2 z-10">
      <div class="flex justify-between items-center">
        <div class="flex items-center gap-3">
          <h1 class="text-xl font-bold text-gray-800">OffSite Timer</h1>
          <button onclick="resetAllDelays()" class="text-xs px-3 py-1 bg-gray-100 hover:bg-gray-200 text-gray-600 rounded-lg transition-colors">
            リセット
          </button>
        </div>
        <div class="text-right">
          <div id="current-time" class="text-2xl font-mono font-bold text-blue-600"></div>
          <div id="total-delay" class="text-lg font-bold text-red-500"></div>
        </div>
      </div>
      <div id="current-session-info" class="mt-3 p-3 bg-blue-50 rounded-lg hidden">
        <div class="text-sm text-blue-600 font-medium">現在進行中</div>
        <div id="current-session-title" class="text-lg font-bold text-blue-800"></div>
        <div id="current-session-time" class="text-sm text-blue-600"></div>
      </div>
    </header>

    <!-- Schedule List -->
    <div id="schedule-list" class="space-y-2">
      <!-- Generated by JavaScript -->
    </div>
  </div>

  <script>
    // ========================================
    // 初期スケジュールデータ（全セッション）
    // ========================================
    const initialSchedule = [
      { id: 1, time: "11:00", duration: 10, title: "Opening", detail: "開会", delay: 0 },
      { id: 2, time: "11:10", duration: 60, title: "四半期振り返り＆次期戦略方針", detail: "Kazuki — Q2振り返り・Q3戦略方針の共有", delay: 0 },
      { id: 3, time: "12:10", duration: 40, title: "昼休憩", detail: "ランチ休憩", delay: 0 },
      { id: 4, time: "12:50", duration: 10, title: "Pre-Mortem進捗共有（Q2分）", detail: "Missy — Q2 Pre-Mortemで洗い出した課題の対応状況を確認", delay: 0 },
      { id: 5, time: "13:00", duration: 70, title: "Revenue Growthワークショップ（前半）", detail: "Midori — なぜ新規・アップセルでARRを伸ばせないのかを発散", delay: 0 },
      { id: 6, time: "14:10", duration: 20, title: "休憩＆AI整理", detail: "休憩", delay: 0 },
      { id: 7, time: "14:30", duration: 60, title: "Revenue Growthワークショップ（後半）", detail: "Midori — 前半うけてアクションを整理", delay: 0 },
      { id: 8, time: "15:30", duration: 10, title: "Short Break", detail: "休憩", delay: 0 },
      { id: 9, time: "15:40", duration: 180, title: "AIGC戦略ワークショップ", detail: "Nobu — 業界別チームで実戦アウトプットを制作・発表", delay: 0 },
      { id: 10, time: "18:40", duration: 5, title: "Closing", detail: "クロージング", delay: 0 },
      { id: 11, time: "18:45", duration: 15, title: "移動＆片付け", detail: "🧹 片付け・撤収準備 → 懇親会場へ移動", delay: 0 },
      { id: 12, time: "19:00", duration: 0, title: "懇親会", detail: "お疲れ様でした！", delay: 0 },
    ];

    // アプリケーション状態
    let schedule = JSON.parse(JSON.stringify(initialSchedule));

    // LocalStorageから復元
    const savedData = localStorage.getItem('offsite-schedule-q3');
    if (savedData) {
      try {
        const parsed = JSON.parse(savedData);
        // delayのみ復元
        schedule = schedule.map(item => {
          const saved = parsed.find(s => s.id === item.id);
          return saved ? { ...item, delay: saved.delay } : item;
        });
      } catch (e) {
        console.error('Failed to load saved data', e);
      }
    }

    // ========================================
    // ヘルパー関数
    // ========================================

    // 時間文字列を分に変換 ("12:30" -> 750)
    function timeToMinutes(timeStr) {
      const [hours, minutes] = timeStr.split(':').map(Number);
      return hours * 60 + minutes;
    }

    // 分を時間文字列に変換 (750 -> "12:30")
    function minutesToTime(totalMinutes) {
      const hours = Math.floor(totalMinutes / 60);
      const minutes = totalMinutes % 60;
      return `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}`;
    }

    // 現在時刻を取得（分単位）
    function getCurrentMinutes() {
      const now = new Date();
      return now.getHours() * 60 + now.getMinutes();
    }

    // ========================================
    // コア計算ロジック
    // ========================================
    function calculateSchedule() {
      const baseMinutes = timeToMinutes(schedule[0].time);
      let currentMinutes = baseMinutes;

      return schedule.map((item, index) => {
        const originalStart = timeToMinutes(item.time);
        const actualStart = currentMinutes;
        const actualEnd = actualStart + item.duration + item.delay;

        // 次のアイテムの開始時間を更新
        currentMinutes = actualEnd;

        // 遅延計算（予定開始時刻との差分）
        const startDiff = actualStart - originalStart;

        return {
          ...item,
          originalTime: item.time,
          actualStartTime: minutesToTime(actualStart),
          actualEndTime: minutesToTime(actualEnd),
          startDiff: startDiff,
          isDelayed: item.delay > 0 || startDiff > 0
        };
      });
    }

    // 合計ディレイ計算
    function getTotalDelay() {
      return schedule.reduce((sum, item) => sum + item.delay, 0);
    }

    // 現在進行中のセッションを取得
    function getCurrentSession(calculated) {
      const currentMinutes = getCurrentMinutes();

      for (const session of calculated) {
        const start = timeToMinutes(session.actualStartTime);
        const end = timeToMinutes(session.actualEndTime);

        if (currentMinutes >= start && currentMinutes < end) {
          return session;
        }
      }
      return null;
    }

    // ========================================
    // UI更新関数
    // ========================================
    function updateDelay(id, change) {
      schedule = schedule.map(item => {
        if (item.id === id) {
          const newDelay = item.delay + change;
          return { ...item, delay: newDelay };
        }
        return item;
      });

      // LocalStorageに保存
      localStorage.setItem('offsite-schedule-q3', JSON.stringify(schedule.map(s => ({ id: s.id, delay: s.delay }))));

      render();
    }

    function render() {
      const calculated = calculateSchedule();
      const totalDelay = getTotalDelay();
      const currentSession = getCurrentSession(calculated);
      const currentMinutes = getCurrentMinutes();

      // 合計ディレイ表示
      const delayEl = document.getElementById('total-delay');
      if (totalDelay > 0) {
        delayEl.textContent = `🔺 ${totalDelay}分遅延`;
        delayEl.className = 'text-lg font-bold text-red-500';
      } else if (totalDelay < 0) {
        delayEl.textContent = `🔽 ${Math.abs(totalDelay)}分前倒し`;
        delayEl.className = 'text-lg font-bold text-blue-500';
      } else {
        delayEl.textContent = '✅ 予定通り';
        delayEl.className = 'text-lg font-bold text-green-500';
      }

      // 現在進行中セッション
      const currentInfo = document.getElementById('current-session-info');
      const currentTitle = document.getElementById('current-session-title');
      const currentTime = document.getElementById('current-session-time');

      if (currentSession) {
        currentInfo.classList.remove('hidden');
        currentTitle.textContent = currentSession.title;
        currentTime.textContent = `${currentSession.actualStartTime} - ${currentSession.actualEndTime}`;
      } else {
        currentInfo.classList.add('hidden');
      }

      // スケジュールリスト
      const listEl = document.getElementById('schedule-list');
      listEl.innerHTML = calculated.map((item, index) => {
        const isCurrent = currentSession && currentSession.id === item.id;
        const isPast = timeToMinutes(item.actualEndTime) < currentMinutes;
        const hasDelay = item.delay !== 0;
        const isStartDelayed = item.startDiff > 0;
        const isStartEarly = item.startDiff < 0;

        let borderColor = 'border-blue-500';
        let bgColor = 'bg-white';

        if (isPast) {
          borderColor = 'border-gray-300';
          bgColor = 'bg-gray-50';
        } else if (isCurrent) {
          borderColor = 'border-blue-500';
          bgColor = 'bg-blue-50';
        } else if (item.delay > 0) {
          borderColor = 'border-red-500';
        } else if (item.delay < 0) {
          borderColor = 'border-blue-500';
        } else if (isStartDelayed) {
          borderColor = 'border-orange-400';
        } else if (isStartEarly) {
          borderColor = 'border-blue-400';
        }

        return `
          <div class="session-card border-l-4 ${borderColor} ${bgColor} rounded-r-lg p-4 shadow ${isCurrent ? 'current-session' : ''} ${isPast ? 'opacity-60' : ''}">
            <div class="flex justify-between items-start gap-4">
              <div class="flex-1">
                <div class="flex items-center gap-2 mb-1">
                  <span class="text-lg font-bold ${isStartDelayed && !isPast ? 'text-red-600' : 'text-gray-800'}">
                    ${item.actualStartTime}
                  </span>
                  <span class="text-gray-400">→</span>
                  <span class="text-lg font-bold text-gray-600">
                    ${item.actualEndTime}
                  </span>
                  ${isStartDelayed && !isPast ? `<span class="text-xs bg-red-100 text-red-600 px-2 py-0.5 rounded-full">+${item.startDiff}分</span>` : ''}
                  ${isStartEarly && !isPast ? `<span class="text-xs bg-blue-100 text-blue-600 px-2 py-0.5 rounded-full">${item.startDiff}分</span>` : ''}
                </div>
                <div class="text-gray-500 text-sm line-through ${(isStartDelayed || isStartEarly) ? '' : 'hidden'}">
                  予定: ${item.originalTime}
                </div>
                <div class="font-semibold text-gray-800 mt-1">${item.title}</div>
                <div class="text-sm text-gray-500">${item.detail}</div>
                <div class="text-xs text-gray-400 mt-1">所要時間: ${item.duration}分</div>
              </div>

              <div class="flex flex-col items-center gap-1">
                <div class="text-xs text-gray-500 mb-1">時間調整</div>
                <div class="flex items-center gap-1">
                  <button
                    data-delay-id="${item.id}" data-delay-change="-1"
                    class="delay-btn flex items-center justify-center bg-gray-200 hover:bg-gray-300 text-gray-600 rounded-lg font-bold transition-colors"
                  >-1</button>
                  <span class="w-10 text-center font-bold text-lg ${item.delay > 0 ? 'text-red-600' : item.delay < 0 ? 'text-blue-600' : 'text-gray-400'}">
                    ${item.delay > 0 ? '+' : ''}${item.delay}
                  </span>
                  <button
                    data-delay-id="${item.id}" data-delay-change="1"
                    class="delay-btn flex items-center justify-center bg-gray-200 hover:bg-gray-300 rounded-lg font-bold text-gray-600 transition-colors"
                  >+1</button>
                </div>
                <div class="flex gap-1 mt-1">
                  <button
                    data-delay-id="${item.id}" data-delay-change="-5"
                    class="delay-btn flex items-center justify-center bg-gray-200 hover:bg-gray-300 text-gray-500 rounded-lg font-bold transition-colors"
                  >-5</button>
                  <button
                    data-delay-id="${item.id}" data-delay-change="5"
                    class="delay-btn flex items-center justify-center bg-gray-200 hover:bg-gray-300 rounded-lg font-bold text-gray-500 transition-colors"
                  >+5</button>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // 現在時刻更新
    function updateClock() {
      const now = new Date();
      const timeStr = now.toLocaleTimeString('ja-JP', {
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
      });
      document.getElementById('current-time').textContent = timeStr;
    }

    // リセット機能
    function resetAllDelays() {
      if (confirm('全てのディレイをリセットしますか？')) {
        schedule = JSON.parse(JSON.stringify(initialSchedule));
        localStorage.removeItem('offsite-schedule-q3');
        render();
      }
    }

    // render抑制フラグ（ボタン操作直後の自動renderを防ぐ）
    let lastInteraction = 0;

    // 初期化
    document.addEventListener('DOMContentLoaded', () => {
      render();
      updateClock();

      // イベント委譲: data-delay-id を持つボタンのクリック/タップを捕捉
      document.getElementById('schedule-list').addEventListener('click', (e) => {
        const btn = e.target.closest('[data-delay-id]');
        if (!btn) return;
        e.preventDefault();
        e.stopPropagation();
        const id = parseInt(btn.dataset.delayId, 10);
        const change = parseInt(btn.dataset.delayChange, 10);
        lastInteraction = Date.now();
        updateDelay(id, change);
      });

      // 1秒ごとに時計更新
      setInterval(updateClock, 1000);

      // 30秒ごとにセッション状態更新（操作直後2秒は再描画をスキップ）
      setInterval(() => {
        if (Date.now() - lastInteraction > 2000) {
          render();
        }
      }, 30000);
    });
  </script>
</body>
</html>
