/* ==== AIGC進捗ボード 夜のドラクエスキン（③A承認版・ハイブリッド字） ==== */
:root{--ink:#FFFFFF;--accent:#FA006D;--accent-text:#FF3D8F;--teal:#57E389;--navy:#10173F;--bg:#0A0D24;--card:#1B2364;--border:rgba(255,255,255,.45);--muted:#C9D1F5;
--active:#57E389;--warn:#FFD75E;--danger:#FF6B6B;--hold:#8A93C4;--check:#9BD1FF;--gold:#FFD75E;--win2:#10173F;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans JP",sans-serif;background-color:var(--bg);color:var(--ink);line-height:1.8;font-size:15px}
#lock{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:1000}
.lockbox{background:var(--card);border:3px solid #fff;border-radius:4px;box-shadow:inset 0 0 0 3px var(--card),inset 0 0 0 4px #fff,0 6px 0 rgba(0,0,0,.45);padding:40px 36px;width:min(92vw,400px);text-align:center;color:#fff}
.lockbox h1{font-size:1.2rem;margin-bottom:6px;color:#fff;font-family:"DotGothic16",monospace;font-weight:normal}
.lockbox .em{font-size:2.2rem;margin-bottom:10px}
.lockbox p{color:var(--muted);font-size:.9rem;margin-bottom:20px}
.lockbox .gwrap{display:flex;justify-content:center;min-height:44px}
.lockbox .err{color:var(--danger);font-size:.85rem;min-height:1.2em;margin-top:14px}
.lockbox .note{color:#A9B2E0;font-size:.75rem;margin-top:16px}
#app{display:none;max-width:1180px;margin:0 auto;padding:0 0 60px}
header{background:var(--card);border:3px solid #fff;border-radius:4px;box-shadow:inset 0 0 0 3px var(--card),inset 0 0 0 4px #fff,0 6px 0 rgba(0,0,0,.45);color:#fff;padding:26px 30px 22px;margin:16px 16px 0}
header .eyebrow{color:var(--accent-text);font-weight:700;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase}
header h1{font-size:1.6rem;font-weight:900;margin:6px 0 4px;text-shadow:3px 3px 0 rgba(0,0,0,.5)}
header .goal{color:#E4E8FF;font-size:.92rem;max-width:820px;margin-top:8px}
header .ts{color:var(--muted);font-size:.78rem;margin-top:12px}
.wrap{padding:0 32px}
.section-title{display:inline-block;font-size:1rem;font-weight:900;margin:32px 0 14px;padding:5px 18px;background:var(--card);border:2px solid #fff;border-radius:3px;box-shadow:0 4px 0 rgba(0,0,0,.45)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px;margin-top:24px}
.kpi{background:var(--card);border:3px solid #fff;border-radius:4px;box-shadow:inset 0 0 0 3px var(--card),inset 0 0 0 4px #fff,0 6px 0 rgba(0,0,0,.45);padding:14px 16px}
.kpi .v{font-family:"Press Start 2P","DotGothic16",monospace;font-size:1.05rem;font-weight:400;line-height:1.5;overflow-wrap:anywhere}
.kpi .l{font-size:.8rem;color:var(--muted);margin-top:6px}
.kpi .u{font-size:.75rem;color:var(--muted)}
.kpi.active .v{color:var(--active)}.kpi.warn .v{color:var(--warn)}.kpi.danger .v{color:var(--danger)}.kpi.muted .v{color:var(--hold)}
.pipe{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.pstage{background:var(--card);border:3px solid #fff;border-radius:4px;box-shadow:inset 0 0 0 3px var(--card),inset 0 0 0 4px #fff,0 6px 0 rgba(0,0,0,.45);padding:14px}
.pstage h3{font-size:.9rem;font-weight:900;display:flex;justify-content:space-between;align-items:center;color:#fff;font-family:"DotGothic16",monospace}
.pstage .cnt{background:transparent;color:var(--gold);border:1px solid var(--gold);border-radius:2px;font-size:.72rem;padding:1px 9px}
.pstage.empty{opacity:.72}
.pstage.empty .cnt{background:transparent;border-color:var(--danger);color:var(--danger)}
.chip{display:inline-block;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.35);border-radius:2px;padding:3px 8px;font-size:.78rem;margin:4px 4px 0 0;color:#E4E8FF}
.pstage .note{font-size:.78rem;color:var(--muted);margin-top:8px;line-height:1.6}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.cat{background:var(--card);border:3px solid #fff;border-radius:4px;box-shadow:inset 0 0 0 3px var(--card),inset 0 0 0 4px #fff,0 6px 0 rgba(0,0,0,.45);padding:16px}
.cat .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.cat h3{font-size:1rem;font-weight:900;color:#fff;font-family:"DotGothic16",monospace}
.badge{font-size:.75rem;font-weight:700;padding:2px 10px;border-radius:2px;color:#fff;white-space:nowrap;border:1px solid;background:transparent}
.badge.active{border-color:var(--active);color:var(--active)}.badge.muted{border-color:var(--hold);color:var(--hold)}.badge.warn{border-color:var(--warn);color:var(--warn)}
.cat .leads{margin:6px 0 8px}
.cat .desc{font-size:.84rem;color:#E4E8FF;line-height:1.7}
.areas{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:14px}
.acard{background:var(--card);border:3px solid #fff;border-radius:4px;box-shadow:inset 0 0 0 3px var(--card),inset 0 0 0 4px #fff,0 6px 0 rgba(0,0,0,.45);overflow:hidden;display:flex;flex-direction:column}
.acard .ah{padding:14px 16px;display:flex;gap:10px;align-items:flex-start;border-bottom:1px solid rgba(255,255,255,.35)}
.sdot{width:10px;height:10px;border-radius:0;margin-top:8px;flex-shrink:0}
.s-進行中{background:var(--active)}.s-停滞{background:var(--warn)}.s-先方検討中{background:var(--warn)}.s-保留{background:var(--hold)}
.s-完了{background:var(--check)}.s-検討中{background:#8FB7FF}.s-未着手{background:rgba(255,255,255,.3)}.s-アポ確定{background:#FF3D8F;box-shadow:0 0 6px #FF3D8F}
.acard h3{font-size:1rem;font-weight:900;color:#fff;font-family:"DotGothic16",monospace}
.acard .cat-tag{font-size:.72rem;color:var(--muted);font-weight:700}
.acard .stat{margin-left:auto;font-size:.75rem;font-weight:700;padding:2px 9px;border-radius:2px;white-space:nowrap;align-self:flex-start;border:1px solid transparent}
.stat.進行中{background:rgba(87,227,137,.15);color:#7BEFA8;border-color:#57E389}.stat.停滞{background:rgba(255,215,94,.14);color:var(--warn);border-color:var(--warn)}.stat.先方検討中{background:rgba(255,215,94,.14);color:var(--warn);border-color:var(--warn)}.stat.保留{background:rgba(255,255,255,.1);color:var(--hold);border-color:var(--hold)}
.stat.完了{background:rgba(155,209,255,.15);color:var(--check);border-color:var(--check)}.stat.検討中{background:rgba(143,183,255,.15);color:#8FB7FF;border-color:#8FB7FF}.stat.未着手{background:rgba(255,255,255,.08);color:#A9B2E0;border-color:#A9B2E0}.stat.アポ確定{background:rgba(250,0,109,.25);color:#FF9EC4;font-weight:800;border-color:#FF3D8F}
.client-stack{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;margin-top:14px}
.acard .ab{padding:12px 16px}
.acard .head{font-size:.9rem;font-weight:700;color:var(--gold);margin-bottom:6px}
.acard .sum{font-size:.84rem;color:#E4E8FF;line-height:1.7}
.acard details{margin-top:10px}
.acard summary{cursor:pointer;font-size:.8rem;font-weight:700;color:var(--check);padding:6px 0;user-select:none}
.acard summary:hover{color:var(--gold)}
.sub{font-size:.75rem;font-weight:700;color:var(--gold);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.04em}
.acard ul{list-style:none;font-size:.82rem}
.acard .itm{padding:5px 0;border-bottom:1px solid rgba(255,255,255,.22);display:flex;gap:6px;flex-wrap:wrap;align-items:baseline}
.acard .itm .nm{font-weight:700;color:#fff}
.acard .itm .st{font-size:.72rem;background:rgba(255,255,255,.12);border-radius:2px;padding:1px 6px;color:var(--muted)}
.acard .itm .nt{color:var(--muted);font-size:.78rem;width:100%}
.acard .na{padding:4px 0;font-size:.82rem}
.acard .na .o{color:var(--accent-text);font-weight:700;font-size:.75rem}
.acard .rk{padding:4px 0 4px 16px;font-size:.8rem;color:#FFDFA3;position:relative}
.acard .rk:before{content:"▲";position:absolute;left:0;color:var(--warn);font-size:.6rem;top:9px}
.acard .src{font-size:.72rem;color:#9AA3D8;margin-top:8px}
.na-table{width:100%;border-collapse:collapse;background:var(--card);border:2px solid #fff;border-radius:4px;overflow:hidden;font-size:.85rem}
.na-table th{background:var(--win2);color:var(--gold);text-align:left;padding:9px 12px;font-size:.78rem;font-weight:700;border-bottom:2px solid rgba(255,255,255,.6)}
.na-table td{padding:9px 12px;border-top:1px solid rgba(255,255,255,.28);vertical-align:top}
.na-table tr:hover td{background:rgba(255,255,255,.08)}
.pri{font-size:.72rem;font-weight:700;padding:1px 8px;border-radius:2px;color:#fff;border:1px solid #fff}
.pri.高{background:var(--accent);border-color:#fff}.pri.中{background:transparent;border-color:var(--warn);color:var(--warn)}.pri.低{background:transparent;border-color:var(--hold);color:var(--hold)}
.risklist,.gaplist{background:var(--card);border:2px solid #fff;border-radius:4px;padding:8px 8px}
.risklist li,.gaplist li{list-style:none;padding:9px 12px 9px 30px;position:relative;font-size:.85rem;border-bottom:1px solid rgba(255,255,255,.22)}
.risklist li:last-child,.gaplist li:last-child{border:none}
.risklist li:before{content:"⚠";position:absolute;left:10px;color:var(--warn)}
.gaplist li:before{content:"○";position:absolute;left:11px;color:var(--check);font-size:.7rem;top:11px}
footer{text-align:center;color:var(--muted);font-size:.8rem;margin-top:40px;padding:20px}
/* === 優先順位マトリクス・期限赤フラグ・営業武器 === */
.due-cell.miss{color:#FF6B6B;font-weight:700;white-space:nowrap}
.sec-note b{color:var(--accent-text)}
.excard.ex-team .bar{background:var(--check)}
.pm-wrap{overflow:auto;max-height:80vh;background:var(--card);border:3px solid #fff;border-top:none;border-radius:0 0 4px 4px}
.pm-table{width:100%;border-collapse:collapse;font-size:.82rem;min-width:880px}
.pm-table th{background:var(--win2);font-size:.72rem;color:var(--gold);padding:8px 6px;text-align:center;border-bottom:1px solid rgba(255,255,255,.4);white-space:nowrap}
.pm-table thead th{position:sticky;top:0;z-index:3}
.pm-block{margin-bottom:20px}
.pm-cap{display:flex;align-items:center;gap:9px;font-size:.9rem;font-weight:900;color:#fff;padding:9px 14px;border:3px solid #fff;border-bottom:none;border-radius:4px 4px 0 0;cursor:pointer;user-select:none}
.pm-cap.cap-adv{background:#C20055}
.pm-cap.cap-ex{background:#1D2F8F}

.pm-chevron{display:inline-block;font-size:.7rem;transition:transform .15s ease}

.pm-block.collapsed .pm-wrap{display:none}
.pm-block.collapsed .pm-chevron{transform:rotate(-90deg)}
.rc-chip{display:inline-block;margin-left:4px;font-size:.78rem;vertical-align:middle;opacity:.9}
.pdate{display:block;font-size:.7rem;color:var(--muted);margin-top:3px;font-weight:700}
.pm-cnt{font-size:.72rem;font-weight:700;background:rgba(255,255,255,.25);border-radius:2px;padding:1px 9px}
.pm-goal{font-size:.72rem;font-weight:800;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.7);border-radius:2px;padding:2px 10px;letter-spacing:.01em}
.pm-table th.pmc .pmw{display:block;color:#FF9EC4;font-weight:900}
.pm-table td{padding:7px 6px;border-bottom:1px solid rgba(255,255,255,.18);text-align:center;vertical-align:middle}
.pm-table tr:last-child td{border-bottom:none}
.pm-table tr.top3{background:rgba(255,61,143,.08)}
.pm-table .pmr{font-weight:900;color:var(--muted)}
.pm-table tr.top3 .pmr{color:#FF9EC4}
.pm-table .pmn{text-align:left;font-weight:700;white-space:nowrap;position:sticky;left:0;z-index:2;background:var(--card)}
.pm-table tr.top3 td.pmn{background:#2A2670}
.pm-table tr.pm-ivs td.pmn{background:#1A2A6E}

.pm-table .pmn a{color:#fff;text-decoration:underline;text-decoration-color:#FF7FB4}
.pm-table .pmn .pmstage{display:block;font-weight:400;font-size:.7rem;color:var(--muted)}
.pm-table .pmn .pmtype{display:inline-block;font-size:.68rem;padding:1px 5px;border-radius:2px;margin-top:2px;font-weight:700;vertical-align:middle}
.pm-table .pmn .pmtype-ex{background:rgba(155,209,255,.18);color:#9BD1FF}
.pm-table .pmn .pmtype-new{background:rgba(255,215,94,.18);color:#FFD75E}
.pm-table .pms{color:#A9B2E0}
.pm-table .pms.v4,.pm-table .pms.v5{color:#fff;font-weight:700}
.pm-table .pms.v5{color:#FF9EC4}
.pm-table .pms .q{color:#FF6B6B;font-size:.68rem;vertical-align:super}
.pm-table .pmt{min-width:74px}
.pm-table .pmt b{font-family:"Press Start 2P","DotGothic16",monospace;font-size:.72rem;font-weight:400}
.pm-table .pmt .bar{height:8px;background:var(--win2);border:1px solid rgba(255,255,255,.35);border-radius:0;margin-top:3px}
.pm-table .pmt .bar i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--active) 0 6px,#35C06A 6px 9px);border-radius:0}
.pm-table .pmnote{text-align:left;font-size:.76rem;color:var(--muted);min-width:230px;line-height:1.6}
.pm-disc{font-size:.78rem;color:var(--muted);margin:10px 2px 0;padding-left:10px;border-left:3px solid var(--warn)}
.bmk{margin-top:16px;background:var(--card);border:3px solid #fff;border-radius:4px;box-shadow:inset 0 0 0 3px var(--card),inset 0 0 0 4px #fff,0 6px 0 rgba(0,0,0,.45);padding:16px 18px}
.bmk-h{font-weight:900;font-size:.95rem;margin-bottom:8px;color:#fff;font-family:"DotGothic16",monospace}
.bmk-pitch{font-size:.85rem;background:var(--win2);border:1px solid rgba(255,255,255,.3);border-left:3px solid var(--warn);padding:8px 12px;border-radius:0 4px 4px 0;margin-bottom:12px;line-height:1.75;color:#FFEFC4}

.bmk-card{border:2px solid rgba(255,255,255,.5);border-radius:4px;padding:12px 14px;border-top:3px solid var(--active);background:#141C52}
.bmk-card .bn{font-weight:900;font-size:.9rem;color:#fff}
.bmk-card .bs{font-size:.82rem;color:#E4E8FF;margin:4px 0}

.bmk-card .bmk-link{display:inline-block;margin-top:8px;margin-right:10px;font-size:.78rem;font-weight:700;color:#FF9EC4;text-decoration:none}

.cs-stack{display:flex;flex-direction:column;gap:10px;margin-top:8px}

.cs-item .cs-links .bmk-link:hover{background:var(--accent);color:#fff;border-color:#fff;text-decoration:none}
/* === ストーリー再編・WIPバッジ・ロードマップ === */
.wip{display:inline-block;margin-left:10px;background:rgba(255,215,94,.15);color:var(--warn);border:1px solid var(--warn);border-radius:2px;padding:2px 10px;font-size:.7rem;font-weight:700;vertical-align:middle}
.road{display:flex;align-items:stretch;gap:10px;flex-wrap:wrap;background:transparent;border:none;border-radius:0;padding:14px 0 4px}
.rstep{flex:1;min-width:160px;position:relative;border:3px solid #fff;border-radius:4px;padding:16px 14px 12px;text-align:center;background:var(--card);box-shadow:inset 0 0 0 3px var(--card),inset 0 0 0 4px #fff,0 6px 0 rgba(0,0,0,.45)}

.rlb{font-size:1.05rem;font-weight:900;margin-top:2px;color:#fff}
.rds{font-size:.78rem;color:var(--muted);margin-top:4px;line-height:1.6}
.rwh{font-size:.74rem;font-weight:700;color:var(--check);margin-top:6px}
.rarw{align-self:center;color:var(--gold);font-weight:900;font-size:1.2rem}
/* === 詳細ページリンクボタン === */
.detail-btn{display:inline-flex;align-items:center;gap:6px;margin-top:12px;background:var(--win2);border:2px solid #fff;color:#fff;text-decoration:none;font-size:.8rem;font-weight:700;padding:7px 14px;border-radius:2px;transition:background .15s,transform .1s}
.detail-btn:hover{background:var(--accent);transform:translateX(2px)}
.acard .detail-btn{margin-top:10px;align-self:flex-start}

.sec-note{font-size:.84rem;color:var(--muted);margin:-6px 0 14px;padding-left:12px}
.projgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.projcard{background:var(--card);border:3px solid #fff;border-radius:4px;box-shadow:inset 0 0 0 3px var(--card),inset 0 0 0 4px #fff,0 6px 0 rgba(0,0,0,.45);padding:16px 18px;display:flex;flex-direction:column}
.projcard .pj-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}

.bulk-table .bt-range{font-weight:800;color:#9BD1FF;text-align:left}
.bulk-table .bt-jpy{font-weight:800;color:#FF9EC4}
.bulk-table tbody tr:hover{background:rgba(255,255,255,.08)}
.bulk-note{font-size:.78rem;color:var(--muted);text-align:left;padding:8px 10px;line-height:1.6}
.tb-lead{font-size:.88rem;color:#E4E8FF;margin:-4px 0 14px;padding-left:12px;line-height:1.8}
.tb-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.tb-card{background:var(--card);border:3px solid #fff;border-radius:4px;box-shadow:inset 0 0 0 3px var(--card),inset 0 0 0 4px #fff,0 6px 0 rgba(0,0,0,.45);padding:16px;position:relative}
.tb-card .tb-n{position:absolute;top:14px;right:14px;font-family:"Press Start 2P","DotGothic16",monospace;font-size:1.1rem;font-weight:400;color:rgba(255,255,255,.22);line-height:1}
.tb-card .tb-h{font-size:.95rem;font-weight:900;color:var(--gold);margin-bottom:6px;padding-right:24px;font-family:"DotGothic16",monospace}
.tb-card .tb-t{font-size:.84rem;color:#E4E8FF;line-height:1.75}
.pr-timeline-link{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--accent);border:3px solid #fff;color:#fff;text-decoration:none;font-weight:900;font-size:.95rem;padding:16px 22px;border-radius:4px;margin:22px 0 4px;box-shadow:0 4px 0 rgba(0,0,0,.4);transition:transform .15s,box-shadow .15s}
.pr-timeline-link:hover{transform:translateY(-2px);box-shadow:0 6px 0 rgba(0,0,0,.4)}
.pr-timeline-link .arr{font-size:1.3rem;font-weight:900}
.cl-learnings-link{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#17835A;border:3px solid #fff;color:#fff;text-decoration:none;font-weight:900;font-size:.95rem;padding:16px 22px;border-radius:4px;margin:22px 0 6px;box-shadow:0 4px 0 rgba(0,0,0,.4);transition:transform .15s,box-shadow .15s}
.cl-learnings-link:hover{transform:translateY(-2px);box-shadow:0 6px 0 rgba(0,0,0,.4)}
.cl-learnings-link .cl-sub{display:block;font-size:.78rem;font-weight:600;opacity:.92;margin-top:3px}
.cl-learnings-link .arr{font-size:1.3rem;font-weight:900}
/* === quick-links: トップのカード === */
.quick-links-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:18px 0 22px}
.ql-card{display:flex;align-items:center;gap:14px;color:#fff;text-decoration:none;font-weight:900;padding:18px 20px;border:3px solid #fff;border-radius:4px;box-shadow:0 4px 0 rgba(0,0,0,.4);transition:transform .15s,box-shadow .15s;min-height:84px}
.ql-card:hover{transform:translateY(-2px);box-shadow:0 6px 0 rgba(0,0,0,.4)}
.ql-card.ql-press{background:#C20055}
.ql-card.ql-price{background:#24329E}
.ql-card.ql-learn{background:#17835A}
.ql-card.ql-sample{background:#6D3FD9}
.ql-card.ql-tool{background:#A87500}
.ql-card .ql-icon{font-size:1.9rem;line-height:1;flex-shrink:0}
.ql-card .ql-body{flex:1;min-width:0}
.ql-card .ql-h{font-size:1rem;font-weight:900;letter-spacing:.02em;line-height:1.35}
.ql-card .ql-sub{display:block;font-size:.78rem;font-weight:600;opacity:.95;margin-top:4px;line-height:1.5}
.ql-card .ql-arr{font-size:1.3rem;font-weight:900;flex-shrink:0}
@media(max-width:900px){.quick-links-grid{grid-template-columns:1fr;gap:10px}}

/* === sa-block (スプシ採点アタックリスト) === */
.sa-block{margin-bottom:24px;border:3px solid var(--accent);border-radius:4px;padding:14px;background:#161E5C}
.sa-block .cap-sheet{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-weight:700;font-size:1.05rem;color:#fff;margin-bottom:10px;font-family:"DotGothic16",monospace}
.sa-block .sa-rule{font-size:.84rem;color:var(--muted);font-weight:400;margin-left:auto;font-family:"Noto Sans JP",sans-serif}
.sa-table th{background:var(--win2);color:var(--gold);font-size:.82rem;padding:6px 8px;font-weight:600;white-space:nowrap}
.sa-table td{font-size:.84rem;padding:6px 8px;vertical-align:top}
.sa-table tr.rk-s{background:rgba(255,215,94,.08)}
.sa-table tr.rk-a{background:rgba(255,215,94,.04)}
.sa-table tr.rk-b{background:rgba(155,209,255,.05)}
.sa-table tr.rk-c{background:rgba(255,255,255,.03);opacity:.9}
.rank-pill{display:inline-block;padding:2px 8px;border-radius:2px;font-size:.78rem;font-weight:700;color:#fff;border:1px solid;background:transparent}
.rank-pill.rk-s{border-color:var(--gold);color:var(--gold);background:rgba(255,215,94,.12)}
.rank-pill.rk-a{border-color:#fff;color:#fff}
.rank-pill.rk-b{border-color:#9BD1FF;color:#9BD1FF}
.rank-pill.rk-c{border-color:#8A93C4;color:#8A93C4}
.ifit{display:inline-block;font-weight:700;font-size:1rem}
.ifit-good{color:#7BEFA8}
.ifit-ok{color:#9BD1FF}
.ifit-mid{color:#FFD75E}
.ifit-bad{color:#FF8F8F}
.sa-lost{font-weight:600;color:#FF9E9E;white-space:nowrap}
.sa-reco{max-width:380px;line-height:1.55;color:#E4E8FF}
.sa-sf{font-family:"DotGothic16",monospace;font-size:.76rem;color:#B9C0E8}
.sa-note{font-size:.84rem;color:#E4E8FF;margin-top:8px;padding:8px 10px;background:var(--win2);border-left:3px solid var(--accent);border-radius:2px}
.rank-pill.rk-un{border-color:#A9B2E0;color:#A9B2E0}
.ifit-un{color:#A9B2E0;font-size:.78rem;font-weight:600}
.pm-table .pmind,.pm-table .pmsku,.pm-table .pmec{text-align:left;font-size:.78rem;color:#D5DAF5;white-space:normal;max-width:180px;line-height:1.45}
.pm-table .pmsku,.pm-table .pmec{max-width:200px}
.pm-table .pmn{min-width:200px;max-width:260px;white-space:normal;line-height:1.45;word-break:keep-all;overflow-wrap:anywhere;font-size:.8rem}
.pm-table .pmn a{word-break:keep-all;overflow-wrap:anywhere}
.pm-table .pmnote{max-width:200px;white-space:normal;font-size:.76rem;line-height:1.5;text-align:left}
.src-star{position:relative;display:inline-block;color:#FF9EC4;font-weight:900;text-decoration:none;margin:0 2px;cursor:pointer;border:1px solid #FF9EC4;border-radius:50%;width:15px;height:15px;line-height:13px;text-align:center;font-size:.62rem;vertical-align:middle;background:var(--win2);transition:background 0.1s,color 0.1s}
.src-star:hover{background:var(--accent);color:#fff}
.src-star::after{content:attr(data-tooltip);position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:var(--win2);border:2px solid #fff;color:#fff;padding:9px 13px;border-radius:4px;font-size:.76rem;font-weight:400;white-space:pre-line;max-width:340px;width:max-content;z-index:200;visibility:hidden;opacity:0;transition:opacity 0.12s,visibility 0.12s;pointer-events:none;text-align:left;line-height:1.65;box-shadow:0 4px 0 rgba(0,0,0,.5)}
.src-star::before{content:'';position:absolute;bottom:calc(100% + 2px);left:50%;transform:translateX(-50%);border:6px solid transparent;border-top-color:#fff;visibility:hidden;opacity:0;transition:opacity 0.12s,visibility 0.12s;z-index:201}
.src-star:hover::after,.src-star:hover::before{visibility:visible;opacity:1}
.pm-src-foot{margin-top:14px;padding:8px 10px;background:#141C52;border-radius:2px;border:1px solid rgba(255,255,255,.35);display:flex;flex-wrap:wrap;gap:5px;align-items:center;font-size:.74rem}
.pm-src-foot-h{font-size:.74rem;color:var(--muted);font-weight:600;margin-right:4px}
.src-pill{display:inline-block;padding:2px 7px;background:var(--win2);border:1px solid rgba(255,255,255,.4);border-radius:2px;font-size:.7rem;color:#D5DAF5;text-decoration:none;line-height:1.5;white-space:nowrap;transition:all 0.15s}
.src-pill:hover{background:var(--accent);color:#fff;border-color:#fff}
.price-btn{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;margin:14px 0;background:var(--accent);border:3px solid #fff;color:#fff;text-decoration:none;border-radius:4px;box-shadow:0 4px 0 rgba(0,0,0,.4);transition:transform 0.15s,box-shadow 0.15s}
.price-btn:hover{transform:translateY(-2px);box-shadow:0 6px 0 rgba(0,0,0,.4)}
.price-btn .pb-l{flex:1}
.price-btn .pb-title{font-size:1.1rem;font-weight:900;letter-spacing:.02em;margin-bottom:4px}
.price-btn .pb-sub{font-size:.84rem;opacity:.95;font-weight:400;line-height:1.6}
.price-btn .pb-r{display:flex;align-items:center;gap:14px;margin-left:18px}
.price-btn .pb-badge{display:inline-block;padding:3px 10px;background:rgba(255,255,255,.25);border:1px solid #fff;border-radius:2px;font-size:.74rem;font-weight:700;letter-spacing:.04em}
.price-btn .pb-arrow{font-size:1.5rem;font-weight:900}

/* === 夜DQ ハイブリッド字 割当（遊び担当＝ドット字） === */
header h1,header .eyebrow,.section-title,.sidenav,.pm-cap,.kpi .l,.kpi .u,
.na-table th,.pm-table th,.bulk-table th,.sa-table th,.rev-sub,.sub,
.badge,.stat,.ps,.cattag,.rank-pill,.chip,.pri,.wip,.pm-cnt,.pm-goal,.conf,.pmtype,.pm-table .pmn .pmtype,
.rnum,.rlb,.rnow,.excard .lb,.exhead2,.ex-slogan,.ql-card .ql-h,
.detail-btn,.trial-btn,.cl-link-panel .clp-btn,.cl-link-panel .clp-all,.hot-accounts-cta,.price-btn .pb-title,.pr-timeline-link,.cl-learnings-link,
footer{font-family:"DotGothic16",monospace}
.pr-timeline-link .cl-sub,.cl-learnings-link .cl-sub,.ql-card .ql-sub{font-family:"Noto Sans JP",sans-serif}

/* === 経験値バー（承認済みサンプル③A移植・売上進捗用） === */
.xp-wrap{margin:16px 0 2px}
.xp-row{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;font-size:.92rem}
.xp-lv{font-family:"DotGothic16",monospace}
.xp-lv .psp{font-family:"Press Start 2P","DotGothic16",monospace;font-size:.95rem;color:#57E389}
.xp-goal{color:#C9D1F5;font-size:.82rem}
.xp-track{margin-top:8px;height:26px;border:2px solid #fff;background:#10173F;padding:3px}
.xp-fill{height:100%;background:repeating-linear-gradient(90deg,#57E389 0 8px,#35C06A 8px 12px);animation:xpmove 1.8s linear infinite}
@keyframes xpmove{from{background-position:0 0}to{background-position:24px 0}}
.xp-scale{display:flex;justify-content:space-between;font-size:.82rem;margin-top:6px;flex-wrap:wrap;gap:6px}
.xp-scale .gap{color:#FFD75E;font-weight:700}

/* === RPGスキン追加ルール === */
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.pm-chevron{transition:none}.xp-fill{animation:none}}
</style>

const _b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decrypt(pass){
  const salt=_b64(PAYLOAD.salt),iv=_b64(PAYLOAD.iv),ct=_b64(PAYLOAD.ct);
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:PAYLOAD.iters,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct);
  return JSON.parse(new TextDecoder().decode(pt));
}
function _jwt(t){try{const p=t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');return JSON.parse(decodeURIComponent(escape(atob(p))));}catch(e){return null;}}
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function initSpy(){
  const links=[].slice.call(document.querySelectorAll('.sidenav a'));
  const map=links.map(a=>({a,el:document.getElementById(a.getAttribute('href').slice(1))})).filter(x=>x.el);
  if(!map.length)return;
  let raf=0;
  function compute(){
    raf=0;
    const y=window.pageYOffset;
    const nearBottom=y+window.innerHeight>=document.documentElement.scrollHeight-8;
    let cur=map[0];
    if(nearBottom){cur=map[map.length-1];}
    else{const cursor=y+90;for(const m of map){const top=m.el.getBoundingClientRect().top+y;if(top<=cursor)cur=m;else break;}}
    links.forEach(a=>a.classList.remove('active'));
    cur.a.classList.add('active');
  }
  const onScroll=()=>{if(!raf)raf=requestAnimationFrame(compute);};
  compute();
  window.addEventListener('scroll',onScroll,{passive:true});
  window.addEventListener('resize',onScroll);
}
function filterPM(btn,sales){document.querySelectorAll('.pm-flt').forEach(function(b){b.classList.remove('active');});btn.classList.add('active');document.querySelectorAll('.pm-table tr[data-sales]').forEach(function(r){r.style.display=(sales==='all'||r.dataset.sales===sales)?'':'none';});}

function wireFoldToggles(){
  document.querySelectorAll('details[data-fold-key]').forEach(function(d){

}
const SS_KEY='aigc_cred';
const SSO_TTL_MS=2592000000;/*30日=firework-sso-no-popup.md準拠の自前TTL*/
function showData(d){render(d);document.getElementById('lock').style.display='none';document.getElementById('app').style.display='block';}
// credential(GoogleのIDトークン)をドメイン検証。成功時はlocalStorageに保持し、
// 自前TTL(30日・SSO_TTL_MS)以内はGoogle側の再検証をスキップして無音ログインする。
function tryToken(credential,fromCache){
  return (async()=>{
    const info=_jwt(credential);
    const now=Math.floor(Date.now()/1000);
    const dom=info&&(info.hd||((info.email||'').split('@')[1])||'');
    const ok=fromCache?!!(info&&dom==='fireworkhq.com'&&info.aud===CLIENT_ID):!!(info&&dom==='fireworkhq.com'&&info.aud===CLIENT_ID&&(!info.exp||info.exp>now));
    if(!ok){try{localStorage.removeItem(SS_KEY);localStorage.removeItem(SS_KEY+'_exp');}catch(_){}
      if(!fromCache){document.getElementById('err').textContent='アクセス権がありません（@fireworkhq.com のみ）';}
      return false;}
    try{const d=await decrypt(PP);showData(d);try{localStorage.setItem(SS_KEY,credential);localStorage.setItem(SS_KEY+'_exp',String(Date.now()+SSO_TTL_MS));}catch(e){}return true;}
    catch(e){console.error('[aigc-board] decrypt/render error:',e);if(!fromCache){document.getElementById('err').textContent='データの復号に失敗しました（'+((e&&e.message)||e)+'）';}return false;}
  })();
}
function onCredential(resp){document.getElementById('err').textContent='認証中…';tryToken(resp.credential,false);}
function _oauthFallback(){
  try{
    const tc=google.accounts.oauth2.initTokenClient({
      client_id:CLIENT_ID,
      scope:'openid email profile',
      hd:'fireworkhq.com',
      callback:function(tr){
        if(tr.error){document.getElementById('err').textContent='ログインに失敗しました（'+tr.error+'）';return;}
        document.getElementById('err').textContent='認証中…';
        fetch('https://www.googleapis.com/oauth2/v3/userinfo',{headers:{Authorization:'Bearer '+tr.access_token}})
          .then(function(r){return r.json();})
          .then(function(info){
            if(!info||!info.email||!/@fireworkhq\.com$/.test(info.email)){
              document.getElementById('err').textContent='アクセス権がありません（@fireworkhq.com のみ）';return;
            }
            document.getElementById('err').textContent='読み込み中…';
            decrypt(PP).then(function(d){try{showData(d);}catch(e){console.error('[aigc-board] render error:',e);document.getElementById('err').textContent='描画でエラー（'+((e&&e.message)||e)+'）';}}).catch(function(e){console.error('[aigc-board] decrypt error:',e);document.getElementById('err').textContent='データの復号に失敗しました（'+((e&&e.message)||e)+'）';});
          })
          .catch(function(e){document.getElementById('err').textContent='ログイン情報の取得に失敗しました';});
      }
    });
    tc.requestAccessToken();
  }catch(e){document.getElementById('err').textContent='ログイン経路の初期化に失敗しました';}
}
function initGoogle(){
  if(!window.google||!google.accounts){document.getElementById('err').textContent='Googleログインを読み込めませんでした。再読み込みしてください';return;}
  google.accounts.id.initialize({client_id:CLIENT_ID,callback:onCredential,hd:'fireworkhq.com',auto_select:true});
  google.accounts.id.renderButton(document.getElementById('gbtn'),{theme:'filled_blue',size:'large',text:'signin_with',shape:'pill',width:280});
  google.accounts.id.prompt(function(notif){
    if(notif&&(notif.isNotDisplayed&&notif.isNotDisplayed()||notif.isSkippedMoment&&notif.isSkippedMoment()||notif.isDismissedMoment&&notif.isDismissedMoment())){
      console.warn('[FireworkSSO] One Tap not shown.');
      if(location.search.indexOf('sso=manual')!==-1){_oauthFallback();}
    }
  });
}
window.onload=function(){
  let cached=null;try{const _e=localStorage.getItem(SS_KEY+'_exp');if(_e&&Date.now()<parseInt(_e,10)){cached=localStorage.getItem(SS_KEY);}else{localStorage.removeItem(SS_KEY);localStorage.removeItem(SS_KEY+'_exp');}}catch(e){}
  if(cached){
    document.getElementById('err').textContent='読み込み中…';
    tryToken(cached,true).then(ok=>{if(!ok)initGoogle();});
  }else{initGoogle();}
};
