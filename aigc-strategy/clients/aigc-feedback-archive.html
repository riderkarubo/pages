<style>
:root{--ink:#1a1a2e;--accent:#FA006D;--teal:#1B998B;--navy:#0F3460;--bg:#f6f7f9;--card:#fff;--border:#e7e9ee;--muted:#6c757d;--active:#1B998B;--warn:#f5a623;--danger:#e74c3c;--hold:#8890a0;--check:#0F3460;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans JP",-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;font-size:14px}
#lock{position:fixed;inset:0;background:linear-gradient(135deg,#1a1a2e,#0F3460);display:flex;align-items:center;justify-content:center;z-index:1000}
.lockbox{background:#fff;border-radius:16px;padding:40px 36px;width:min(92vw,400px);text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.lockbox .em{font-size:2.2rem;margin-bottom:10px}
.lockbox h1{font-size:1.12rem;margin-bottom:6px}
.lockbox p{color:var(--muted);font-size:.82rem;margin-bottom:20px}
.lockbox .gwrap{display:flex;justify-content:center;min-height:44px}
.lockbox .err{color:var(--danger);font-size:.8rem;min-height:1.2em;margin-top:14px}
.lockbox .note{color:#aab;font-size:.68rem;margin-top:16px}
#app{display:none;max-width:980px;margin:0 auto;padding:0 0 60px}
header{color:#fff;padding:24px 32px 26px}
header .back{display:inline-block;color:#cdd3e0;font-size:.74rem;text-decoration:none;margin-bottom:14px;border:1px solid rgba(255,255,255,.25);border-radius:20px;padding:4px 12px;transition:background .15s}
header .back:hover{background:rgba(255,255,255,.12)}
header .cat-tag{color:var(--accent);font-weight:700;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase}
header h1{font-size:1.6rem;font-weight:900;margin:6px 0 8px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header .headline{color:#dfe4ee;font-size:.92rem;max-width:780px;margin-top:4px;line-height:1.6}
header .scope{margin-top:10px;font-size:.74rem;color:var(--muted);line-height:1.6}
.wrap{padding:0 32px}
.stats-row{display:flex;gap:12px;margin-top:22px;flex-wrap:wrap}
.stat-card{flex:1;min-width:140px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 16px;border-left:4px solid var(--accent)}
.stat-card .lbl{font-size:.7rem;color:var(--muted);font-weight:700;letter-spacing:.05em}
.stat-card .num{font-size:1.7rem;font-weight:900;color:var(--ink);line-height:1.1;margin-top:4px}
.stat-card .sub{font-size:.7rem;color:var(--muted);margin-top:2px}
.sec-h{font-size:1.05rem;font-weight:900;margin:32px 0 14px;padding-left:12px;border-left:4px solid var(--navy)}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:14px}
.card-h{font-size:.96rem;font-weight:900;color:var(--ink);margin-bottom:8px}
.card-sub{font-size:.74rem;color:var(--muted);margin-bottom:8px}
.card-body{font-size:.82rem;line-height:1.7}
.kv{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid #f0f1f4;font-size:.78rem}
.kv:last-child{border-bottom:none}
.kv .k{flex:0 0 140px;color:var(--muted);font-weight:700}
.kv .v{flex:1;color:var(--ink)}
.tbl{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;font-size:.78rem;margin:6px 0}
.tbl th{background:#f2f4f8;text-align:left;font-weight:700;color:var(--muted);padding:9px 12px;border-bottom:1px solid var(--border);font-size:.72rem}
.tbl td{padding:9px 12px;border-bottom:1px solid #f0f1f4;vertical-align:top;line-height:1.55}
.tbl tr:last-child td{border-bottom:none}
.story-box{background:#fff8fb;border:1px solid #fce0eb;border-left:3px solid var(--accent);border-radius:8px;padding:10px 14px;font-size:.78rem;line-height:1.65;color:var(--ink);margin-top:10px}
.story-box .stx{font-weight:900;color:var(--accent);font-size:.7rem;letter-spacing:.05em;margin-right:6px}
.warn-box{background:#fef3d8;border-left:3px solid var(--warn);border-radius:8px;padding:10px 14px;font-size:.78rem;line-height:1.65;margin-top:10px;color:#5a4400}
.src{margin-top:22px;font-size:.72rem;color:var(--muted);padding:12px 14px;background:#f2f4f8;border-radius:8px}
footer{text-align:center;color:var(--muted);font-size:.72rem;margin-top:40px;padding:20px}
.conf{display:inline-block;background:#fdeaf1;color:var(--accent);font-weight:700;font-size:.7rem;padding:3px 12px;border-radius:20px;margin-right:8px}
@media print{body{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}#lock{display:none!important}#app{display:block!important;max-width:none}.card{page-break-inside:avoid}}
@media(max-width:640px){.wrap{padding:0 18px}header{padding:20px 18px 22px}.kv .k{flex:0 0 100px}}
/* calendar */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;background:var(--border);border:1px solid var(--border);border-radius:10px;overflow:hidden;padding:4px}
.cal-cell{background:var(--card);min-height:108px;padding:8px 8px 6px;border-radius:6px;position:relative;display:flex;flex-direction:column}
.cal-cell.dow{background:#1a1a2e;color:#fff;min-height:auto;text-align:center;padding:6px;font-size:.66rem;font-weight:900;letter-spacing:.05em}
.cal-cell.weekend{background:#f7f9fc}
.cal-cell.today{background:#fff8fb;border:2px solid var(--accent)}
.cal-cell.unset{background:#fef3d8;opacity:.7}
.cal-date{font-size:.78rem;font-weight:900;color:var(--ink);display:flex;align-items:center;gap:4px;margin-bottom:4px}
.cal-date.sat{color:#0066cc}
.cal-date.sun{color:#cc0000}
.cal-events{font-size:.62rem;line-height:1.45;color:var(--ink);overflow:hidden}
.cal-ev{background:#fdeaf1;color:#c4005a;padding:2px 5px;border-radius:3px;margin-bottom:2px;font-weight:700;border-left:2px solid var(--accent);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-ev.proposal{background:var(--accent);color:#fff;border-left-color:#c4005a}
.cal-ev.sample{background:#e0f2f1;color:#0f6b5b;border-left-color:var(--teal)}
.cal-ev.internal{background:#eef0f3;color:#555;border-left-color:var(--hold)}
.cal-ev.unavail{background:#fef3d8;color:#9a7400;border-left-color:var(--warn)}
.cal-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.7rem;margin-top:14px;color:var(--muted)}
.cal-legend span{display:inline-flex;align-items:center;gap:5px}
.cal-legend .dot{width:10px;height:10px;border-radius:3px;display:inline-block}
.dot.p{background:var(--accent)}.dot.s{background:var(--teal)}.dot.i{background:var(--hold)}.dot.u{background:var(--warn)}
.tl-h{font-size:.94rem;font-weight:900;color:var(--ink);margin:18px 0 10px;padding:8px 12px;background:linear-gradient(135deg,#0c4a6e,#0e7490);color:#fff;border-radius:8px}
.tl-step{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:8px;border-left:4px solid var(--teal);display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.tl-step .tl-date{flex:0 0 100px;font-size:.74rem;font-weight:900;color:var(--teal)}
.tl-step .tl-title{flex:1;min-width:200px;font-size:.82rem;font-weight:700;color:var(--ink)}
.tl-step .tl-owner{flex:0 0 130px;font-size:.7rem;color:var(--muted)}
/* agency / competitor */
.ag-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:14px;border-top:4px solid var(--navy)}
.ag-card.priority{border-top-color:var(--accent)}
.ag-card.late{border-top-color:var(--hold);opacity:.85}
.ag-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.ag-name{font-size:1.02rem;font-weight:900;color:var(--ink)}
.ag-tag{font-size:.66rem;font-weight:800;padding:3px 10px;border-radius:20px;background:#fdeaf1;color:var(--accent)}
.ag-tag.late{background:#eef0f3;color:var(--hold)}
.ag-lead{font-size:.78rem;color:var(--muted);margin-top:4px;line-height:1.55}
.competitor-card{background:#fff8fb;border:1px solid #fce0eb;border-left:4px solid var(--accent);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.competitor-name{font-size:1rem;font-weight:900;color:var(--accent);display:flex;align-items:center;gap:8px}
.competitor-name .tag{font-size:.66rem;font-weight:700;background:var(--accent);color:#fff;padding:2px 8px;border-radius:20px}
header{background:linear-gradient(135deg,#8b5e3c 0%,#3b1f0e 100%)}
</style>
</head>

async function decrypt(pass){
  const enc=new TextEncoder();
  const salt=Uint8Array.from(atob(PAYLOAD.salt),c=>c.charCodeAt(0));
  const iv=Uint8Array.from(atob(PAYLOAD.iv),c=>c.charCodeAt(0));
  const ct=Uint8Array.from(atob(PAYLOAD.ct),c=>c.charCodeAt(0));
  const baseKey=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:PAYLOAD.iters,hash:'SHA-256'},baseKey,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct);
  return JSON.parse(new TextDecoder().decode(pt));
}
function _jwt(t){try{const p=t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');return JSON.parse(decodeURIComponent(escape(atob(p))));}catch(e){return null;}}

function tryToken(credential,fromCache){
  return (async()=>{
    const info=_jwt(credential);
    const now=Math.floor(Date.now()/1000);
    const dom=info&&(info.hd||((info.email||'').split('@')[1])||'');
    const ok=fromCache?!!(info&&dom==='fireworkhq.com'&&info.aud===CLIENT_ID):!!(info&&dom==='fireworkhq.com'&&info.aud===CLIENT_ID&&(!info.exp||info.exp>now));
    if(!ok){try{localStorage.removeItem(SS_KEY);localStorage.removeItem(SS_KEY+'_exp');}catch(_){}
      if(!fromCache){document.getElementById('err').textContent='アクセス権がありません（@fireworkhq.com のみ）';}
      return false;}
    try{const d=await decrypt(PP);showData(d);try{localStorage.setItem(SS_KEY,credential);localStorage.setItem(SS_KEY+'_exp',String(Date.now()+SSO_TTL_MS));}catch(e){}return true;}
    catch(e){if(!fromCache){document.getElementById('err').textContent='データの復号に失敗しました';}return false;}
  })();
}
function onCredential(resp){document.getElementById('err').textContent='認証中…';tryToken(resp.credential,false);}

window.onload=function(){
  let cached=null;try{const _e=localStorage.getItem(SS_KEY+'_exp');if(_e&&Date.now()<parseInt(_e,10)){cached=localStorage.getItem(SS_KEY);}else{localStorage.removeItem(SS_KEY);localStorage.removeItem(SS_KEY+'_exp');}}catch(e){}
  if(cached){document.getElementById('err').textContent='読み込み中…';tryToken(cached,true).then(ok=>{if(!ok)initGoogle();});}
  else{initGoogle();}
};
</script>
