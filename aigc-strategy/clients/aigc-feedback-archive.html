<style>
:root{--ink:#1a1a2e;--accent:#FA006D;--teal:#1B998B;--navy:#0F3460;--bg:#f6f7f9;--card:#fff;--border:#e7e9ee;--muted:#6c757d;--active:#1B998B;--warn:#f5a623;--danger:#e74c3c;--hold:#8890a0;--check:#0F3460;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans JP",-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;font-size:14px}
#lock{position:fixed;inset:0;background:linear-gradient(135deg,#1a1a2e,#0F3460);display:flex;align-items:center;justify-content:center;z-index:1000}
.lockbox{background:#fff;border-radius:16px;padding:40px 36px;width:min(92vw,400px);text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.lockbox .em{font-size:2.2rem;margin-bottom:10px}
.lockbox h1{font-size:1.12rem;margin-bottom:6px}
.lockbox p{color:var(--muted);font-size:.82rem;margin-bottom:20px}
.lockbox .gwrap{display:flex;justify-content:center;min-height:44px}
.lockbox .err{color:var(--danger);font-size:.8rem;min-height:1.2em;margin-top:14px}
.lockbox .note{color:#aab;font-size:.68rem;margin-top:16px}
#app{display:none;max-width:960px;margin:0 auto;padding:0 0 60px}
header{background:linear-gradient(135deg,#1a1a2e 0%,#0F3460 100%);color:#fff;padding:24px 32px 26px}
header .back{display:inline-block;color:#cdd3e0;font-size:.74rem;text-decoration:none;margin-bottom:14px;border:1px solid rgba(255,255,255,.25);border-radius:20px;padding:4px 12px;transition:background .15s}
header .back:hover{background:rgba(255,255,255,.12)}
header .cat-tag{color:var(--accent);font-weight:700;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase}
header h1{font-size:1.6rem;font-weight:900;margin:6px 0 8px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header .headline{color:#dfe4ee;font-size:.92rem;max-width:780px;margin-top:4px;line-height:1.6}
header .scope{margin-top:10px;font-size:.74rem;color:var(--muted);line-height:1.6}
.wrap{padding:0 32px}
.stats-row{display:flex;gap:12px;margin-top:22px;flex-wrap:wrap}
.stat-card{flex:1;min-width:140px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 16px;border-left:4px solid var(--hold)}
.stat-card.lost{border-left-color:var(--danger)}
.stat-card.total{border-left-color:var(--navy)}
.stat-card .lbl{font-size:.7rem;color:var(--muted);font-weight:700;letter-spacing:.05em}
.stat-card .num{font-size:1.8rem;font-weight:900;color:var(--ink);line-height:1.1;margin-top:4px}
.stat-card .sub{font-size:.7rem;color:var(--muted);margin-top:2px}
.sec-h{font-size:1.05rem;font-weight:900;margin:32px 0 14px;padding-left:12px;border-left:4px solid var(--navy)}
.cat-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px 20px;margin-bottom:18px;border-top:4px solid var(--hold)}
.cat-card.tone-critical{border-top-color:var(--accent)}
.cat-card.tone-high{border-top-color:var(--warn)}
.cat-card.tone-mid{border-top-color:var(--teal)}
.cat-card.tone-low{border-top-color:var(--navy)}
.cat-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:8px}
.cat-icon{font-size:1.6rem;line-height:1;flex-shrink:0}
.cat-h{flex:1}
.cat-name{font-size:1.06rem;font-weight:900;color:var(--ink);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cat-count{font-size:.7rem;font-weight:700;background:#eef1f6;color:var(--navy);padding:3px 10px;border-radius:20px}
.cat-lead{font-size:.78rem;color:var(--muted);line-height:1.6;margin-top:5px}
.client-list{display:flex;flex-direction:column;gap:10px;margin:14px 0 4px}
.client-row{background:#fafbfd;border:1px solid var(--border);border-radius:10px;padding:12px 14px}
.client-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap}
.client-name{font-size:.92rem;font-weight:900;color:var(--navy);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.client-tag{font-size:.66rem;font-weight:700;background:#fdeaf1;color:var(--accent);padding:2px 9px;border-radius:20px;white-space:nowrap}
.client-meta{font-size:.7rem;color:var(--muted);margin-top:3px}
.client-stat{font-size:.66rem;font-weight:800;padding:3px 10px;border-radius:20px;white-space:nowrap}
.client-stat.保留{background:#eef0f3;color:var(--hold)}
.client-stat.失注{background:#fdeae8;color:var(--danger)}
.cline{font-size:.78rem;line-height:1.6;margin-top:8px;display:flex;gap:8px;align-items:flex-start}
.cline .lbl{font-weight:800;font-size:.66rem;padding:2px 8px;border-radius:5px;flex-shrink:0;margin-top:2px;white-space:nowrap}
.cline .lbl-fb{background:rgba(140,144,160,.18);color:#5a6072}
.cline .lbl-rd{background:rgba(15,52,96,.14);color:var(--navy)}
.cline .lbl-nx{background:rgba(27,153,139,.18);color:var(--teal)}
.cline .tx{flex:1;color:var(--ink)}
.playbook{margin-top:14px;background:#f7f9fc;border:1px solid var(--border);border-left:3px solid var(--teal);border-radius:8px;padding:10px 14px}
.playbook-h{font-size:.74rem;font-weight:900;color:var(--teal);margin-bottom:6px;letter-spacing:.04em}
.playbook ul{margin:0;padding-left:18px}
.playbook li{font-size:.76rem;color:var(--ink);line-height:1.6;margin-bottom:4px}
.cross-card{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.cross-card .cx-t{font-size:.84rem;font-weight:900;color:var(--ink);margin-bottom:4px}
.cross-card .cx-b{font-size:.76rem;line-height:1.6;color:var(--ink)}
.src{margin-top:22px;font-size:.72rem;color:var(--muted);padding:12px 14px;background:#f2f4f8;border-radius:8px}
footer{text-align:center;color:var(--muted);font-size:.72rem;margin-top:40px;padding:20px}
.conf{display:inline-block;background:#fdeaf1;color:var(--accent);font-weight:700;font-size:.7rem;padding:3px 12px;border-radius:20px;margin-right:8px}
@media print{
  body{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #lock{display:none!important}
  #app{display:block!important;max-width:none}
  .cat-card,.client-row,.cross-card,.playbook{page-break-inside:avoid}
}
@media(max-width:640px){
  .wrap{padding:0 18px}
  header{padding:20px 18px 22px}
  .client-top{flex-direction:column}
}
</style>

async function decrypt(pass){
  const enc=new TextEncoder();
  const salt=Uint8Array.from(atob(PAYLOAD.salt),c=>c.charCodeAt(0));
  const iv=Uint8Array.from(atob(PAYLOAD.iv),c=>c.charCodeAt(0));
  const ct=Uint8Array.from(atob(PAYLOAD.ct),c=>c.charCodeAt(0));
  const baseKey=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:PAYLOAD.iters,hash:'SHA-256'},baseKey,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct);
  return JSON.parse(new TextDecoder().decode(pt));
}

function render(d){
  const stats=`<div class="stats-row">
    <div class="stat-card"><div class="lbl">保留</div><div class="num">${d.stats.hold}</div><div class="sub">社</div></div>
    <div class="stat-card lost"><div class="lbl">失注</div><div class="num">${d.stats.lost}</div><div class="sub">社</div></div>
    <div class="stat-card total"><div class="lbl">カテゴリ</div><div class="num">${d.categories.length}</div><div class="sub">障壁の型</div></div>
    <div class="stat-card total"><div class="lbl">集計基準</div><div class="num" style="font-size:1.05rem;margin-top:10px">${esc(d.stats.asOf)}</div><div class="sub">時点</div></div>
  </div>`;
  const cats=d.categories.map(c=>{
    const clients=c.clients.map(cl=>`<div class="client-row">
      <div class="client-top">
        <div>
          <div class="client-name">${esc(cl.name)}<span class="client-tag">${esc(cl.tag)}</span></div>
          <div class="client-meta">${esc(cl.industry)}　│　担当: ${esc(cl.sales)}</div>
        </div>
        <span class="client-stat ${esc(cl.status)}">${esc(cl.status)}</span>
      </div>
      <div class="cline"><span class="lbl lbl-fb">FB</span><span class="tx">${esc(cl.feedback)}</span></div>
      <div class="cline"><span class="lbl lbl-rd">読み</span><span class="tx">${esc(cl.myReading)}</span></div>
      <div class="cline"><span class="lbl lbl-nx">次手</span><span class="tx">${esc(cl.nextMove)}</span></div>
    </div>`).join('');
    const pb=(c.playbook||[]).map(p=>`<li>${esc(p)}</li>`).join('');
    return `<div class="cat-card tone-${esc(c.tone||'mid')}">
      <div class="cat-head">
        <div class="cat-icon">${esc(c.icon)}</div>
        <div class="cat-h">
          <div class="cat-name">${esc(c.name)}<span class="cat-count">${c.clients.length}社</span></div>
          <div class="cat-lead">${esc(c.lead)}</div>
        </div>
      </div>
      <div class="client-list">${clients}</div>
      <div class="playbook"><div class="playbook-h">▼ 横展開プレイブック（次に同じ壁に当たったら）</div><ul>${pb}</ul></div>
    </div>`;
  }).join('');
  const cross=d.crossLearning.map(x=>`<div class="cross-card"><div class="cx-t">${esc(x.title)}</div><div class="cx-b">${esc(x.body)}</div></div>`).join('');
  document.getElementById('app').innerHTML=
    `<header><a class="back" href="../board.html">← AIGC進捗ボードに戻る</a>
    <div class="cat-tag">クライアントフィードバック・障壁アーカイブ</div>
    <h1>🗂️ なぜ進めなかったか — 障壁カテゴリ別アーカイブ</h1>
    <div class="headline">${esc(d.headline)}</div>
    <div class="scope">${esc(d.scope)}</div></header>
    <div class="wrap">${stats}
    <div class="sec-h">📂 カテゴリ別フィードバック（${d.categories.length}カテゴリ・${d.stats.total}社）</div>
    ${cats}
    <div class="sec-h">🧠 横断インサイト・次の一手</div>
    ${cross}
    <div class="src">本ページは保留・失注に至ったクライアントのフィードバックを横断カテゴリで束ね、再提案・新規クライアント案件の入口で活用するためのナレッジベース。新たな保留・失注が出たら本ページに追記し、半年に1回カテゴリ再編する。最終更新: ${esc(d.asOf)} JST</div>
    </div>
    <footer><span class="conf">CONFIDENTIAL — 社外秘</span>クライアントフィードバック・障壁アーカイブ　最終更新 ${esc(d.asOf)} JST</footer>`;
}
const SS_KEY='aigc_cred';
function showData(d){render(d);document.getElementById('lock').style.display='none';document.getElementById('app').style.display='block';}
function tryToken(credential,fromCache){
  return (async()=>{
    const info=_jwt(credential);
    const now=Math.floor(Date.now()/1000);
    const dom=info&&(info.hd||((info.email||'').split('@')[1])||'');
    const ok=info&&dom==='fireworkhq.com'&&info.aud===CLIENT_ID&&(!info.exp||info.exp>now);
    if(!ok){try{sessionStorage.removeItem(SS_KEY);}catch(_){}
      if(!fromCache){document.getElementById('err').textContent='アクセス権がありません（@fireworkhq.com のみ）';}
      return false;}
    try{const d=await decrypt(PP);showData(d);try{sessionStorage.setItem(SS_KEY,credential);}catch(e){}return true;}
    catch(e){if(!fromCache){document.getElementById('err').textContent='データの復号に失敗しました';}return false;}
  })();
}
function onCredential(resp){document.getElementById('err').textContent='認証中…';tryToken(resp.credential,false);}
function initGoogle(){
  if(!window.google||!google.accounts){document.getElementById('err').textContent='Googleログインを読み込めませんでした。再読み込みしてください';return;}
  google.accounts.id.initialize({client_id:CLIENT_ID,callback:onCredential,hd:'fireworkhq.com',auto_select:true});
  google.accounts.id.renderButton(document.getElementById('gbtn'),{theme:'filled_blue',size:'large',text:'signin_with',shape:'pill',width:280});
  google.accounts.id.prompt(function(notification){
    if(notification.isNotDisplayed()||notification.isSkippedMoment()||notification.isDismissedMoment()){
      console.warn('[FireworkSSO] One Tap not shown.');
    }
  });
}
window.onload=function(){
  let cached=null;try{cached=sessionStorage.getItem(SS_KEY);}catch(e){}
  if(cached){document.getElementById('err').textContent='読み込み中…';tryToken(cached,true).then(ok=>{if(!ok)initGoogle();});}
  else{initGoogle();}
};
</script>
