<style>
:root{--ink:#1a1a2e;--accent:#FA006D;--teal:#1B998B;--navy:#0F3460;--bg:#f6f7f9;--card:#fff;--border:#e7e9ee;--muted:#6c757d;--warn:#f5a623;--danger:#e74c3c;--hold:#8890a0;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans JP",-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;font-size:14px}
#lock{position:fixed;inset:0;background:linear-gradient(135deg,#1a1a2e,#0F3460);display:flex;align-items:center;justify-content:center;z-index:1000}
.lockbox{background:#fff;border-radius:16px;padding:40px 36px;width:min(92vw,400px);text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.lockbox .em{font-size:2.2rem;margin-bottom:10px}
.lockbox h1{font-size:1.12rem;margin-bottom:6px}
.lockbox p{color:var(--muted);font-size:.82rem;margin-bottom:20px}
.lockbox .gwrap{display:flex;justify-content:center;min-height:44px}
.lockbox .err{color:var(--danger);font-size:.8rem;min-height:1.2em;margin-top:14px}
.lockbox .note{color:#aab;font-size:.68rem;margin-top:16px}
#app{display:none;max-width:1180px;margin:0 auto;padding:0 0 60px}
header{background:linear-gradient(135deg,#1a1a2e 0%,#0F3460 100%);color:#fff;padding:24px 32px 26px}
header .back{display:inline-block;color:#cdd3e0;font-size:.74rem;text-decoration:none;margin-bottom:14px;border:1px solid rgba(255,255,255,.25);border-radius:20px;padding:4px 12px;transition:background .15s}
header .back:hover{background:rgba(255,255,255,.12)}
header .cat-tag{color:var(--accent);font-weight:700;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase}
header h1{font-size:1.6rem;font-weight:900;margin:6px 0 8px}
header .headline{color:#dfe4ee;font-size:.9rem;max-width:820px;margin-top:4px;line-height:1.7}
header .scope{margin-top:10px;font-size:.73rem;color:#9fa9bd;line-height:1.6;max-width:880px}
.wrap{padding:0 32px}
.sec-h{font-size:1.02rem;font-weight:900;margin:28px 0 12px;padding-left:12px;border-left:4px solid var(--navy)}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.legend .lg{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:7px 12px;font-size:.73rem;color:var(--muted)}
.legend .lg b{margin-right:7px}
.jumpnav{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0 4px}
.jumpnav a{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:5px 13px;font-size:.74rem;font-weight:700;color:var(--navy);text-decoration:none;transition:background .15s,border-color .15s}
.jumpnav a:hover{background:#eef1f6;border-color:var(--navy)}
.jumpnav .jn-c{background:var(--navy);color:#fff;border-radius:20px;font-size:.64rem;padding:1px 7px;font-weight:800}
.catblk2{background:transparent;margin-bottom:16px}
.catblk2>summary{cursor:pointer;list-style:none;user-select:none;display:flex;align-items:center;gap:9px;font-size:.98rem;font-weight:900;color:var(--ink);background:var(--card);border:1px solid var(--border);border-left:4px solid var(--navy);border-radius:10px;padding:11px 15px}
.catblk2>summary::-webkit-details-marker{display:none}
.catblk2>summary:hover{background:#f2f4f8}
.catblk2>summary .chev{font-size:.7rem;color:var(--muted);transition:transform .15s}
.catblk2[open]>summary .chev{transform:rotate(90deg)}
.catblk2>summary .ico{font-size:1.1rem}
.catblk2>summary .cnt{margin-left:auto;background:var(--navy);color:#fff;border-radius:20px;font-size:.66rem;padding:2px 10px;font-weight:800}
.qalist{margin-top:11px;display:flex;flex-direction:column;gap:11px}
.qa{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--teal);border-radius:10px;padding:13px 16px 12px}
.qa.st-暫定{border-left-color:var(--warn)}
.qa.st-未確定{border-left-color:var(--danger)}
.qa .q{display:flex;gap:9px;align-items:flex-start;font-size:.9rem;font-weight:900;line-height:1.55;color:var(--ink)}
.qa .qm{display:inline-flex;align-items:center;justify-content:center;min-width:21px;height:21px;background:var(--navy);color:#fff;border-radius:5px;font-size:.7rem;font-weight:800;flex-shrink:0;margin-top:2px}
.qa .badge{display:inline-block;font-size:.65rem;font-weight:800;padding:2px 10px;border-radius:20px;white-space:nowrap;margin-left:8px;vertical-align:middle}
.badge.確定{background:#e6f4f1;color:var(--teal)}
.badge.暫定{background:#fdf0db;color:#b9791a}
.badge.未確定{background:#fdeaea;color:var(--danger)}
.qa .a{display:flex;gap:9px;align-items:flex-start;font-size:.81rem;line-height:1.75;color:#333;margin-top:10px}
.qa .am{display:inline-flex;align-items:center;justify-content:center;min-width:21px;height:21px;background:var(--teal);color:#fff;border-radius:5px;font-size:.7rem;font-weight:800;flex-shrink:0;margin-top:2px}
.qa.st-未確定 .am{background:var(--danger)}
.qa.st-暫定 .am{background:var(--warn)}
.qa .meta{font-size:.7rem;color:var(--muted);margin-top:9px;padding-top:7px;border-top:1px dashed var(--border);display:flex;flex-wrap:wrap;gap:4px 14px}
.qa .meta b{color:var(--navy);font-weight:700}
.qa details{margin-top:8px}
.qa details>summary{cursor:pointer;list-style:none;user-select:none;font-size:.68rem;font-weight:700;color:var(--navy)}
.qa details>summary::-webkit-details-marker{display:none}
.qa details>summary::before{content:"▸ 出典・補足を開く"}
.qa details[open]>summary::before{content:"▾ 閉じる"}
.qa details>summary:hover{color:var(--accent)}
.qa .note{font-size:.74rem;color:#555;line-height:1.65;margin-top:8px;background:#f8f9fb;border-radius:7px;padding:8px 11px}
.qa .src{font-size:.66rem;color:#9199ac;line-height:1.55;margin-top:7px;word-break:break-word}
.qa .src a{color:#6b7ba8;word-break:break-all}
.oi-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}
@media(max-width:860px){.oi-grid{grid-template-columns:1fr}}
.oicard{background:var(--card);border:1px solid var(--border);border-top:3px solid var(--danger);border-radius:10px;padding:12px 15px}
.oicard .ot{font-size:.86rem;font-weight:900;color:var(--danger);margin-bottom:6px;display:flex;gap:8px;align-items:flex-start}
.oicard .on{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;background:var(--danger);color:#fff;border-radius:50%;font-size:.68rem;flex-shrink:0;margin-top:1px}
.oicard .ob{font-size:.76rem;color:var(--ink);line-height:1.65}
.gpack{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:14px 17px}
.gpack .gp-t{font-size:.9rem;font-weight:900;color:var(--navy)}
.gpack .gp-n{font-size:.75rem;color:var(--muted);line-height:1.65;margin:7px 0 11px}
.gpack .gp-u{font-size:.74rem;margin-bottom:11px}
.gpack .gp-u a{color:var(--accent);word-break:break-all}
.gpack table{width:100%;border-collapse:collapse}
.gpack td{padding:7px 9px;border-bottom:1px solid #f0f1f4;font-size:.75rem;vertical-align:top;line-height:1.6}
.gpack tr:last-child td{border-bottom:none}
.gpack td.gs{font-weight:800;color:var(--navy);white-space:nowrap;width:1%;padding-right:14px}
.srclist{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:4px 14px}
.srclist li{font-size:.77rem;line-height:1.55;padding:9px 0;border-bottom:1px solid #f0f1f4}
.srclist li:last-child{border-bottom:none}
.srclist .cc{font-weight:800;color:var(--navy);font-family:ui-monospace,monospace;font-size:.74rem}
.src-foot{margin-top:22px;font-size:.72rem;color:var(--muted);padding:12px 14px;background:#f2f4f8;border-radius:8px}
footer{text-align:center;color:var(--muted);font-size:.72rem;margin-top:40px;padding:20px}
.conf{display:inline-block;background:#fdeaf1;color:var(--accent);font-weight:700;font-size:.7rem;padding:3px 12px;border-radius:20px;margin-right:8px}
</style>
</head>

async function decrypt(pass){
  const enc=new TextEncoder();
  const salt=Uint8Array.from(atob(PAYLOAD.salt),c=>c.charCodeAt(0));
  const iv=Uint8Array.from(atob(PAYLOAD.iv),c=>c.charCodeAt(0));
  const ct=Uint8Array.from(atob(PAYLOAD.ct),c=>c.charCodeAt(0));
  const baseKey=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:PAYLOAD.iters,hash:'SHA-256'},baseKey,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct);
  return JSON.parse(new TextDecoder().decode(pt));
}

        '<div class="a"><span class="am">A</span><span>'+linkify(x.a)+'</span></div>'+
        (meta.length?'<div class="meta">'+meta.join('')+'</div>':'')+
        (det?'<details><summary></summary>'+det+'</details>':'')+
        '</div>';
    }).join('');
    return '<details class="catblk2" id="'+slug(ci)+'" open><summary><span class="chev">▶</span><span class="ico">'+esc(k.icon||'📌')+'</span>'+esc(k.category)+'<span class="cnt">'+(k.items||[]).length+'件</span></summary><div class="qalist">'+il+'</div></details>';
  }).join('');
  var oi=(c.openIssues||[]).map(function(o){
    return '<div class="oicard"><div class="ot"><span class="on">'+esc(o.no)+'</span>'+esc(o.title)+'</div><div class="ob">'+linkify(o.body)+'</div></div>';
  }).join('');
  var gp=c.globalPack||{};
  var gpRows=(gp.sections||[]).map(function(s){
    return '<tr><td class="gs">'+esc(s.name)+'</td><td>'+esc(s.qs)+'</td></tr>';
  }).join('');
  var src=(c.sources||[]).map(function(s){return '<li><span class="cc">'+esc(s.ch)+'</span> — '+esc(s.desc)+'</li>';}).join('');
  document.getElementById('app').innerHTML=
    '<header><a class="back" href="../board-quest.html">← AIGC進捗ボードに戻る</a>'+
    '<div class="cat-tag">クライアント質問 → 社内確定回答</div>'+
    '<h1>AIGC クライアントQ&amp;Aリスト</h1>'+
    '<div class="headline">'+esc(c.headline)+'</div>'+
    '<div class="scope">'+esc(c.scope||'')+'</div></header>'+
    '<div class="wrap">'+
    '<div class="legend">'+legend+'</div>'+
    '<div class="sec-h">💬 実際に聞かれた質問と回答（全'+totalQ+'問／うち未確定 '+undecided+'問）</div>'+
    '<div class="jumpnav">'+nav+'</div>'+catsHtml+
    '<div class="sec-h">🚩 未確定・社内で割れている論点（'+(c.openIssues||[]).length+'件）</div><div class="oi-grid">'+oi+'</div>'+
    '<div class="sec-h">🌐 グローバル製 英語FAQ回答集への対応</div>'+
    '<div class="gpack"><div class="gp-t">'+esc(gp.title||'')+'</div>'+
    '<div class="gp-n">'+esc(gp.note||'')+'</div>'+
    '<div class="gp-u">'+linkify(gp.url||'')+'</div>'+
    '<table>'+gpRows+'</table></div>'+
    '<div class="sec-h">📎 抽出元</div><ul class="srclist">'+src+'</ul>'+
    '<div class="src-foot">現状認識日: '+esc(c.asOf||'')+'　／　回答が「未確定」のものは、社内へエスカレーションするまでクライアントへ断定的に回答しないこと。</div>'+
    '</div>'+
    '<footer><span class="conf">CONFIDENTIAL — 社外秘</span>AIGC クライアントQ&amp;Aリスト　最終更新 '+esc(c.asOf||'')+' JST</footer>';
}
const SS_KEY='aigc_cred';
const SSO_TTL_MS=2592000000;/*30日=firework-sso-no-popup.md準拠の自前TTL*/
function showData(d){render(d);document.getElementById('lock').style.display='none';document.getElementById('app').style.display='block';}
function tryToken(credential,fromCache){
  return (async()=>{
    const info=_jwt(credential);
    const now=Math.floor(Date.now()/1000);
    const dom=info&&(info.hd||((info.email||'').split('@')[1])||'');
    const ok=fromCache?!!(info&&dom==='fireworkhq.com'&&info.aud===CLIENT_ID):!!(info&&dom==='fireworkhq.com'&&info.aud===CLIENT_ID&&(!info.exp||info.exp>now));
    if(!ok){try{localStorage.removeItem(SS_KEY);localStorage.removeItem(SS_KEY+'_exp');}catch(_){}
      if(!fromCache){document.getElementById('err').textContent='アクセス権がありません（@fireworkhq.com のみ）';}
      return false;}
    try{const d=await decrypt(PP);showData(d);try{localStorage.setItem(SS_KEY,credential);localStorage.setItem(SS_KEY+'_exp',String(Date.now()+SSO_TTL_MS));}catch(e){}return true;}
    catch(e){if(!fromCache){document.getElementById('err').textContent='データの復号に失敗しました';}return false;}
  })();
}
function onCredential(resp){document.getElementById('err').textContent='認証中…';tryToken(resp.credential,false);}
function initGoogle(){
  if(!window.google||!google.accounts){document.getElementById('err').textContent='Googleログインを読み込めませんでした。再読み込みしてください';return;}
  google.accounts.id.initialize({client_id:CLIENT_ID,callback:onCredential,hd:'fireworkhq.com',auto_select:true});
  google.accounts.id.renderButton(document.getElementById('gbtn'),{theme:'filled_blue',size:'large',text:'signin_with',shape:'pill',width:280});
  google.accounts.id.prompt();
}
window.onload=function(){
  let cached=null;try{const _e=localStorage.getItem(SS_KEY+'_exp');if(_e&&Date.now()<parseInt(_e,10)){cached=localStorage.getItem(SS_KEY);}else{localStorage.removeItem(SS_KEY);localStorage.removeItem(SS_KEY+'_exp');}}catch(e){}
  if(cached){document.getElementById('err').textContent='読み込み中…';tryToken(cached,true).then(ok=>{if(!ok)initGoogle();});}
  else{initGoogle();}
};
</script>
