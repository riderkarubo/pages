body{font-family:"Noto Sans JP",-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;font-size:14px}

.lockbox{background:#fff;border-radius:16px;padding:40px 36px;width:min(92vw,400px);text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.lockbox .em{font-size:2.2rem;margin-bottom:10px}
.lockbox h1{font-size:1.12rem;margin-bottom:6px}
.lockbox p{color:var(--muted);font-size:.82rem;margin-bottom:20px}
.lockbox .gwrap{display:flex;justify-content:center;min-height:44px}
.lockbox .err{color:var(--danger);font-size:.8rem;min-height:1.2em;margin-top:14px}
.lockbox .note{color:#aab;font-size:.68rem;margin-top:16px}
#app{display:none}
.shell{display:grid;grid-template-columns:200px minmax(0,1fr);max-width:1180px;margin:0 auto;gap:0}
/* sidebar */
.sidenav{position:sticky;top:0;align-self:start;height:100vh;overflow-y:auto;padding:24px 12px 24px 20px;border-right:1px solid var(--border);background:var(--bg)}
.sidenav .snt{font-size:.62rem;font-weight:700;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px}
.sidenav a{display:block;color:var(--muted);text-decoration:none;font-size:.75rem;padding:7px 10px;border-radius:7px;border-left:2px solid transparent;transition:all .15s;line-height:1.4}
.sidenav a:hover{background:#eceff4;color:var(--ink)}
.sidenav a.on{background:#fdeaf1;color:var(--accent);border-left-color:var(--accent);font-weight:700}
.sidenav .bk{margin-bottom:16px;font-size:.7rem;border:1px solid var(--border);border-radius:20px;padding:5px 10px;text-align:center;border-left:1px solid var(--border)}
.sidenav .bk:hover{background:#eceff4}
.main{min-width:0;padding:0 0 80px}
header{background:linear-gradient(135deg,#1a1a2e 0%,#0F3460 100%);color:#fff;padding:26px 32px 28px}
header .cat-tag{color:var(--accent);font-weight:700;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase}
header h1{font-size:1.6rem;font-weight:900;margin:6px 0 8px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}

.sumbox{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:10px;padding:18px 20px;margin-top:22px;font-size:.9rem;line-height:1.85}

.sumbox ul{list-style:none;margin-top:4px}
.sumbox li{padding:5px 0 5px 20px;position:relative;font-size:.85rem}

.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px 18px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.g3 .card .lb{font-size:.68rem;font-weight:700;color:var(--accent);letter-spacing:.06em;text-transform:uppercase;margin-bottom:7px}
.g3 .card .bd{font-size:.82rem;line-height:1.75}
.tbl{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden}

.tbl td{padding:10px 12px;border-bottom:1px solid #f0f1f4;font-size:.8rem;vertical-align:top}
.tbl tr:last-child td{border-bottom:none}
.tbl .nm{font-weight:700}
.tbl .hn{display:inline-block;width:19px;height:19px;line-height:19px;text-align:center;background:var(--navy);color:#fff;border-radius:50%;font-size:.64rem;margin-right:8px;vertical-align:1px}

.vd.潰せる{background:#e6f4f1;color:var(--teal)}
.vd.潰せない{background:#fdeaf1;color:var(--accent)}
.vd.一部{background:#fdf0db;color:#b9791a}

.killbox .kh{font-size:.78rem;font-weight:900;color:var(--accent);margin-bottom:8px}
.killbox ul{list-style:none}
.killbox li{padding:5px 0 5px 20px;position:relative;font-size:.82rem;line-height:1.7}
.killbox li:before{content:"✕";position:absolute;left:3px;color:var(--accent);font-size:.72rem;top:7px}
.nalist,.rklist,.sdlist{list-style:none;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:6px 8px}
.nalist li,.rklist li,.sdlist li{padding:10px 12px 10px 30px;position:relative;font-size:.82rem;border-bottom:1px solid #f0f0f0;line-height:1.6}
.nalist li:last-child,.rklist li:last-child,.sdlist li:last-child{border-bottom:none}
.nalist li:before{content:"▶";position:absolute;left:11px;color:var(--teal);font-size:.66rem;top:13px}
.rklist li:before{content:"?";position:absolute;left:12px;color:var(--warn);top:10px;font-weight:900}
.sdlist li:before{content:"⚙";position:absolute;left:10px;color:var(--navy);top:11px}
.nalist .na-o{display:block;color:var(--muted);font-size:.72rem;margin-top:3px}

.wave .wh{display:flex;align-items:baseline;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.wave .wl{font-weight:900;font-size:.88rem}

.wave ul{list-style:none}
.wave li{padding:4px 0 4px 18px;position:relative;font-size:.8rem}
.wave li:before{content:"–";position:absolute;left:4px;color:var(--muted)}

.kpi .k.ko .kn{color:var(--teal)}.kpi .k.kx .kn{color:var(--accent)}.kpi .k.kp .kn{color:var(--warn)}

footer{text-align:center;color:var(--muted);font-size:.72rem;margin-top:40px;padding:20px}
.conf{display:inline-block;background:#fdeaf1;color:var(--accent);font-weight:700;font-size:.7rem;padding:3px 12px;border-radius:20px;margin-right:8px}

async function decrypt(pass){
  const enc=new TextEncoder();
  const salt=Uint8Array.from(atob(PAYLOAD.salt),c=>c.charCodeAt(0));
  const iv=Uint8Array.from(atob(PAYLOAD.iv),c=>c.charCodeAt(0));
  const ct=Uint8Array.from(atob(PAYLOAD.ct),c=>c.charCodeAt(0));
  const baseKey=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:PAYLOAD.iters,hash:'SHA-256'},baseKey,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct);
  return JSON.parse(new TextDecoder().decode(pt));
}
function _jwt(t){try{const p=t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');return JSON.parse(decodeURIComponent(escape(atob(p))));}catch(e){return null;}}
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* rich: 全escape後に <strong> のみ復元し、URLをリンク化。それ以外のタグはescapeされたまま */
const rich=s=>esc(s).replace(/&lt;(\/?)strong&gt;/g,'<$1strong>').replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" style="color:#0F3460">$1</a>');
const linkify=rich;
const PENDING='<div class="pend"><span class="pi">📝</span>議事録の受領後にここへ反映します</div>';

function render(d){
  const m=d.meta||{};

  /* ① 結論サマリ */
  const cc=d.conclusion||{};
  const concl=(cc.headline||(cc.points||[]).length)
    ? `<div class="sumbox">${cc.headline?`<div class="ch">${esc(cc.headline)}</div>`:''}
        <ul>${(cc.points||[]).map(p=>`<li>${linkify(p)}</li>`).join('')}</ul></div>`
    : `<div style="margin-top:22px">${PENDING}</div>`;

  /* ② 診断 */
  const dg=d.diagnosis||{};
  const H=dg.hypotheses||[];
  const cOk=H.filter(h=>h.verdict==='潰せる').length;
  const cNg=H.filter(h=>h.verdict==='潰せない').length;
  const cPt=H.filter(h=>h.verdict==='一部').length;
  const kpi=H.length?`<div class="kpi">
      <div class="k ko"><div class="kn">${cOk}<span style="font-size:.9rem;color:#9aa">/${H.length}</span></div><div class="kl">AIGCで<strong>潰せる</strong></div></div>
      <div class="k kx"><div class="kn">${cNg}<span style="font-size:.9rem;color:#9aa">/${H.length}</span></div><div class="kl">AIGCで<strong>潰せない</strong></div></div>
      <div class="k kp"><div class="kn">${cPt}<span style="font-size:.9rem;color:#9aa">/${H.length}</span></div><div class="kl">一部のみ</div></div>
    </div>`:'';
  const hyp=H.length
    ? kpi+`<div class="scroll-x" style="margin-top:12px"><table class="tbl"><thead><tr><th style="width:44%">「使わない理由」の仮説</th><th>AIGCで</th><th>メモ</th></tr></thead><tbody>
       ${dg.hypotheses.map((h,i)=>`<tr><td class="nm"><span class="hn">${i+1}</span>${rich(h.text)}</td><td><span class="vd ${esc(h.verdict)}">${esc(h.verdict)}</span></td><td class="nt">${rich(h.note||'')}</td></tr>`).join('')}
       </tbody></table></div>`
    : PENDING;
  const unsolv=(dg.unsolvable||[]).length
    ? `<div class="killbox"><div class="kh">★ AIGCが潰せない障壁 — ここが次の打ち手を規定する</div>
       <ul>${dg.unsolvable.map(u=>`<li>${linkify(u)}</li>`).join('')}</ul></div>`
    : '';

  /* ③ ストーリー */
  const st=d.story||{};
  const hasStory=st.core||st.whyNow||st.whyVideo||st.whyAigc;
  const story=hasStory
    ? `${st.core?`<div class="sumbox"><div class="ch">${esc(st.core)}</div></div>`:''}
       <div class="g3" style="margin-top:12px">
         <div class="card"><div class="lb">なぜ今</div><div class="bd">${esc(st.whyNow||'—')}</div></div>
         <div class="card"><div class="lb">なぜ動画</div><div class="bd">${esc(st.whyVideo||'—')}</div></div>
         <div class="card"><div class="lb">なぜAI生成で十分か</div><div class="bd">${esc(st.whyAigc||'—')}</div></div>
       </div>
       ${st.brandConcern?`<div class="killbox" style="margin-top:12px"><div class="kh">★「AI動画でブランドとして大丈夫か」への回答</div><ul><li>${linkify(st.brandConcern)}</li></ul></div>`:''}`
    : PENDING;

  /* ④ 攻め先 */
  const tg=d.targeting||{};
  const scores=(tg.scores||[]).length
    ? `<div class="scroll-x"><table class="tbl"><thead><tr><th style="width:24%">業種</th><th>フィット度</th><th>勝ちやすさ</th><th>波及効果</th><th>合計</th><th>順番の論理</th></tr></thead><tbody>
       ${tg.scores.map(s=>`<tr><td class="nm">${esc(s.industry)}</td><td class="num">${esc(s.fit)}</td><td class="num">${esc(s.win)}</td><td class="num">${esc(s.ripple)}</td><td class="tot">${esc(s.total)}</td><td class="nt">${esc(s.rationale||'')}</td></tr>`).join('')}
       </tbody></table></div>
       ${(tg.top||[]).length?`<div class="killbox" style="margin-top:12px"><div class="kh">★ 優先業種と、なぜその順か</div><ul>${tg.top.map(t=>`<li>${linkify(t)}</li>`).join('')}</ul></div>`:''}`
    : PENDING;
  const entry=(tg.entryMessages||[]).length
    ? `<div class="scroll-x"><table class="tbl"><thead><tr><th style="width:24%">業種</th><th>最初の一言（入り口メッセージ）</th></tr></thead><tbody>
       ${tg.entryMessages.map(e=>`<tr><td class="nm">${esc(e.industry)}</td><td>${esc(e.message)}</td></tr>`).join('')}</tbody></table></div>`
    : PENDING;

  /* ⑤ 90日 */
  const tl=d.timeline||{};
  const waves=(tl.waves||[]).length
    ? tl.waves.map(w=>`<div class="wave"><div class="wh"><span class="wl">${esc(w.label)}</span>${w.period?`<span class="wp">${esc(w.period)}</span>`:''}</div>
       <ul>${(w.items||[]).map(i=>`<li>${esc(i)}</li>`).join('')||'<li>—</li>'}</ul></div>`).join('')

  /* ⑥ ネクストアクション ★主役 */
  const nas=(d.nextActions||[]).length
    ? `<div class="scroll-x"><table class="tbl"><thead><tr><th style="width:52%">アクション</th><th>担当</th><th>期日</th><th>状態</th></tr></thead><tbody>
       ${d.nextActions.map(n=>`<tr><td class="nm">${rich(n.action)}${n.note?`<span class="sub-n">※ ${rich(n.note)}</span>`:''}</td><td>${esc(n.owner||'—')}</td><td>${esc(n.due||'—')}</td><td><span class="stat ${esc(n.status||'未着手')}">${esc(n.status||'未着手')}</span></td></tr>`).join('')}

    : PENDING;

  /* ⑦⑧ */
  const norm=x=>typeof x==='string'?{text:x}:x;
  const oi=(d.openIssues||[]).length?`<ul class="rklist">${d.openIssues.map(o=>{const v=norm(o);return `<li>${rich(v.text)}${v.note?`<span class="sub-n">※ ${rich(v.note)}</span>`:''}</li>`;}).join('')}</ul>`:PENDING;

  const parts=(m.participants||[]).map(p=>`<span class="chip">${esc(p)}</span>`).join('');
  const srcs=(d.sources||[]).map(esc).join(' ／ ')||'—';

  document.getElementById('app').innerHTML=`

        <div class="src">出典: ${srcs}　／　最終更新: ${esc(m.lastUpdate||'')} JST</div>
      </div>
      <footer><span class="conf">CONFIDENTIAL — 社外秘</span>FY26Q3 JP OffSite ／ AIGC需要喚起ディスカッション　最終更新 ${esc(m.lastUpdate||'')} JST</footer>
    </div>
  </div>`;
  wireScrollSpy();
}
function wireScrollSpy(){
  const links=[...document.querySelectorAll('.sidenav a[href^="#"]')];
  const secs=links.map(a=>document.getElementById(a.getAttribute('href').slice(1))).filter(Boolean);
  const onScroll=()=>{
    const y=window.scrollY+90;let cur=0;
    secs.forEach((s,i)=>{if(s.offsetTop<=y)cur=i;});
    links.forEach((a,i)=>a.classList.toggle('on',i===cur));
  };
  window.addEventListener('scroll',onScroll,{passive:true});onScroll();
}
const SS_KEY='aigc_cred';
const SSO_TTL_MS=2592000000;/*30日=firework-sso-no-popup.md準拠の自前TTL*/
function showData(d){render(d);document.getElementById('lock').style.display='none';document.getElementById('app').style.display='block';}
function tryToken(credential,fromCache){
  return (async()=>{
    const info=_jwt(credential);
    const now=Math.floor(Date.now()/1000);
    const dom=info&&(info.hd||((info.email||'').split('@')[1])||'');
    const ok=fromCache?!!(info&&dom==='fireworkhq.com'&&info.aud===CLIENT_ID):!!(info&&dom==='fireworkhq.com'&&info.aud===CLIENT_ID&&(!info.exp||info.exp>now));
    if(!ok){try{localStorage.removeItem(SS_KEY);localStorage.removeItem(SS_KEY+'_exp');}catch(_){}
      if(!fromCache){document.getElementById('err').textContent='アクセス権がありません（@fireworkhq.com のみ）';}
      return false;}
    try{const d=await decrypt(PP);showData(d);try{localStorage.setItem(SS_KEY,credential);localStorage.setItem(SS_KEY+'_exp',String(Date.now()+SSO_TTL_MS));}catch(e){}return true;}
    catch(e){if(!fromCache){document.getElementById('err').textContent='データの復号に失敗しました';}return false;}
  })();
}
function onCredential(resp){document.getElementById('err').textContent='認証中…';tryToken(resp.credential,false);}
function initGoogle(){
  if(!window.google||!google.accounts){document.getElementById('err').textContent='Googleログインを読み込めませんでした。再読み込みしてください';return;}
  google.accounts.id.initialize({client_id:CLIENT_ID,callback:onCredential,hd:'fireworkhq.com',auto_select:true});
  google.accounts.id.renderButton(document.getElementById('gbtn'),{theme:'filled_blue',size:'large',text:'signin_with',shape:'pill',width:280});
  google.accounts.id.prompt();
}
window.onload=function(){
  let cached=null;try{const _e=localStorage.getItem(SS_KEY+'_exp');if(_e&&Date.now()<parseInt(_e,10)){cached=localStorage.getItem(SS_KEY);}else{localStorage.removeItem(SS_KEY);localStorage.removeItem(SS_KEY+'_exp');}}catch(e){}
  if(cached){document.getElementById('err').textContent='読み込み中…';tryToken(cached,true).then(ok=>{if(!ok)initGoogle();});}
  else{initGoogle();}
};
</script>
