<style>
:root{
  --ink:#12121f;--paper:#f4f5f8;--card:#fff;--border:#e4e7ee;--muted:#767e8c;
  --ok:#1B998B;--ng:#FA006D;--out:#8890a0;--navy:#0F3460;--warn:#f5a623;--danger:#e74c3c;
  --ok-bg:#e9f6f4;--ng-bg:#fdeaf1;--out-bg:#eef0f3;--warn-bg:#fdf6e7;
  --fs:"Noto Sans JP",-apple-system,BlinkMacSystemFont,sans-serif;
  --fm:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--fs);background:var(--paper);color:var(--ink);line-height:1.75;font-size:14px;-webkit-font-smoothing:antialiased}
strong{font-weight:700}
em{font-style:normal;color:var(--muted)}

/* ---------- lock ---------- */
#lock{position:fixed;inset:0;background:#12121f;display:flex;align-items:center;justify-content:center;z-index:1000}
#lock:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 20%,rgba(250,0,109,.16),transparent 55%),radial-gradient(circle at 75% 80%,rgba(27,153,139,.14),transparent 55%)}
.lockbox{position:relative;background:#fff;border-radius:14px;padding:38px 34px;width:min(92vw,390px);text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.5)}
.lockbox .em{font-size:2rem;margin-bottom:10px}
.lockbox h1{font-size:1.05rem;font-weight:900;margin-bottom:6px}
.lockbox p{color:var(--muted);font-size:.8rem;margin-bottom:20px}
.lockbox .gwrap{display:flex;justify-content:center;min-height:44px}
.lockbox .err{color:var(--danger);font-size:.78rem;min-height:1.2em;margin-top:14px}
.lockbox .note{color:#aab;font-size:.66rem;margin-top:16px;font-family:var(--fm)}

/* ---------- shell ---------- */
#app{display:none}
.shell{display:grid;grid-template-columns:196px minmax(0,1fr);max-width:1160px;margin:0 auto}
.sidenav{position:sticky;top:0;align-self:start;height:100vh;overflow-y:auto;padding:26px 12px 26px 22px;border-right:1px solid var(--border)}
.sidenav .snt{font-family:var(--fm);font-size:.6rem;font-weight:600;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-bottom:10px}
.sidenav a{display:flex;gap:8px;color:var(--muted);text-decoration:none;font-size:.74rem;padding:7px 9px;border-radius:6px;border-left:2px solid transparent;transition:all .15s;line-height:1.4}
.sidenav a .sn{font-family:var(--fm);font-size:.66rem;opacity:.6}
.sidenav a:hover{background:#eaedf2;color:var(--ink)}
.sidenav a.on{background:var(--ng-bg);color:var(--ng);border-left-color:var(--ng);font-weight:700}
.sidenav a.on .sn{opacity:1}
.sidenav .bk{margin-bottom:18px;font-size:.68rem;border:1px solid var(--border);border-radius:20px;padding:5px 10px;justify-content:center;border-left:1px solid var(--border)}
.sidenav .bk:hover{background:#eaedf2}
.main{min-width:0;padding:0 0 90px}
.wrap{padding:0 34px}

/* ---------- header ---------- */
header{background:#12121f;color:#fff;padding:24px 34px 22px;position:relative;overflow:hidden}
header:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 88% 10%,rgba(250,0,109,.22),transparent 45%)}
header>*{position:relative}
header .kick{font-family:var(--fm);color:var(--ng);font-weight:600;font-size:.66rem;letter-spacing:.16em;text-transform:uppercase}
header h1{font-size:1.32rem;font-weight:900;margin:5px 0 0;letter-spacing:-.01em}
header .metarow{margin-top:12px;display:flex;gap:6px;flex-wrap:wrap}
header .mchip{font-family:var(--fm);background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);border-radius:5px;padding:2px 9px;font-size:.66rem;color:#c8cede}

/* ---------- thesis (signature) ---------- */
.thesis{background:#12121f;color:#fff;padding:0 34px 34px}
.thesis-in{border-top:1px solid rgba(255,255,255,.1);padding-top:26px;position:relative}
.th-k{font-family:var(--fm);font-size:.64rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ng);font-weight:600;margin-bottom:10px}
.th-l{font-size:clamp(1.5rem,3.6vw,2.15rem);font-weight:900;line-height:1.32;letter-spacing:-.02em}
.th-l .hl{color:var(--ng)}
.th-l .d2{color:#8d93a6}
.th-b{margin-top:14px;font-size:.84rem;line-height:1.85;color:#b8bfd0;max-width:620px}
.th-b strong{color:#fff}

/* ---------- fig ---------- */
.dia{margin-top:22px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.09);border-radius:12px;padding:14px 10px 8px}
.dia svg{display:block;width:100%;height:auto}
.dia-lg{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;padding:8px 8px 4px;border-top:1px solid rgba(255,255,255,.08);margin-top:6px}
.dia-lg span{font-family:var(--fm);font-size:.64rem;color:#9aa2b4;display:flex;align-items:center;gap:5px}
.dia-lg i{width:9px;height:9px;border-radius:2px;display:inline-block}

/* ---------- sections ---------- */
.sec-h{display:flex;align-items:baseline;gap:11px;margin:38px 0 14px;scroll-margin-top:14px}
.sec-h .sn{font-family:var(--fm);font-size:.78rem;font-weight:600;color:var(--ng)}
.sec-h .st{font-size:1.02rem;font-weight:900;letter-spacing:-.01em}
.sec-h .sub{font-size:.72rem;color:var(--muted);font-weight:400}
.sec-h.sm{margin:24px 0 10px}
.sec-h.sm .st{font-size:.88rem}
.sec-h.sm .sn{color:var(--ok)}
.lead{font-size:.84rem;line-height:1.85;color:#4a5262;margin-bottom:14px;max-width:720px}

/* ---------- conclusion cards ---------- */
.ccs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}
.cc{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:16px 17px;position:relative;overflow:hidden}
.cc:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px}
.cc.ok:before{background:var(--ok)}.cc.ng:before{background:var(--ng)}.cc.out:before{background:var(--out)}
.cc .n{font-family:var(--fm);font-size:1.6rem;font-weight:600;line-height:1;letter-spacing:-.03em}
.cc.ok .n{color:var(--ok)}.cc.ng .n{color:var(--ng)}.cc.out .n{color:var(--out)}
.cc .t{font-size:.8rem;font-weight:900;margin:9px 0 6px}
.cc .b{font-size:.75rem;line-height:1.75;color:#5a6272}
.headline{font-size:1.06rem;font-weight:900;line-height:1.6;margin-bottom:16px;padding-left:14px;border-left:3px solid var(--ng);letter-spacing:-.01em}

/* ---------- details (共通) ---------- */
.dt{margin-top:12px;background:var(--card);border:1px solid var(--border);border-radius:10px}
.dt>summary{cursor:pointer;font-family:var(--fm);font-size:.7rem;font-weight:500;color:var(--navy);padding:11px 15px;list-style:none;display:flex;align-items:center;gap:7px;user-select:none}
.dt>summary::-webkit-details-marker{display:none}
.dt>summary:before{content:"+";font-weight:600;font-size:.85rem;width:13px;display:inline-block}
.dt[open]>summary:before{content:"–"}
.dt>summary:hover{color:var(--ng)}
.dt .dtb{padding:2px 16px 14px;border-top:1px solid var(--border)}
.dt .dtb ul{list-style:none}
.dt .dtb li{font-size:.78rem;line-height:1.8;padding:9px 0 9px 15px;position:relative;border-bottom:1px solid #f2f4f7;color:#4a5262}
.dt .dtb li:last-child{border-bottom:none}
.dt .dtb li:before{content:"";position:absolute;left:0;top:15px;width:5px;height:1px;background:var(--muted)}

/* ---------- 3 layers ---------- */
.lys{display:grid;gap:9px}
.ly{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:15px 18px;display:grid;grid-template-columns:44px minmax(0,1fr);gap:14px;align-items:start}
.ly-badge{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:var(--fm);font-size:1.15rem;font-weight:600;color:#fff}
.ly.ok .ly-badge{background:var(--ok)}.ly.ng .ly-badge{background:var(--ng)}.ly.out .ly-badge{background:var(--out)}
.ly-h{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.ly-t{font-size:1rem;font-weight:900;letter-spacing:-.01em}
.ly-s{font-size:.74rem;color:var(--muted)}
.ly-k{font-family:var(--fm);font-size:.62rem;font-weight:600;padding:3px 9px;border-radius:5px;white-space:nowrap;margin-left:auto}
.ly.ok .ly-k{background:var(--ok-bg);color:var(--ok)}.ly.ng .ly-k{background:var(--ng-bg);color:var(--ng)}.ly.out .ly-k{background:var(--out-bg);color:var(--out)}
.ly-b{font-size:.79rem;line-height:1.8;color:#4a5262;margin-top:7px}
.ly-f{font-family:var(--fm);font-size:.62rem;color:var(--muted);margin-top:7px}
.ly-v{font-size:.75rem;font-weight:700;margin-top:8px}
.ly.ok .ly-v{color:var(--ok)}.ly.ng .ly-v{color:var(--ng)}.ly.out .ly-v{color:var(--out)}
.ly .dt{margin-top:9px}

/* ---------- split bar (2/6/2) ---------- */
.sb{margin-top:4px}
.sb-bar{display:flex;height:36px;border-radius:8px;overflow:hidden;border:1px solid var(--border)}
.sb-seg{display:flex;align-items:center;justify-content:center;font-family:var(--fm);font-size:.74rem;font-weight:600;color:#fff;transition:flex .3s}
.sb-seg.ok{background:var(--ok)}.sb-seg.ng{background:var(--ng)}.sb-seg.pt{background:var(--warn)}
.sb-lg{display:flex;margin-top:7px;gap:14px;flex-wrap:wrap}
.sb-lg span{font-size:.71rem;color:var(--muted);display:flex;align-items:center;gap:5px}
.sb-lg i{width:8px;height:8px;border-radius:2px}
.sb-lg i.ok{background:var(--ok)}.sb-lg i.ng{background:var(--ng)}.sb-lg i.pt{background:var(--warn)}

/* ---------- table ---------- */
.tw{overflow-x:auto;border:1px solid var(--border);border-radius:10px;background:var(--card)}
.tbl{width:100%;border-collapse:collapse}
.tbl th{background:#eef1f6;text-align:left;font-family:var(--fm);font-size:.64rem;font-weight:600;color:var(--muted);padding:9px 13px;border-bottom:1px solid var(--border);white-space:nowrap;letter-spacing:.04em}
.tbl td{padding:11px 13px;border-bottom:1px solid #f1f3f6;font-size:.78rem;vertical-align:top;line-height:1.7}
.tbl tr:last-child td{border-bottom:none}
.tbl .nm{font-weight:700;color:var(--ink)}
.tbl .nt{color:var(--muted);font-size:.73rem}
.hn{font-family:var(--fm);display:inline-block;width:18px;color:var(--muted);font-size:.68rem;margin-right:7px}
.vd{font-family:var(--fm);display:inline-block;border-radius:4px;padding:2px 8px;font-size:.65rem;font-weight:600;white-space:nowrap}
.vd.ok{background:var(--ok-bg);color:var(--ok)}
.vd.ng{background:var(--ng-bg);color:var(--ng)}
.vd.pt{background:var(--warn-bg);color:#b9791a}
.sub-n{display:block;color:var(--muted);font-size:.71rem;margin-top:4px;font-weight:400;line-height:1.65}

/* ---------- story ---------- */
.core{background:var(--card);border:1px solid var(--border);border-left:3px solid var(--ng);border-radius:10px;padding:18px 20px;font-size:1.02rem;font-weight:900;line-height:1.65;letter-spacing:-.01em}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px;margin-top:11px}
.g3 .card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:15px 16px}
.g3 .lb{font-family:var(--fm);font-size:.62rem;font-weight:600;color:var(--ng);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
.g3 .bd{font-size:.77rem;line-height:1.8;color:#4a5262}

/* ---------- thesis confirm ---------- */
.th-c{margin-top:14px;background:rgba(27,153,139,.1);border:1px solid rgba(27,153,139,.35);border-radius:8px;padding:11px 14px;font-size:.78rem;line-height:1.75;color:#a9c8c3;max-width:640px}
.th-c strong{color:#fff}
.th-cb{font-family:var(--fm);display:inline-block;background:var(--ok);color:#fff;font-weight:600;font-size:.58rem;border-radius:4px;padding:2px 7px;margin-right:8px;letter-spacing:.08em}
/* ---------- story 4th pillar ---------- */
.card.fourth{background:var(--card);border:1px solid var(--border);border-left:3px solid var(--ok);border-radius:10px;padding:15px 17px;margin-top:11px}
.card.fourth .lb{font-family:var(--fm);font-size:.62rem;font-weight:600;color:var(--ok);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
.card.fourth .bd{font-size:.79rem;line-height:1.8;color:#4a5262}
/* ---------- ROI ---------- */
.roi{display:grid;grid-template-columns:minmax(0,1fr) 34px minmax(0,1.25fr);gap:0;align-items:stretch}
.roi-col{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:16px 18px}
.roi-col.cost{border-top:3px solid var(--out)}
.roi-col.ret{border-top:3px solid var(--ok)}
.roi-h{display:flex;align-items:baseline;gap:9px}
.roi-t{font-size:.95rem;font-weight:900}
.roi-c{font-family:var(--fm);font-size:1.5rem;font-weight:600;line-height:1;margin-left:auto}
.roi-col.cost .roi-c{color:var(--out)}.roi-col.ret .roi-c{color:var(--ok)}
.roi-n{font-family:var(--fm);font-size:.62rem;color:var(--muted);margin-top:3px}
.roi-l{list-style:none;margin-top:11px}
.roi-l li{font-size:.79rem;line-height:1.65;padding:8px 0 8px 14px;position:relative;border-bottom:1px solid #f2f4f7}
.roi-l li:last-child{border-bottom:none}
.roi-l li:before{content:"";position:absolute;left:0;top:15px;width:5px;height:5px;border-radius:50%}
.roi-col.cost .roi-l li:before{background:var(--out)}
.roi-col.ret .roi-l li:before{background:var(--ok)}
.roi-l li b{display:block;font-weight:700}
.roi-l li span{display:block;color:var(--muted);font-size:.71rem;line-height:1.6;margin-top:2px}
.roi-vs{display:flex;align-items:center;justify-content:center;font-family:var(--fm);font-size:.72rem;color:var(--muted);font-weight:600}
/* metrics band */
.mt{margin-top:11px;background:var(--card);border:1px solid var(--border);border-left:3px solid var(--ng);border-radius:10px;padding:14px 17px}
.mt-l{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.mt-t{font-size:.86rem;font-weight:900}
.mt-n{font-family:var(--fm);font-size:.62rem;color:var(--muted)}
.mt-i{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.mt-i span{font-family:var(--fm);background:var(--ng-bg);color:var(--ng);border-radius:5px;padding:4px 12px;font-size:.74rem;font-weight:600}
.mt-x{font-size:.75rem;line-height:1.75;color:#5a6272;margin-top:10px;border-top:1px solid #f2f4f7;padding-top:9px}
.mt-x strong{color:var(--ng)}
/* ---------- applicability ---------- */
.apl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.ap{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:13px 15px;border-left:3px solid var(--out)}
.ap.ok{border-left-color:var(--ok)}.ap.mid{border-left-color:var(--warn)}.ap.ng{border-left-color:var(--ng)}
.ap-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ap-t{font-size:.83rem;font-weight:900;flex:1;min-width:0}
.ap-k{font-family:var(--fm);font-size:.58rem;font-weight:600;padding:2px 7px;border-radius:4px;white-space:nowrap}
.ap.ok .ap-k{background:var(--ok-bg);color:var(--ok)}.ap.mid .ap-k{background:var(--warn-bg);color:#b9791a}.ap.ng .ap-k{background:var(--ng-bg);color:var(--ng)}
.ap-x{font-size:.7rem;font-weight:700;margin-top:5px}
.ap.ok .ap-x{color:var(--ok)}.ap.mid .ap-x{color:#b9791a}.ap.ng .ap-x{color:var(--ng)}
.ap-b{font-size:.73rem;line-height:1.7;color:#5a6272;margin-top:5px}
/* ---------- source badge ---------- */
.srcb{font-family:var(--fm);font-size:.58rem;font-weight:600;padding:2px 7px;border-radius:4px;white-space:nowrap}
.srcb.sm{background:var(--ng);color:#fff}
.srcb.s2{background:var(--ok-bg);color:var(--ok)}
.srcb.s1{background:#eef0f3;color:var(--out)}
/* ---------- callout ---------- */
.call{background:var(--ng-bg);border:1px solid #f7cadd;border-radius:10px;padding:15px 18px;margin-top:11px}
.call .ch{font-size:.76rem;font-weight:900;color:var(--ng);margin-bottom:7px;display:flex;align-items:center;gap:6px}
.call .cb{font-size:.79rem;line-height:1.8;color:#5a2340}
.call .cb strong{color:var(--ng)}

/* ---------- archetype ranking ---------- */
.arc{display:grid;gap:7px}
.ar{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:13px 16px;display:grid;grid-template-columns:26px minmax(0,1.05fr) 72px 72px minmax(0,1.5fr);gap:12px;align-items:center}
.ar-k{font-family:var(--fm);width:26px;height:26px;border-radius:6px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:600}
.ar-n{font-size:.83rem;font-weight:900}
.ar-r{font-family:var(--fm);font-size:.6rem;font-weight:600;color:var(--ok);margin-top:2px}
.ar-w{display:flex;flex-direction:column;gap:4px}
.ar-wb{display:flex;gap:3px}
.ar-wb i{height:6px;flex:1;border-radius:1px;background:#e2e5ea}
/* axis A */
.ar[data-w="1"] .ar-wb.w i:nth-child(-n+1){background:var(--ok)}
.ar[data-w="2"] .ar-wb.w i:nth-child(-n+2){background:var(--warn)}
.ar[data-w="3"] .ar-wb.w i{background:var(--ng)}
/* axis B */
.ar[data-r="1"] .ar-wb.r i:nth-child(-n+1){background:var(--ok)}
.ar[data-r="2"] .ar-wb.r i:nth-child(-n+2){background:var(--warn)}
.ar[data-r="3"] .ar-wb.r i{background:var(--ng)}
.ar-wl{font-family:var(--fm);font-size:.58rem;color:var(--muted);letter-spacing:.04em}
.ar-b{font-size:.73rem;line-height:1.7;color:#5a6272}
.ar-b strong{color:var(--ink)}

/* ---------- timeline rail ---------- */
.rail{position:relative;padding-left:28px}
.rail:before{content:"";position:absolute;left:7px;top:8px;bottom:8px;width:2px;background:linear-gradient(180deg,var(--ok),var(--ng),var(--out))}
.rw{position:relative;margin-bottom:10px}
.rw:before{content:"";position:absolute;left:-25px;top:15px;width:10px;height:10px;border-radius:50%;border:2px solid var(--paper)}
.rw.ok:before{background:var(--ok)}.rw.ng:before{background:var(--ng)}.rw.out:before{background:var(--out)}
.rw-c{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:13px 16px}
.rw-h{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.rw-p{font-family:var(--fm);font-size:.66rem;font-weight:600;padding:2px 8px;border-radius:4px}
.rw.ok .rw-p{background:var(--ok-bg);color:var(--ok)}.rw.ng .rw-p{background:var(--ng-bg);color:var(--ng)}.rw.out .rw-p{background:var(--out-bg);color:var(--out)}
.rw-l{font-size:.85rem;font-weight:900}
.rw-t{font-family:var(--fm);font-size:.6rem;color:var(--muted);margin-left:auto}
.cks{display:grid;gap:6px;margin-top:11px}
.ck{background:var(--card);border:1px solid var(--border);border-left:3px solid var(--navy);border-radius:8px;padding:10px 14px;display:flex;gap:11px;align-items:baseline}
.ck-d{font-family:var(--fm);font-size:.66rem;font-weight:600;color:var(--navy);white-space:nowrap}
.ck-t{font-size:.76rem;line-height:1.65;color:#4a5262}

/* ---------- lists ---------- */
.lst{list-style:none;background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.lst li{padding:12px 15px 12px 34px;position:relative;font-size:.79rem;border-bottom:1px solid #f1f3f6;line-height:1.7}
.lst li:last-child{border-bottom:none}
.lst.na li:before{content:"▸";position:absolute;left:14px;color:var(--ok);top:12px}
.lst.oi li:before{content:"?";position:absolute;left:15px;color:var(--warn);top:12px;font-weight:900;font-family:var(--fm)}
.lst.ss li:before{content:"◇";position:absolute;left:14px;color:var(--navy);top:12px}
.lst.cv{background:var(--warn-bg);border-color:#f2e3bd}
.lst.cv li{border-bottom-color:#f6ecd4}
.lst.cv li:before{content:"!";position:absolute;left:16px;color:var(--warn);top:12px;font-weight:900;font-family:var(--fm)}

/* ---------- misc ---------- */
.draftbar{background:var(--warn-bg);border:1px dashed #ecd9a4;border-radius:8px;padding:10px 14px;font-size:.75rem;color:#8a6410;line-height:1.7;margin-bottom:11px}
.draftbar .db-t{font-family:var(--fm);display:inline-block;background:var(--warn);color:#fff;font-weight:600;font-size:.6rem;border-radius:4px;padding:2px 7px;margin-right:8px}
.draftbar strong{color:#6b4d0c}
.warnbar{margin-top:9px;background:var(--warn-bg);border:1px solid #f0dcae;border-radius:7px;padding:9px 13px;font-size:.73rem;color:#8a6410}
.stat{font-family:var(--fm);font-size:.63rem;font-weight:600;padding:3px 9px;border-radius:4px;white-space:nowrap}
.stat.未着手{background:#eef0f3;color:var(--out)}.stat.進行中{background:var(--ok-bg);color:var(--ok)}.stat.完了{background:#e8eef7;color:var(--navy)}
.pend{background:var(--warn-bg);border:1px dashed #ecd9a4;border-radius:10px;padding:20px;text-align:center;color:#a8925c;font-size:.79rem}
.src{margin-top:30px;font-family:var(--fm);font-size:.66rem;color:var(--muted);padding:12px 14px;background:#eaedf2;border-radius:8px;line-height:1.8}
footer{text-align:center;color:var(--muted);font-size:.68rem;margin-top:36px;padding:18px;font-family:var(--fm)}
.conf{display:inline-block;background:var(--ng-bg);color:var(--ng);font-weight:600;font-size:.62rem;padding:3px 9px;border-radius:4px;margin-right:8px}
a:focus-visible,summary:focus-visible{outline:2px solid var(--ng);outline-offset:2px;border-radius:4px}

@media(max-width:940px){
  .shell{grid-template-columns:1fr}.sidenav{display:none}
  .ccs,.g3,.apl{grid-template-columns:1fr}
  .roi{grid-template-columns:1fr}
  .roi-vs{padding:8px 0}
  .ar{grid-template-columns:26px minmax(0,1fr) 72px;gap:9px}
  .ar-w:nth-of-type(2){grid-column:2/4}
  .ar-b{grid-column:1/-1}
  .wrap,header,.thesis{padding-left:18px;padding-right:18px}
  
  .dia{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .dia svg{min-width:620px}
  .dia-lg{min-width:620px}
  .dia:after{content:"← 横にスクロールできます →";display:block;text-align:center;font-family:var(--fm);font-size:.6rem;color:#6f7690;padding:2px 0 4px;min-width:620px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
@media print{.sidenav,.dia{display:none}#lock{display:none!important}#app{display:block!important}body{background:#fff}.dt{display:block}.dt .dtb{display:block!important}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>

async function decrypt(pass){
  const enc=new TextEncoder();
  const salt=Uint8Array.from(atob(PAYLOAD.salt),c=>c.charCodeAt(0));
  const iv=Uint8Array.from(atob(PAYLOAD.iv),c=>c.charCodeAt(0));
  const ct=Uint8Array.from(atob(PAYLOAD.ct),c=>c.charCodeAt(0));
  const baseKey=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:PAYLOAD.iters,hash:'SHA-256'},baseKey,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct);
  return JSON.parse(new TextDecoder().decode(pt));
}
function _jwt(t){try{const p=t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');return JSON.parse(decodeURIComponent(escape(atob(p))));}catch(e){return null;}}
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rich=s=>esc(s).replace(/&lt;(\/?)(strong|em)&gt;/g,'<$1$2>').replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" style="color:#0F3460">$1</a>');

function render(d){
  const m=d.meta||{};
  const U=d.ui||{}; const S=U.sec||{};
  const PENDING=`<div class="pend">${esc(U.pending||'')}</div>`;
  const norm=x=>typeof x==='string'?{text:x}:(x||{});
  const li=x=>{const v=norm(x);return `<li>${rich(v.text)}${v.note?`<span class="sub-n">${rich(v.note)}</span>`:''}</li>`;};
  const DT=(label,items)=>`<details class="dt"><summary>${esc(label)}</summary><div class="dtb"><ul>${items.map(i=>`<li>${rich(norm(i).text||i)}</li>`).join('')}</ul></div></details>`;
  const DRAFT=n=>`<div class="draftbar"><span class="db-t">${esc(U.draftT||'')}</span>${rich(n||'')}</div>`;

  const SH=(n,k,id,sm)=>{const s=S[k]||['',''];return `<div class="sec-h${sm?' sm':''}"${id?` id="${id}"`:''}><span class="sn">${esc(n)}</span><span class="st">${esc(s[0])}</span>${s[1]?`<span class="sub">${esc(s[1])}</span>`:''}</div>`;};

  /* thesis */
  const th=d.thesis||{};
  const thesis=th.line1?`<div class="thesis"><div class="thesis-in">
      <div class="th-k">${esc(th.kicker||'')}</div>
      <div class="th-l"><span class="hl">${esc(th.line1)}</span><br><span class="d2">${esc(th.line2||'')}</span></div>
      <div class="th-b">${rich(th.body||'')}</div>
      ${th.confirm?`<div class="th-c"><span class="th-cb">${esc(U.confirmT||'')}</span>${rich(th.confirm)}</div>`:''}
      ${diagram(d.dia)}
    </div></div>`:'';

  /* sec 1 */
  const cc=d.conclusion||{};
  const cards=(cc.cards||[]).map(c=>`<div class="cc ${esc(c.kind)}">
      <div class="n">${esc(c.n)}</div><div class="t">${rich(c.t)}</div><div class="b">${rich(c.b)}</div></div>`).join('');
  const concl=`${cc.headline?`<div class="headline">${rich(cc.headline)}</div>`:''}
    ${cards?`<div class="ccs">${cards}</div>`:''}
    ${(cc.detail||[]).length?DT((U.dtConcl||'')+'（'+cc.detail.length+'件）',cc.detail):''}`;

  /* sec 2 */
  const dg=d.diagnosis||{};
  const KMAP=U.kmap||{};
  const layers=(dg.layers||[]).map(l=>`<div class="ly ${esc(l.kind)}">
      <div class="ly-badge">${esc(l.no)}</div>
      <div>
        <div class="ly-h"><span class="ly-t">${esc(l.name)}</span><span class="ly-s">${esc(l.sub||'')}</span><span class="ly-k">${esc(KMAP[l.kind]||'')}</span></div>
        <div class="ly-b">${rich(l.body)}</div>
        <div class="ly-v">→ ${rich(l.verdict)}</div>
        ${(l.evidence||[]).length?DT((U.dtEv||'')+'（'+l.evidence.length+'件）　'+l.from,l.evidence):''}
      </div>
    </div>`).join('');

  const H=dg.hypotheses||[];
  const cOk=H.filter(h=>h.verdict==='ok').length;
  const cNg=H.filter(h=>h.verdict==='ng').length;
  const cPt=H.filter(h=>h.verdict==='pt').length;
  const sb=H.length?`<div class="sb">
      <div class="sb-bar">
        <div class="sb-seg ok" style="flex:${cOk}">${cOk}</div>
        <div class="sb-seg ng" style="flex:${cNg}">${cNg}</div>
        <div class="sb-seg pt" style="flex:${cPt}">${cPt}</div>
      </div>
      <div class="sb-lg"><span><i class="ok"></i>${esc((U.sbLg||[])[0]||'')}</span><span><i class="ng"></i>${esc((U.sbLg||[])[1]||'')}</span><span><i class="pt"></i>${esc((U.sbLg||[])[2]||'')}</span>
        <span style="margin-left:auto;font-family:var(--fm);font-size:.66rem">${esc(U.sbUnit||'')} ${H.length} 件</span></div>
    </div>`:'';
  const hypTbl=H.length?`<details class="dt"><summary>${esc(U.dtHyp||'')}</summary><div class="dtb" style="padding:0 0 0 0">
      <div class="tw" style="border:none;border-radius:0">
      <table class="tbl"><thead><tr><th style="width:42%">${esc(U.thHyp||'')}</th><th>${esc(U.thVd||'')}</th><th>${esc(U.thNote||'')}</th></tr></thead><tbody>
      ${H.map((h,i)=>`<tr><td class="nm"><span class="hn">${String(i+1).padStart(2,'0')}</span>${rich(h.text)}</td><td><span class="vd ${esc(h.verdict)}">${esc((U.vd||{})[h.verdict]||'')}</span></td><td class="nt">${rich(h.note||'')}</td></tr>`).join('')}
      </tbody></table></div></div></details>`:'';

  /* sec 3 */
  const st=d.story||{};
  const story=st.core?`${st.draft?DRAFT(st.draftNote):''}
    <div class="core">${rich(st.core)}</div>
    <div class="g3">
      <div class="card"><div class="lb">Why now</div><div class="bd">${rich(st.whyNow||'—')}</div></div>
      <div class="card"><div class="lb">Why video</div><div class="bd">${rich(st.whyVideo||'—')}</div></div>
      <div class="card"><div class="lb">Why AIGC</div><div class="bd">${rich(st.whyAigc||'—')}</div></div>
    </div>
    ${st.fourth?`<div class="card fourth"><div class="lb">${esc(st.fourth.lb)}</div><div class="bd">${rich(st.fourth.bd)}</div></div>`:''}
    ${st.brandConcern?`<div class="call"><div class="ch">${esc((U.kick||{}).brand||'')}</div><div class="cb">${rich(st.brandConcern)}</div></div>`:''}`:PENDING;

  /* sec 4 */
  const R=d.roi;
  const roi=R?`<div class="lead">${rich(R.lead)}</div>
    <div class="roi">
      <div class="roi-col cost">
        <div class="roi-h"><span class="roi-t">${esc(R.cost.label)}</span><span class="roi-c">${R.cost.items.length}</span></div>
        <div class="roi-n">${esc(R.cost.note)}</div>
        <ul class="roi-l">${R.cost.items.map(i=>`<li>${rich(i)}</li>`).join('')}</ul>
      </div>
      <div class="roi-vs">vs</div>
      <div class="roi-col ret">
        <div class="roi-h"><span class="roi-t">${esc(R.ret.label)}</span><span class="roi-c">${R.ret.items.length}</span></div>
        <div class="roi-n">${esc(R.ret.note)}</div>
        <ul class="roi-l">${R.ret.items.map(i=>`<li><b>${rich(i.t)}</b><span>${rich(i.n)}</span></li>`).join('')}</ul>
      </div>
    </div>
    ${R.metrics?`<div class="mt">
      <div class="mt-l"><span class="mt-t">${esc(R.metrics.label)}</span><span class="mt-n">${esc(R.metrics.note)}</span></div>
      <div class="mt-i">${R.metrics.items.map(i=>`<span>${esc(i)}</span>`).join('')}</div>
      ${R.metrics.tie?`<div class="mt-x">${rich(R.metrics.tie)}</div>`:''}
    </div>`:''}
    ${R.kicker?`<div class="call"><div class="ch">${esc((U.kick||{}).roi||'')}</div><div class="cb">${rich(R.kicker)}</div></div>`:''}
    ${(R.blockers||[]).length?DT((U.dtCost||'')+'（'+R.blockers.length+'件）',R.blockers):''}`:'';

  /* sec 5a */
  const AP=d.applicability;
  const LVL=U.lvl||{};
  const appl=AP?`<div class="lead">${rich(AP.lead)}</div>
    <div class="apl">${AP.rows.map(r=>`<div class="ap ${esc(r.lv)}">
      <div class="ap-h"><span class="ap-t">${esc(r.t)}</span><span class="ap-k">${esc(LVL[r.lv]||'')}</span></div>
      <div class="ap-x">${esc(r.h)}</div>
      <div class="ap-b">${rich(r.b)}</div>
    </div>`).join('')}</div>`:'';

  /* sec 5 */
  const tg=d.targeting||{};
  const WL=U.wl||{}; const RL=U.rl||{};
  const arche=(tg.archetypes||[]).map(a=>`<div class="ar" data-w="${esc(a.w)}" data-r="${esc(a.r)}">
      <div class="ar-k">${esc(a.key)}</div>
      <div><div class="ar-n">${esc(a.name)}</div>${a.rank?`<div class="ar-r">${esc(a.rank)}</div>`:''}</div>
      <div class="ar-w"><div class="ar-wb w"><i></i><i></i><i></i></div><div class="ar-wl">③の壁 ${esc(WL[a.w]||'')}</div></div>
      <div class="ar-w"><div class="ar-wb r"><i></i><i></i><i></i></div><div class="ar-wl">再現性 ${esc(RL[a.r]||'')}</div></div>
      <div class="ar-b">${rich(a.note)}</div>
    </div>`).join('');
  const targeting=(tg.scores||[]).length?'':`${PENDING}
    ${arche?SH('—','s5b',null,true)
      +(tg.axisNote?`<div class="lead">${rich(tg.axisNote)}</div>`:'')
      +`<div class="arc">${arche}</div>`:''}
    ${tg.archetypeNote?`<div class="call"><div class="ch">${esc((U.kick||{}).arch||'')}</div><div class="cb">${rich(tg.archetypeNote)}</div></div>`:''}`;

  /* sec 6 */
  const tl=d.timeline||{};
  const waves=(tl.waves||[]).length?`${tl.draft?DRAFT(tl.draftNote):''}
    <div class="rail">${tl.waves.map(w=>`<div class="rw ${esc(w.kind)}"><div class="rw-c">
      <div class="rw-h"><span class="rw-p">${esc(w.period)}</span><span class="rw-l">${esc(w.label)}</span><span class="rw-t">${esc(w.tag)}</span></div>
      ${(w.items||[]).length?DT((U.dtWave||'')+' '+w.items.length+'件',w.items):''}
    </div></div>`).join('')}</div>
    ${(tl.checkpoints||[]).length?`<div class="cks">${tl.checkpoints.map(c=>`<div class="ck"><span class="ck-d">${esc(c.d)}</span><span class="ck-t">${rich(c.t)}</span></div>`).join('')}</div>`:''}`:PENDING;

  /* sec 7 */
  const NA=d.nextActions||[];
  const SRC=U.src||{}; const SCLS={memo:'sm',mtg2:'s2',mtg1:'s1'};
  const nas=NA.length?`<div class="tw"><table class="tbl"><thead><tr><th style="width:56%">アクション</th><th>出典</th><th>担当</th><th>期日</th><th>状態</th></tr></thead><tbody>
      ${NA.map(n=>`<tr><td class="nm">${rich(n.action)}${n.note?`<span class="sub-n">${rich(n.note)}</span>`:''}</td><td>${n.src&&SRC[n.src]?`<span class="srcb ${SCLS[n.src]||''}">${esc(SRC[n.src])}</span>`:'—'}</td><td class="nt">${esc(n.owner||'—')}</td><td class="nt">${esc(n.due||'—')}</td><td><span class="stat ${esc(n.status||'未着手')}">${esc(n.status||'未着手')}</span></td></tr>`).join('')}
      </tbody></table></div>
      ${NA.some(n=>!n.owner||!n.due)?'<div class="warnbar">'+esc(U.naWarn||'')+'</div>':''}`:PENDING;

  const oi=(d.openIssues||[]).length?`<ul class="lst oi">${d.openIssues.map(li).join('')}</ul>`:PENDING;
  const ss=(d.skillSeeds||[]).length?`<ul class="lst ss">${d.skillSeeds.map(li).join('')}</ul>`:PENDING;
  const cv=(d.caveats||[]).length?`<ul class="lst cv">${d.caveats.map(li).join('')}</ul>`:'';
  const srcs=(d.sources||[]).map(esc).join('　／　')||'—';

  document.getElementById('app').innerHTML=`
  <div class="shell">
    <nav class="sidenav">
      <a class="bk" href="../board.html">← AIGCボード</a>
      <div class="snt">Contents</div>
      <a href="#s1"><span class="sn">01</span>結論</a>
      <a href="#s2"><span class="sn">02</span>診断</a>
      <a href="#s3"><span class="sn">03</span>ストーリー</a>
      ${roi?'<a href="#s4"><span class="sn">04</span>ROIフレーム</a>':''}
      <a href="#s5"><span class="sn">05</span>攻め先</a>
      <a href="#s6"><span class="sn">06</span>90日計画</a>
      <a href="#s7"><span class="sn">07</span>ネクストアクション</a>
      <a href="#s8"><span class="sn">08</span>残った論点</a>
      <a href="#s9"><span class="sn">09</span>仕組み化の芽</a>
      ${cv?'<a href="#s10"><span class="sn">10</span>留意点</a>':''}
    </nav>
    <div class="main">
      <header>
        <div class="kick">${esc(m.event||'')}</div>
        <h1>${esc(m.title||'')}</h1>
        <div class="metarow">
          ${m.date?`<span class="mchip">${esc(m.date)}</span>`:''}
          <span class="mchip">${esc(m.status||'')}</span>
          <span class="mchip">最終更新 ${esc(m.lastUpdate||'')}</span>
        </div>
      </header>
      ${thesis}
      <div class="wrap">
        ${SH('01','s1','s1')}
        ${concl}

        ${SH('02','s2','s2')}
        <div class="lead">${rich(U.leadDiag||'')}</div>
        <div class="lys">${layers}</div>
        ${SH('—','s2b',null,true)}
        ${sb}
        ${hypTbl}

        ${SH('03','s3','s3')}
        ${story}

        ${roi?SH('04','s4','s4')+roi:''}

        ${SH('05','s5','s5')}
        ${appl?SH('—','s5a',null,true)+appl:''}
        ${targeting}

        ${SH('06','s6','s6')}
        ${waves}

        ${SH('07','s7','s7')}
        ${nas}

        ${SH('08','s8','s8')}
        ${oi}

        ${SH('09','s9','s9')}
        ${ss}

        ${cv?SH('10','s10','s10')+'<div class="lead">'+rich(U.leadCaveat||'')+'</div>'+cv:''}

        <div class="src">出典: ${srcs}<br>最終更新: ${esc(m.lastUpdate||'')} JST</div>
      </div>
      <footer><span class="conf">CONFIDENTIAL</span>FY26Q3 JP OffSite ／ AIGC需要喚起ディスカッション</footer>
    </div>
  </div>`;
  wireScrollSpy();
}
function wireScrollSpy(){
  const links=[...document.querySelectorAll('.sidenav a[href^="#"]')];
  const secs=links.map(a=>document.getElementById(a.getAttribute('href').slice(1))).filter(Boolean);
  if(!secs.length)return;
  const onScroll=()=>{
    const y=window.scrollY+100;let cur=0;
    secs.forEach((s,i)=>{if(s.offsetTop<=y)cur=i;});
    links.forEach((a,i)=>a.classList.toggle('on',i===cur));
  };
  window.addEventListener('scroll',onScroll,{passive:true});onScroll();
}
const SS_KEY='aigc_cred';
const SSO_TTL_MS=2592000000;/*30d*/
function showData(d){render(d);document.getElementById('lock').style.display='none';document.getElementById('app').style.display='block';}
function tryToken(credential,fromCache){
  return (async()=>{
    const info=_jwt(credential);
    const now=Math.floor(Date.now()/1000);
    const dom=info&&(info.hd||((info.email||'').split('@')[1])||'');
    const ok=fromCache?!!(info&&dom==='fireworkhq.com'&&info.aud===CLIENT_ID):!!(info&&dom==='fireworkhq.com'&&info.aud===CLIENT_ID&&(!info.exp||info.exp>now));
    if(!ok){try{localStorage.removeItem(SS_KEY);localStorage.removeItem(SS_KEY+'_exp');}catch(_){}
      if(!fromCache){document.getElementById('err').textContent='アクセス権がありません（@fireworkhq.com のみ）';}
      return false;}
    try{const d=await decrypt(PP);showData(d);try{localStorage.setItem(SS_KEY,credential);localStorage.setItem(SS_KEY+'_exp',String(Date.now()+SSO_TTL_MS));}catch(e){}return true;}
    catch(e){if(!fromCache){document.getElementById('err').textContent='描画に失敗しました: '+(e&&e.message?e.message:e);console.error(e);}return false;}
  })();
}
function onCredential(resp){document.getElementById('err').textContent='認証中…';tryToken(resp.credential,false);}
function initGoogle(){
  if(!window.google||!google.accounts){document.getElementById('err').textContent='Googleログインを読み込めませんでした。再読み込みしてください';return;}
  google.accounts.id.initialize({client_id:CLIENT_ID,callback:onCredential,hd:'fireworkhq.com',auto_select:true});
  google.accounts.id.renderButton(document.getElementById('gbtn'),{theme:'filled_blue',size:'large',text:'signin_with',shape:'pill',width:280});
  google.accounts.id.prompt();
}
window.onload=function(){
  let cached=null;try{const _e=localStorage.getItem(SS_KEY+'_exp');if(_e&&Date.now()<parseInt(_e,10)){cached=localStorage.getItem(SS_KEY);}else{localStorage.removeItem(SS_KEY);localStorage.removeItem(SS_KEY+'_exp');}}catch(e){}
  if(cached){document.getElementById('err').textContent='読み込み中…';tryToken(cached,true).then(ok=>{if(!ok)initGoogle();});}
  else{initGoogle();}
};
</script>
