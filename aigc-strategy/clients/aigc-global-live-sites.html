<style>
:root{--ink:#1a1a2e;--accent:#FA006D;--teal:#1B998B;--navy:#0F3460;--bg:#f6f7f9;--card:#fff;--border:#e7e9ee;--muted:#6c757d;--active:#1B998B;--warn:#f5a623;--danger:#e74c3c;--hold:#8890a0;--check:#0F3460;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans JP",-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;font-size:14px}
#lock{position:fixed;inset:0;background:linear-gradient(135deg,#1a1a2e,#0F3460);display:flex;align-items:center;justify-content:center;z-index:1000}
.lockbox{background:#fff;border-radius:16px;padding:40px 36px;width:min(92vw,400px);text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.lockbox .em{font-size:2.2rem;margin-bottom:10px}
.lockbox h1{font-size:1.12rem;margin-bottom:6px}
.lockbox p{color:var(--muted);font-size:.82rem;margin-bottom:20px}
.lockbox .gwrap{display:flex;justify-content:center;min-height:44px}
.lockbox .err{color:var(--danger);font-size:.8rem;min-height:1.2em;margin-top:14px}
.lockbox .note{color:#aab;font-size:.68rem;margin-top:16px}
#app{display:none;max-width:980px;margin:0 auto;padding:0 0 60px}
header{background:linear-gradient(135deg,#1a1a2e 0%,#0F3460 100%);color:#fff;padding:24px 32px 26px}
header .back{display:inline-block;color:#cdd3e0;font-size:.74rem;text-decoration:none;margin-bottom:14px;border:1px solid rgba(255,255,255,.25);border-radius:20px;padding:4px 12px;transition:background .15s}
header .back:hover{background:rgba(255,255,255,.12)}
header .cat-tag{color:var(--accent);font-weight:700;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase}
header h1{font-size:1.6rem;font-weight:900;margin:6px 0 8px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header .headline{color:#dfe4ee;font-size:.92rem;max-width:780px;margin-top:4px;line-height:1.6}
header .scope{margin-top:10px;font-size:.74rem;color:var(--muted);line-height:1.6}
.wrap{padding:0 32px}
.stats-row{display:flex;gap:12px;margin-top:22px;flex-wrap:wrap}
.stat-card{flex:1;min-width:140px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 16px;border-left:4px solid var(--teal)}
.stat-card.accent{border-left-color:var(--accent)}
.stat-card.navy{border-left-color:var(--navy)}
.stat-card .lbl{font-size:.7rem;color:var(--muted);font-weight:700;letter-spacing:.05em}
.stat-card .num{font-size:1.7rem;font-weight:900;color:var(--ink);line-height:1.1;margin-top:4px}
.stat-card .sub{font-size:.7rem;color:var(--muted);margin-top:2px}
.tier-h{margin:36px 0 16px;padding:14px 18px;background:linear-gradient(135deg,#1a1a2e,#0F3460);color:#fff;border-radius:10px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.tier-h.tone-critical{background:linear-gradient(135deg,#FA006D,#c4005a)}
.tier-h.tone-high{background:linear-gradient(135deg,#7c3aed,#4c1d95)}
.tier-h.tone-mid{background:linear-gradient(135deg,#1B998B,#0F3460)}
.tier-badge{background:rgba(255,255,255,.18);padding:3px 12px;border-radius:20px;font-size:.7rem;font-weight:900;letter-spacing:.1em}
.tier-name{font-size:1.06rem;font-weight:900;flex:1}
.tier-lead{flex-basis:100%;font-size:.78rem;color:rgba(255,255,255,.85);line-height:1.55;margin-top:4px}
.site-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px 20px;margin-bottom:14px;border-left:4px solid var(--accent)}
.site-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.site-icon{font-size:2rem;line-height:1;flex-shrink:0}
.site-h{flex:1;min-width:200px}
.site-name{font-size:1.06rem;font-weight:900;color:var(--ink);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.site-status{font-size:.66rem;font-weight:800;background:#fdeaf1;color:var(--accent);padding:3px 10px;border-radius:20px;white-space:nowrap}
.site-meta{font-size:.74rem;color:var(--muted);margin-top:3px;display:flex;gap:14px;flex-wrap:wrap}
.site-meta .mk{font-weight:700;color:var(--navy)}
.site-sum{font-size:.82rem;color:var(--ink);line-height:1.65;margin:6px 0 12px}
.metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin:10px 0}
.metric-cell{background:#f7f9fc;border:1px solid var(--border);border-radius:8px;padding:9px 10px;text-align:center}
.metric-cell .v{font-size:1.05rem;font-weight:900;color:var(--accent);line-height:1.1}
.metric-cell .l{font-size:.66rem;color:var(--muted);margin-top:3px;line-height:1.4}
.prod-list{margin:10px 0 4px;background:#fafbfd;border:1px solid var(--border);border-radius:8px;padding:8px 10px}
.prod-row{display:flex;align-items:flex-start;gap:10px;padding:8px 4px;border-bottom:1px dashed var(--border)}
.prod-row:last-child{border-bottom:none}
.prod-num{flex:0 0 24px;width:24px;height:24px;background:var(--navy);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:800}
.prod-body{flex:1;min-width:0}
.prod-name{font-size:.78rem;font-weight:800;color:var(--ink);line-height:1.5}
.prod-note{font-size:.7rem;color:var(--muted);margin-top:2px;line-height:1.5}
.prod-link{display:inline-block;color:var(--accent);font-size:.72rem;font-weight:700;text-decoration:none;margin-top:4px;padding:3px 10px;border:1px solid var(--accent);border-radius:20px;transition:all .15s}
.prod-link:hover{background:var(--accent);color:#fff}
.prod-link.disabled{color:var(--muted);border-color:var(--border);pointer-events:none}
.story-box{background:#fff8fb;border:1px solid #fce0eb;border-left:3px solid var(--accent);border-radius:8px;padding:10px 14px;font-size:.78rem;line-height:1.6;color:var(--ink);margin-top:10px}
.story-box .stx{font-weight:900;color:var(--accent);font-size:.7rem;letter-spacing:.05em;margin-right:6px}
.src-note{font-size:.66rem;color:var(--muted);margin-top:8px;font-style:italic}
.pitch-box{background:var(--ink);color:#fff;border-radius:12px;padding:20px 22px;margin:30px 0 14px}
.pitch-h{font-size:1rem;font-weight:900;margin-bottom:14px;letter-spacing:.02em}
.pitch-step{display:flex;align-items:flex-start;gap:14px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.1)}
.pitch-step:last-child{border-bottom:none}
.pitch-n{font-size:1.3rem;font-weight:900;color:var(--accent);flex-shrink:0;width:30px}
.pitch-body{flex:1}
.pitch-t{font-size:.86rem;font-weight:900;color:#fff;margin-bottom:3px}
.pitch-b{font-size:.76rem;color:#cdd3e0;line-height:1.6}
.sec-h{font-size:1.05rem;font-weight:900;margin:32px 0 14px;padding-left:12px;border-left:4px solid var(--navy)}
.cross-card{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--teal);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.cross-card .cx-t{font-size:.84rem;font-weight:900;color:var(--ink);margin-bottom:4px}
.cross-card .cx-b{font-size:.76rem;line-height:1.6;color:var(--ink)}
.src{margin-top:22px;font-size:.72rem;color:var(--muted);padding:12px 14px;background:#f2f4f8;border-radius:8px}
footer{text-align:center;color:var(--muted);font-size:.72rem;margin-top:40px;padding:20px}
.conf{display:inline-block;background:#fdeaf1;color:var(--accent);font-weight:700;font-size:.7rem;padding:3px 12px;border-radius:20px;margin-right:8px}
@media print{
  body{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #lock{display:none!important}
  #app{display:block!important;max-width:none}
  .site-card,.tier-h,.cross-card,.pitch-box{page-break-inside:avoid}
}
@media(max-width:640px){
  .wrap{padding:0 18px}
  header{padding:20px 18px 22px}
  .stat-card{min-width:120px}
}
</style>
</head>

async function decrypt(pass){
  const enc=new TextEncoder();
  const salt=Uint8Array.from(atob(PAYLOAD.salt),c=>c.charCodeAt(0));
  const iv=Uint8Array.from(atob(PAYLOAD.iv),c=>c.charCodeAt(0));
  const ct=Uint8Array.from(atob(PAYLOAD.ct),c=>c.charCodeAt(0));
  const baseKey=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:PAYLOAD.iters,hash:'SHA-256'},baseKey,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct);
  return JSON.parse(new TextDecoder().decode(pt));
}
function _jwt(t){try{const p=t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');return JSON.parse(decodeURIComponent(escape(atob(p))));}catch(e){return null;}}
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function render(d){
  const stats=`<div class="stats-row">
    <div class="stat-card accent"><div class="lbl">公開リファレンス</div><div class="num">${d.stats.publicRef}</div><div class="sub">社（Live URL あり）</div></div>
    <div class="stat-card"><div class="lbl">掲載動画</div><div class="num">${esc(d.stats.totalVideos)}</div><div class="sub">本（合計）</div></div>
    <div class="stat-card navy"><div class="lbl">最新ローンチ</div><div class="num" style="font-size:1.05rem;margin-top:10px">${esc(d.stats.latest)}</div><div class="sub">直近の追加</div></div>
    <div class="stat-card navy"><div class="lbl">集計基準</div><div class="num" style="font-size:1.05rem;margin-top:10px">${esc(d.stats.asOf)}</div><div class="sub">時点</div></div>
  </div>`;
  const tierHTML=d.tiers.map(t=>{
    const sitesInTier=d.sites.filter(s=>s.tier===t.id);
    const siteCards=sitesInTier.map(s=>{
      const metrics=(s.metrics||[]).map(m=>`<div class="metric-cell"><div class="v">${esc(m.v)}</div><div class="l">${esc(m.l)}</div></div>`).join('');
      const prods=(s.products||[]).map((p,i)=>{
        const linkHTML=p.url?`<a class="prod-link" href="${esc(p.url)}" target="_blank" rel="noopener">商品ページを開く →</a>`:`<span class="prod-link disabled">URL なし</span>`;
        return `<div class="prod-row">
          <div class="prod-num">${i+1}</div>
          <div class="prod-body">
            <div class="prod-name">${esc(p.name)}</div>
            <div class="prod-note">${esc(p.note||'')}</div>
            ${linkHTML}
          </div>
        </div>`;
      }).join('');
      return `<div class="site-card">
        <div class="site-head">
          <div class="site-icon">${esc(s.icon)}</div>
          <div class="site-h">
            <div class="site-name">${esc(s.client)}<span class="site-status">${esc(s.status)}</span></div>
            <div class="site-meta"><span class="mk">${esc(s.market)}</span><span>${esc(s.industry)}</span></div>
          </div>
        </div>
        <div class="site-sum">${esc(s.summary)}</div>
        ${metrics?`<div class="metric-grid">${metrics}</div>`:''}
        <div class="prod-list">${prods}</div>
        ${s.story?`<div class="story-box"><span class="stx">▶ 営業ストーリー</span>${esc(s.story)}</div>`:''}
        ${s.sourceNote?`<div class="src-note">出典: ${esc(s.sourceNote)}</div>`:''}
      </div>`;
    }).join('');
    return `<div class="tier-h tone-${esc(t.tone||'mid')}">
      <span class="tier-badge">${esc(t.label)}</span>
      <span class="tier-name">${esc(t.icon)}　${esc(t.name)}　<span style="font-weight:700;font-size:.74rem;opacity:.85">${sitesInTier.length}社</span></span>
      <div class="tier-lead">${esc(t.lead)}</div>
    </div>${siteCards}`;
  }).join('');
  const pitchSteps=(d.pitchPlaybook.steps||[]).map(s=>`<div class="pitch-step">
    <div class="pitch-n">${esc(s.n)}</div>
    <div class="pitch-body"><div class="pitch-t">${esc(s.t)}</div><div class="pitch-b">${esc(s.b)}</div></div>
  </div>`).join('');
  const cross=(d.crossLearning||[]).map(x=>`<div class="cross-card"><div class="cx-t">${esc(x.title)}</div><div class="cx-b">${esc(x.body)}</div></div>`).join('');
  document.getElementById('app').innerHTML=
    `<header><a class="back" href="../board.html">← AIGC進捗ボードに戻る</a>
    <div class="cat-tag">グローバル AIGC Live サイト集</div>
    <h1>🌐 グローバル AIGC 導入実績 — Live サイト集</h1>
    <div class="headline">${esc(d.headline)}</div>
    <div class="scope">${esc(d.scope)}</div></header>
    <div class="wrap">${stats}
    ${tierHTML}
    <div class="pitch-box">
      <div class="pitch-h">${esc(d.pitchPlaybook.title)}</div>
      ${pitchSteps}
    </div>
    <div class="sec-h">🧠 横断インサイト・運用ルール</div>
    ${cross}
    <div class="src">本ページは Firework が制作・実装した AIGC 動画が実サイトで稼働している証跡集。営業ピッチで「実際にこう動いている」を即見せるための社内武器。新規ローンチがあれば本ページに追記し、Tier 3→Tier 1 の昇格運用で営業武器を充実させる。最終更新: ${esc(d.asOf)} JST</div>
    </div>
    <footer><span class="conf">CONFIDENTIAL — 社外秘</span>グローバル AIGC Live サイト集　最終更新 ${esc(d.asOf)} JST</footer>`;
}
const SS_KEY='aigc_cred';
const SSO_TTL_MS=2592000000;/*30日=firework-sso-no-popup.md準拠の自前TTL*/
function showData(d){render(d);document.getElementById('lock').style.display='none';document.getElementById('app').style.display='block';}
function tryToken(credential,fromCache){
  return (async()=>{
    const info=_jwt(credential);
    const now=Math.floor(Date.now()/1000);
    const dom=info&&(info.hd||((info.email||'').split('@')[1])||'');
    const ok=fromCache?!!(info&&dom==='fireworkhq.com'&&info.aud===CLIENT_ID):!!(info&&dom==='fireworkhq.com'&&info.aud===CLIENT_ID&&(!info.exp||info.exp>now));
    if(!ok){try{localStorage.removeItem(SS_KEY);localStorage.removeItem(SS_KEY+'_exp');}catch(_){}
      if(!fromCache){document.getElementById('err').textContent='アクセス権がありません（@fireworkhq.com のみ）';}
      return false;}
    try{const d=await decrypt(PP);showData(d);try{localStorage.setItem(SS_KEY,credential);localStorage.setItem(SS_KEY+'_exp',String(Date.now()+SSO_TTL_MS));}catch(e){}return true;}
    catch(e){if(!fromCache){document.getElementById('err').textContent='データの復号に失敗しました';}return false;}
  })();
}
function onCredential(resp){document.getElementById('err').textContent='認証中…';tryToken(resp.credential,false);}
function initGoogle(){
  if(!window.google||!google.accounts){document.getElementById('err').textContent='Googleログインを読み込めませんでした。再読み込みしてください';return;}
  google.accounts.id.initialize({client_id:CLIENT_ID,callback:onCredential,hd:'fireworkhq.com',auto_select:true});
  google.accounts.id.renderButton(document.getElementById('gbtn'),{theme:'filled_blue',size:'large',text:'signin_with',shape:'pill',width:280});
  google.accounts.id.prompt(function(notification){
    if(notification.isNotDisplayed()||notification.isSkippedMoment()||notification.isDismissedMoment()){
      console.warn('[FireworkSSO] One Tap not shown.');
    }
  });
}
window.onload=function(){
  let cached=null;try{const _e=localStorage.getItem(SS_KEY+'_exp');if(_e&&Date.now()<parseInt(_e,10)){cached=localStorage.getItem(SS_KEY);}else{localStorage.removeItem(SS_KEY);localStorage.removeItem(SS_KEY+'_exp');}}catch(e){}
  if(cached){document.getElementById('err').textContent='読み込み中…';tryToken(cached,true).then(ok=>{if(!ok)initGoogle();});}
  else{initGoogle();}
};
</script>
