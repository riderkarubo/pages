<style>
:root{--ink:#1a1a2e;--accent:#FA006D;--teal:#1B998B;--navy:#0F3460;--bg:#f6f7f9;--card:#fff;--border:#e7e9ee;--muted:#6c757d;--active:#1B998B;--warn:#f5a623;--danger:#e74c3c;--hold:#8890a0;--check:#0F3460;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans JP",-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;font-size:14px}
#lock{position:fixed;inset:0;background:linear-gradient(135deg,#1a1a2e,#0F3460);display:flex;align-items:center;justify-content:center;z-index:1000}
.lockbox{background:#fff;border-radius:16px;padding:40px 36px;width:min(92vw,400px);text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.lockbox .em{font-size:2.2rem;margin-bottom:10px}
.lockbox h1{font-size:1.12rem;margin-bottom:6px}
.lockbox p{color:var(--muted);font-size:.82rem;margin-bottom:20px}
.lockbox .gwrap{display:flex;justify-content:center;min-height:44px}
.lockbox .err{color:var(--danger);font-size:.8rem;min-height:1.2em;margin-top:14px}
.lockbox .note{color:#aab;font-size:.68rem;margin-top:16px}
#app{display:none;max-width:960px;margin:0 auto;padding:0 0 60px}
header{background:linear-gradient(135deg,#1a1a2e 0%,#0F3460 100%);color:#fff;padding:24px 32px 26px}
header .back{display:inline-block;color:#cdd3e0;font-size:.74rem;text-decoration:none;margin-bottom:14px;border:1px solid rgba(255,255,255,.25);border-radius:20px;padding:4px 12px;transition:background .15s}
header .back:hover{background:rgba(255,255,255,.12)}
header .cat-tag{color:var(--accent);font-weight:700;font-size:.72rem;letter-spacing:.06em}
header h1{font-size:1.6rem;font-weight:900;margin:6px 0 8px}
header .headline{color:#dfe4ee;font-size:.86rem;max-width:780px;margin-top:4px;line-height:1.6}
.wrap{padding:0 32px}
.sec-h{font-size:1.02rem;font-weight:900;margin:28px 0 12px;padding-left:12px;border-left:4px solid var(--accent)}
.sumbox{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--navy);border-radius:10px;padding:16px 18px;font-size:.86rem;line-height:1.85}
.note2{font-size:.8rem;color:#444;line-height:1.8;margin-top:10px;background:#f2f4f8;border-radius:8px;padding:12px 16px}
.cap{font-size:.72rem;color:var(--muted);margin-top:8px}
.pkgs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.pkg{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px 20px;border-top:4px solid var(--navy)}
.pkg-scale{border-top-color:var(--accent)}
.pkg-tier{font-size:.7rem;font-weight:900;color:var(--muted);letter-spacing:.08em}
.pkg-label{font-size:.92rem;font-weight:700;margin:2px 0 8px}
.pkg-vol{font-size:1.55rem;font-weight:900;color:var(--navy);font-variant-numeric:tabular-nums;line-height:1.1}
.pkg-scale .pkg-vol{color:var(--accent)}
.pkg-per{font-size:.78rem;font-weight:700;color:#333;margin:4px 0 8px}
.pkg-desc{font-size:.76rem;color:var(--muted);line-height:1.6}
.track-in{font-size:.8rem;font-weight:700;color:var(--navy);background:#eef1f6;border-radius:8px;padding:8px 14px;margin-bottom:12px}
.chain{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-bottom:14px}
.chain-step{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 14px;position:relative;border-left:3px solid var(--teal)}
.chain-n{position:absolute;top:10px;right:12px;font-size:1.2rem;font-weight:900;color:#d8ecea}
.chain-h{font-size:.84rem;font-weight:900;margin-bottom:4px;padding-right:20px}
.chain-t{font-size:.74rem;color:#444;line-height:1.6}
.phases{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.phase{background:#fafbfc;border:1px solid var(--border);border-radius:10px;padding:14px 16px;border-top:3px solid var(--navy)}
.phase-h{font-size:.86rem;font-weight:900;margin-bottom:5px}
.phase-t{font-size:.76rem;color:#444;line-height:1.65}
.phase-out{font-size:.72rem;color:var(--navy);background:#eef1f6;border-radius:6px;padding:6px 10px;margin-top:8px;font-weight:700}
.track-hook{font-size:.74rem;color:var(--muted);margin-top:10px;padding-left:14px;border-left:2px dashed var(--accent);line-height:1.6}
.bsteps{display:grid;grid-template-columns:1fr;gap:10px}
.bstep{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 16px;border-left:3px solid var(--accent)}
.bstep-h{font-size:.88rem;font-weight:900;margin-bottom:5px}
.bstep-t{font-size:.78rem;color:#444;line-height:1.7}
.nalist{list-style:none;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:6px 8px;margin-top:6px}
.nalist li{padding:10px 12px 10px 30px;position:relative;font-size:.82rem;border-bottom:1px solid #f0f0f0;line-height:1.6}
.nalist li:last-child{border-bottom:none}
.nalist li:before{content:"▶";position:absolute;left:11px;color:var(--teal);font-size:.66rem;top:13px}
.src{margin-top:22px;font-size:.72rem;color:var(--muted);padding:12px 14px;background:#f2f4f8;border-radius:8px}
footer{text-align:center;color:var(--muted);font-size:.72rem;margin-top:40px;padding:20px}
.conf{display:inline-block;background:#fdeaf1;color:var(--accent);font-weight:700;font-size:.7rem;padding:3px 12px;border-radius:20px;margin-right:8px}
</style>

  const ct=Uint8Array.from(atob(PAYLOAD.ct),c=>c.charCodeAt(0));
  const baseKey=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:PAYLOAD.iters,hash:'SHA-256'},baseKey,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct);
  return JSON.parse(new TextDecoder().decode(pt));
}
function _jwt(t){try{const p=t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');return JSON.parse(decodeURIComponent(escape(atob(p))));}catch(e){return null;}}
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function render(c){
  const pkgs=(c.packages||[]).map(p=>`<div class="pkg ${p.tier==='量産'?'pkg-scale':'pkg-trial'}"><div class="pkg-tier">${esc(p.tier)}</div><div class="pkg-label">${esc(p.label)}</div><div class="pkg-vol">${esc(p.vol)}</div><div class="pkg-per">${esc(p.per)}</div><div class="pkg-desc">${esc(p.desc)}</div></div>`).join('');
  const chain=((c.trackA&&c.trackA.chain)||[]).map((s,i)=>`<div class="chain-step"><div class="chain-n">${i+1}</div><div class="chain-h">${esc(s.h)}</div><div class="chain-t">${esc(s.t)}</div></div>`).join('');
  const phasesA=((c.trackA&&c.trackA.phases)||[]).map(p=>`<div class="phase"><div class="phase-h">${esc(p.h)}</div><div class="phase-t">${esc(p.t)}</div>${p.out?`<div class="phase-out">OUT: ${esc(p.out)}</div>`:''}</div>`).join('');
  const stepsB=((c.trackB&&c.trackB.steps)||[]).map(s=>`<div class="bstep"><div class="bstep-h">${esc(s.h)}</div><div class="bstep-t">${esc(s.t)}</div></div>`).join('');
  const nas=(c.nextActions||[]).map(n=>`<li>${esc(n)}</li>`).join('');
  document.getElementById('app').innerHTML=`
  <header><a class="back" href="../board.html">← AIGC進捗ボードに戻る</a>
    <div class="cat-tag">${esc(c.client)}｜AIGCトライアルパッケージ</div>
    <h1>${esc(c.title)}</h1>
    <div class="headline">${esc(c.subtitle)}</div>
  </header>
  <div class="wrap">
    <div class="sec-h">共通の前提・ゴール</div>
    <div class="sumbox">${esc(c.premise)}</div>
    <div class="note2">${esc(c.strategicMeaning)}</div>
    <div class="sec-h">トライアル → 量産｜想定パッケージ</div>
    <div class="pkgs">${pkgs}</div>
    <p class="cap">${esc(c.packagesNote)}</p>
    <div class="sec-h">Track A／ライブ起点 — ${esc(c.trackA.subtitle)}</div>
    <div class="track-in">入り口：${esc(c.trackA.entry)}</div>
    <div class="chain">${chain}</div>
    <div class="phases">${phasesA}</div>
    <div class="track-hook">この先（拡張フック）：${esc(c.trackA.hook)}</div>
    <div class="sec-h">Track B／生成のみ — ${esc(c.trackB.subtitle)}</div>
    <div class="track-in">入り口：${esc(c.trackB.entry)}</div>
    <div class="bsteps">${stepsB}</div>
    <div class="track-hook">この先（拡張フック）：${esc(c.trackB.hook)}</div>
    <div class="sec-h">2トラック共通の背骨 ＆ Next Action</div>
    <div class="sumbox">${esc(c.backbone)}</div>
    <ul class="nalist">${nas}</ul>
    <div class="src">出典: ${(c.sources||[]).map(esc).join(' ／ ')}　／　最終更新: ${esc(c.lastUpdate||'')}</div>
  </div>
  <footer><span class="conf">CONFIDENTIAL — 社外秘</span>AIGCトライアルパッケージ案　最終更新 ${esc(c.lastUpdate||'')} JST</footer>`;
}
const SS_KEY='aigc_cred';
function showData(d){render(d);document.getElementById('lock').style.display='none';document.getElementById('app').style.display='block';}
function tryToken(credential,fromCache){
  return (async()=>{
    const info=_jwt(credential);
    const now=Math.floor(Date.now()/1000);
    const dom=info&&(info.hd||((info.email||'').split('@')[1])||'');
    const ok=info&&dom==='fireworkhq.com'&&info.aud===CLIENT_ID&&(!info.exp||info.exp>now);
    if(!ok){try{sessionStorage.removeItem(SS_KEY);}catch(_){}
      if(!fromCache){document.getElementById('err').textContent='アクセス権がありません（@fireworkhq.com のみ）';}
      return false;}
    try{const d=await decrypt(PP);showData(d);try{sessionStorage.setItem(SS_KEY,credential);}catch(e){}return true;}
    catch(e){if(!fromCache){document.getElementById('err').textContent='データの復号に失敗しました';}return false;}
  })();
}
function onCredential(resp){document.getElementById('err').textContent='認証中…';tryToken(resp.credential,false);}
function initGoogle(){
  if(!window.google||!google.accounts){document.getElementById('err').textContent='Googleログインを読み込めませんでした。再読み込みしてください';return;}
  google.accounts.id.initialize({client_id:CLIENT_ID,callback:onCredential,hd:'fireworkhq.com',auto_select:true});
  google.accounts.id.renderButton(document.getElementById('gbtn'),{theme:'filled_blue',size:'large',text:'signin_with',shape:'pill',width:280});
  google.accounts.id.prompt();
}
window.onload=function(){
  let cached=null;try{cached=sessionStorage.getItem(SS_KEY);}catch(e){}
  if(cached){document.getElementById('err').textContent='読み込み中…';tryToken(cached,true).then(ok=>{if(!ok)initGoogle();});}
  else{initGoogle();}
};
</script>
