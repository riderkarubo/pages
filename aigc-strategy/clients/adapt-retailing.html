:root{--ink:#1a1a2e;--accent:#FA006D;--teal:#1B998B;--navy:#0F3460;--bg:#f6f7f9;--card:#fff;--border:#e7e9ee;--muted:#6c757d;--active:#1B998B;--warn:#f5a623;--danger:#e74c3c;--hold:#8890a0;--check:#0F3460;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans JP",-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;font-size:14px}
#lock{position:fixed;inset:0;background:linear-gradient(135deg,#1a1a2e,#0F3460);display:flex;align-items:center;justify-content:center;z-index:1000}
.lockbox{background:#fff;border-radius:16px;padding:40px 36px;width:min(92vw,400px);text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.lockbox .em{font-size:2.2rem;margin-bottom:10px}
.lockbox h1{font-size:1.12rem;margin-bottom:6px}
.lockbox p{color:var(--muted);font-size:.82rem;margin-bottom:20px}
.lockbox .gwrap{display:flex;justify-content:center;min-height:44px}
.lockbox .err{color:var(--danger);font-size:.8rem;min-height:1.2em;margin-top:14px}
.lockbox .note{color:#aab;font-size:.68rem;margin-top:16px}
#app{display:none;max-width:920px;margin:0 auto;padding:0 0 60px}
header{background:linear-gradient(135deg,#1a1a2e 0%,#0F3460 100%);color:#fff;padding:24px 32px 26px}
header .back{display:inline-block;color:#cdd3e0;font-size:.74rem;text-decoration:none;margin-bottom:14px;border:1px solid rgba(255,255,255,.25);border-radius:20px;padding:4px 12px;transition:background .15s}
header .back:hover{background:rgba(255,255,255,.12)}
header .cat-tag{color:var(--accent);font-weight:700;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase}
header h1{font-size:1.6rem;font-weight:900;margin:6px 0 8px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header .headline{color:#dfe4ee;font-size:.92rem;max-width:760px;margin-top:4px;line-height:1.6}
.wrap{padding:0 32px}
.sumbox{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:10px;padding:16px 18px;margin-top:22px;font-size:.86rem;line-height:1.8}
.sec-h{font-size:1.02rem;font-weight:900;margin:28px 0 12px;padding-left:12px;border-left:4px solid var(--navy)}
.tbl{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.tbl th{background:#f2f4f8;text-align:left;font-size:.72rem;font-weight:700;color:var(--muted);padding:9px 12px;border-bottom:1px solid var(--border)}
.tbl td{padding:10px 12px;border-bottom:1px solid #f0f1f4;font-size:.8rem;vertical-align:top}
.tbl tr:last-child td{border-bottom:none}
.tbl .nm{font-weight:700;width:32%}
.tbl .nt{color:var(--muted);font-size:.76rem}
.tbl .st{display:inline-block;background:#eef1f6;color:var(--navy);border-radius:6px;padding:2px 9px;font-size:.72rem;white-space:nowrap}
.tbl td.due.miss{color:#d63031;font-weight:700}
.tstat{display:inline-block;border-radius:6px;padding:2px 10px;font-size:.7rem;font-weight:700;white-space:nowrap}
.tstat.notdone{background:#fdecec;color:#d63031}
.tstat.done{background:#e6f4f1;color:var(--active)}
.tasknote{font-size:.72rem;color:var(--muted);margin:-4px 0 10px}
.stat.候補{background:#e9edf6;color:var(--navy)}
.nalist,.rklist{list-style:none;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:6px 8px}
.nalist li,.rklist li{padding:10px 12px 10px 30px;position:relative;font-size:.82rem;border-bottom:1px solid #f0f0f0;line-height:1.6}
.nalist li:last-child,.rklist li:last-child{border-bottom:none}
.nalist li:before{content:"▶";position:absolute;left:11px;color:var(--teal);font-size:.66rem;top:13px}
.rklist li:before{content:"⚠";position:absolute;left:10px;color:var(--warn);top:11px}
.nalist .na-o{display:block;color:var(--muted);font-size:.72rem;margin-top:3px}
.owners .chip{display:inline-block;background:#eef1f6;border-radius:20px;padding:4px 14px;font-size:.78rem;margin:0 6px 6px 0;font-weight:700;color:var(--navy)}
.stat{font-size:.7rem;font-weight:700;padding:3px 12px;border-radius:20px;white-space:nowrap}
.stat.進行中{background:#e6f4f1;color:var(--active)}.stat.停滞{background:#fdf0db;color:#b9791a}.stat.先方検討中{background:#fdf0db;color:#b9791a}.stat.保留{background:#eef0f3;color:var(--hold)}.stat.完了{background:#e8eef7;color:var(--check)}.stat.検討中{background:#e9edf6;color:var(--navy)}.stat.未着手{background:#f0f0f0;color:#999}.stat.提案前{background:#eef0f3;color:#6c757d}
.src{margin-top:22px;font-size:.72rem;color:var(--muted);padding:12px 14px;background:#f2f4f8;border-radius:8px}
footer{text-align:center;color:var(--muted);font-size:.72rem;margin-top:40px;padding:20px}
.conf{display:inline-block;background:#fdeaf1;color:var(--accent);font-weight:700;font-size:.7rem;padding:3px 12px;border-radius:20px;margin-right:8px}
</style>

  const baseKey=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:PAYLOAD.iters,hash:'SHA-256'},baseKey,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct);
  return JSON.parse(new TextDecoder().decode(pt));
}
function _jwt(t){try{const p=t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');return JSON.parse(decodeURIComponent(escape(atob(p))));}catch(e){return null;}}
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function render(c){
  const items=(c.items||[]).map(i=>`<tr><td class="nm">${esc(i.name)}</td><td><span class="st">${esc(i.status)}</span></td><td class="nt">${esc(i.note||'')}</td></tr>`).join('')||'<tr><td colspan="3" style="color:#aaa">—</td></tr>';
  const tasks=(c.tasks||[]).map(t=>{const miss=/未設定/.test(t.due||'');return `<tr><td>${esc(t.task)}${t.note?`<div class="nt">${esc(t.note)}</div>`:''}</td><td style="white-space:nowrap">${esc(t.owner||'')}</td><td class="due${miss?' miss':''}" style="white-space:nowrap">${esc(t.due||'')}</td><td style="white-space:nowrap">${esc(t.eta||'—')}</td><td><span class="tstat ${t.status==='done'?'done':'notdone'}">${t.status==='done'?'done':'not done'}</span></td></tr>`;}).join('')||'<tr><td colspan="5" style="color:#aaa">—</td></tr>';
  const nas=(c.nextActions||[]).map(n=>`<li><span class="na-a">${esc(n.action)}</span><span class="na-o">${esc(n.owner||'')}${n.due&&n.due!=='—'?' ／ '+esc(n.due):''}</span></li>`).join('')||'<li>—</li>';
  const rks=(c.risks||[]).map(r=>`<li>${esc(r)}</li>`).join('')||'<li>—</li>';
  const owners=(c.owners||[]).map(o=>`<span class="chip">${esc(o)}</span>`).join('')||'<span class="chip">—</span>';
  const srcs=(c.sources||[]).map(esc).join(' ／ ')||'—';
  document.getElementById('app').innerHTML=`
  <header><a class="back" href="../board.html">← AIGC進捗ボードに戻る</a>
    <div class="cat-tag">${esc(c.category)}</div>
    <h1>${esc(c.area)}<span class="stat ${esc(c.status)}">${esc(c.status)}</span></h1>
    <div class="headline">${esc(c.headline)}</div>
  </header>
  <div class="wrap">
    <div class="sumbox">${esc(c.summary)}</div>
    <div class="sec-h">進捗管理（タスク・期限・ETA）</div>
    <p class="tasknote">全タスク期限必須——⚠️未設定は赤＝担当者が期限を入れる（6/9方針）。状態は done / not done の2値。</p>
    <table class="tbl"><thead><tr><th>タスク</th><th>担当</th><th>期限</th><th>ETA</th><th>状態</th></tr></thead><tbody>${tasks}</tbody></table>
    <div class="sec-h">項目サマリ</div>
    <table class="tbl"><thead><tr><th>項目</th><th>状況</th><th>メモ</th></tr></thead><tbody>${items}</tbody></table>
    <div class="sec-h">ネクストアクション</div>
    <ul class="nalist">${nas}</ul>
    <div class="sec-h">リスク・懸念</div>
    <ul class="rklist">${rks}</ul>
    <div class="sec-h">担当</div>
    <div class="owners">${owners}</div>
    <div class="src">出典: ${srcs}　／　最終更新: ${esc(c.lastUpdate||'')}</div>
  </div>
  <footer><span class="conf">CONFIDENTIAL — 社外秘</span>AIGC事業 案件詳細　最終更新 ${esc(c.lastUpdate||'')} JST</footer>`;
}
const SS_KEY='aigc_cred';
const SSO_TTL_MS=2592000000;/*30日=firework-sso-no-popup.md準拠の自前TTL*/
function showData(d){render(d);document.getElementById('lock').style.display='none';document.getElementById('app').style.display='block';}
function tryToken(credential,fromCache){
  return (async()=>{
    const info=_jwt(credential);
    const now=Math.floor(Date.now()/1000);
    const dom=info&&(info.hd||((info.email||'').split('@')[1])||'');
    const ok=fromCache?!!(info&&dom==='fireworkhq.com'&&info.aud===CLIENT_ID):!!(info&&dom==='fireworkhq.com'&&info.aud===CLIENT_ID&&(!info.exp||info.exp>now));
    if(!ok){try{localStorage.removeItem(SS_KEY);localStorage.removeItem(SS_KEY+'_exp');}catch(_){}
      if(!fromCache){document.getElementById('err').textContent='アクセス権がありません（@fireworkhq.com のみ）';}
      return false;}
    try{const d=await decrypt(PP);showData(d);try{localStorage.setItem(SS_KEY,credential);localStorage.setItem(SS_KEY+'_exp',String(Date.now()+SSO_TTL_MS));}catch(e){}return true;}
    catch(e){if(!fromCache){document.getElementById('err').textContent='データの復号に失敗しました';}return false;}
  })();
}
function onCredential(resp){document.getElementById('err').textContent='認証中…';tryToken(resp.credential,false);}
function initGoogle(){
  if(!window.google||!google.accounts){document.getElementById('err').textContent='Googleログインを読み込めませんでした。再読み込みしてください';return;}
  google.accounts.id.initialize({client_id:CLIENT_ID,callback:onCredential,hd:'fireworkhq.com',auto_select:true});
  google.accounts.id.renderButton(document.getElementById('gbtn'),{theme:'filled_blue',size:'large',text:'signin_with',shape:'pill',width:280});
  google.accounts.id.prompt();
}
window.onload=function(){
  let cached=null;try{const _e=localStorage.getItem(SS_KEY+'_exp');if(_e&&Date.now()<parseInt(_e,10)){cached=localStorage.getItem(SS_KEY);}else{localStorage.removeItem(SS_KEY);localStorage.removeItem(SS_KEY+'_exp');}}catch(e){}
  if(cached){document.getElementById('err').textContent='読み込み中…';tryToken(cached,true).then(ok=>{if(!ok)initGoogle();});}
  else{initGoogle();}
};
</script>
