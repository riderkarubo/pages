<style>
:root{--ink:#1a1a2e;--accent:#FA006D;--teal:#1B998B;--navy:#0F3460;--bg:#f6f7f9;--card:#fff;--border:#e7e9ee;--muted:#6c757d;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans JP",-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--ink);line-height:1.65;font-size:14px}
#lock{position:fixed;inset:0;background:linear-gradient(135deg,#1a1a2e,#0F3460);display:flex;align-items:center;justify-content:center;z-index:1000}
.lockbox{background:#fff;border-radius:16px;padding:40px 36px;width:min(92vw,400px);text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.lockbox .em{font-size:2.2rem;margin-bottom:10px}
.lockbox h1{font-size:1.12rem;margin-bottom:6px}
.lockbox p{color:var(--muted);font-size:.82rem;margin-bottom:20px}
.lockbox .gwrap{display:flex;justify-content:center;min-height:44px}
.lockbox .err{color:#e74c3c;font-size:.78rem;margin-top:14px;min-height:18px}
.lockbox .conf{display:inline-block;margin-top:18px;font-size:.66rem;color:#8890a0;letter-spacing:.05em}
#app{display:none;max-width:1280px;margin:0 auto;padding:24px 20px 80px}
header{background:linear-gradient(135deg,#1a1a2e,#0F3460);color:#fff;padding:28px 32px;border-radius:16px;margin-bottom:24px;position:relative}
.back{position:absolute;top:14px;left:18px;color:#fff;text-decoration:none;font-size:.78rem;opacity:.85;background:rgba(255,255,255,.1);padding:5px 12px;border-radius:14px}
.back:hover{opacity:1}
header h1{font-size:1.5rem;margin:6px 0 6px;font-weight:900;letter-spacing:.02em}
header .lead{font-size:.85rem;opacity:.92;line-height:1.65;margin-top:8px}
header .src{margin-top:14px;font-size:.74rem;opacity:.85}
header .src a{color:#fa006d;background:#fff;padding:4px 12px;border-radius:14px;text-decoration:none;font-weight:700}
.wrap{background:var(--card);border-radius:14px;padding:22px 26px;box-shadow:0 1px 4px rgba(0,0,0,.04);margin-bottom:18px}
.tier-h{display:flex;align-items:baseline;gap:10px;margin:18px 0 8px;padding-bottom:6px;border-bottom:2px solid var(--accent)}
.tier-h .lbl{font-size:1.05rem;font-weight:900;color:var(--accent);letter-spacing:.04em}
.tier-h .cap{font-size:.86rem;color:var(--ink);font-weight:700}
.tier-h .note{font-size:.74rem;color:var(--muted);margin-left:auto}
.ptbl{width:100%;border-collapse:collapse;font-size:.76rem;margin-bottom:14px}
.ptbl th{background:#1a1a2e;color:#fff;padding:8px 6px;font-weight:600;font-size:.7rem;text-align:center;white-space:nowrap;border-right:1px solid #2a2a3e}
.ptbl th.itm{text-align:left;background:#0F3460;min-width:200px}
.ptbl td{padding:8px 6px;border-bottom:1px solid #f0f1f4;text-align:center;font-size:.74rem;vertical-align:middle}
.ptbl td.itm{text-align:left;font-weight:700;color:var(--ink)}
.ptbl td.itm .desc{display:block;font-weight:400;font-size:.66rem;color:var(--muted);line-height:1.5;margin-top:2px;white-space:normal;max-width:380px}
.ptbl td.base{font-weight:700;color:var(--accent);background:#fff5f9}
.ptbl tr:hover{background:#fafbfc}
.add-tbl{width:100%;border-collapse:collapse;font-size:.76rem;margin-top:10px}
.add-tbl th{background:#0F3460;color:#fff;padding:8px;font-size:.7rem;text-align:left}
.add-tbl td{padding:8px;border-bottom:1px solid #f0f1f4}
.add-tbl td.p{text-align:right;font-weight:700;color:var(--accent);white-space:nowrap}
.cust-list{background:#fff8f0;border-left:4px solid #f5a623;padding:14px 18px;border-radius:8px;margin:14px 0}
.cust-list h3{font-size:.92rem;color:#1a1a2e;margin-bottom:8px}
.cust-list .ci{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px dotted #e0d0b0}
.cust-list .ci:last-child{border-bottom:none}
.cust-list .ci .nm{font-weight:700}
.cust-list .ci .desc{font-size:.7rem;color:var(--muted)}
.cust-list .ci .pr{font-weight:700;color:#d97706}
.notes{background:#fafbfc;border-radius:8px;padding:14px 18px;margin-top:18px;font-size:.74rem;color:var(--ink);line-height:1.7}
.notes h3{font-size:.85rem;color:var(--accent);margin-bottom:6px}
.notes ul{margin-left:18px}
.notes li{margin-bottom:3px}
.fx{display:inline-block;background:#1B998B;color:#fff;padding:4px 12px;border-radius:14px;font-size:.74rem;font-weight:700;margin:10px 0}
footer{margin-top:30px;text-align:center;color:var(--muted);font-size:.74rem}
footer .conf{display:inline-block;background:#1a1a2e;color:#fff;padding:4px 10px;border-radius:4px;margin-right:8px;font-size:.66rem;letter-spacing:.04em}
.section-h{font-size:1.15rem;font-weight:900;color:var(--ink);margin:24px 0 6px;padding-left:8px;border-left:5px solid var(--accent)}
@media print{
  * {-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;color-adjust:exact!important}
  @page{size:A4;margin:10mm}
  #lock{display:none!important}
  #app{display:block!important;max-width:none}
  .section-h,.tier-h{page-break-after:avoid}
  .ptbl tr,.add-tbl tr,.cust-list .ci{page-break-inside:avoid}
}
</style>

async function decrypt(pp){
  const salt=Uint8Array.from(atob(PAYLOAD.salt),c=>c.charCodeAt(0));
  const iv=Uint8Array.from(atob(PAYLOAD.iv),c=>c.charCodeAt(0));
  const ct=Uint8Array.from(atob(PAYLOAD.ct),c=>c.charCodeAt(0));
  const baseKey=await crypto.subtle.importKey('raw',new TextEncoder().encode(pp),{name:'PBKDF2'},false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:PAYLOAD.iters,hash:'SHA-256'},baseKey,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct);
  return JSON.parse(new TextDecoder().decode(pt));
}
function _jwt(t){try{const p=t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');return JSON.parse(decodeURIComponent(escape(atob(p))));}catch(e){return null;}}
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function renderTier(t, headers){
  const rows=t.items.map(it=>{
    const cells=(it.prices||it.discounts||[]).map(p=>'<td>'+esc(p)+'</td>').join('');
    const base=it.baseJpy?'<span style="display:block">'+esc(it.baseJpy)+'</span>'+(it.baseJpyHigh?'<span style="display:block;font-weight:400;font-size:.66rem;color:#888">('+esc(it.baseJpyHigh)+')</span>':''):'';
    const meta=it.daysPerVideo||it.daysPer?'<span style="display:block;font-size:.62rem;color:#888;margin-top:2px">納期:'+(it.daysPerVideo||it.daysPer)+'日/本'+(it.minLot?' ・最小:'+it.minLot+'本':'')+'</span>':'';
    return '<tr><td class="itm">'+esc(it.name)+(it.desc?'<span class="desc">'+esc(it.desc)+'</span>':'')+meta+'</td><td class="base">'+base+(it.usd?'<span style="display:block;font-size:.62rem;font-weight:400;color:#888">'+esc(it.usd)+'</span>':'')+'</td>'+cells+'</tr>';
  }).join('');
  const heads='<th class="itm">項目</th><th>標準単価</th>'+headers.map(h=>'<th>'+esc(h)+'</th>').join('');
  return '<div class="tier-h"><span class="lbl">'+esc(t.label)+'</span><span class="cap">'+esc(t.cap)+'</span>'+(t.note?'<span class="note">'+esc(t.note)+'</span>':'')+'</div><table class="ptbl"><thead><tr>'+heads+'</tr></thead><tbody>'+rows+'</tbody></table>';
}
function showData(d){
  const tv=d.videoTiers;
  const t1HTML=renderTier(tv.tier1, tv.headers);
  const t2HTML=renderTier(tv.tier2, tv.headers);
  const t3HTML=renderTier(tv.tier3, tv.headers);
  const custHTML='<div class="cust-list"><h3>📐 カスタム見積もり（個別ヒアリング・要件ベース）</h3>'+d.custom.map(c=>'<div class="ci"><div><span class="nm">'+esc(c.name)+'</span> <span class="desc">'+esc(c.desc)+'</span></div><div class="pr">'+esc(c.price)+'</div></div>').join('')+'</div>';
  const ls=d.livestream;
  const lsRows=ls.items.map(it=>'<tr><td class="itm">'+esc(it.name)+'</td><td class="base">'+esc(it.baseJpy)+(it.usd?'<span style="display:block;font-size:.62rem;font-weight:400;color:#888">'+esc(it.usd)+'</span>':'')+'</td>'+it.discounts.map(d=>'<td>'+esc(d)+'</td>').join('')+'</tr>').join('');
  const lsHeads='<th class="itm">項目</th><th>標準単価</th>'+ls.headers.map(h=>'<th>'+esc(h)+'</th>').join('');
  const lsHTML='<div class="tier-h"><span class="lbl">📺 LIVE</span><span class="cap">'+esc(ls.cap)+'</span></div><table class="ptbl"><thead><tr>'+lsHeads+'</tr></thead><tbody>'+lsRows+'</tbody></table>';
  const addonRows=ls.addons.map(a=>'<tr><td><b>'+esc(a.name)+'</b>'+(a.desc?' <span style="color:#888;font-size:.7rem">— '+esc(a.desc)+'</span>':'')+'</td><td class="p">'+esc(a.priceJpy)+(a.usd?' <span style="color:#888;font-weight:400">('+esc(a.usd)+')</span>':'')+'</td></tr>').join('');
  const addonHTML='<table class="add-tbl" style="margin-top:14px"><thead><tr><th>アドオン</th><th style="text-align:right">価格</th></tr></thead><tbody>'+addonRows+'</tbody></table>';
  const im=d.imagery;
  const imHeads='<th class="itm">項目</th><th>標準単価</th>'+im.headers.map(h=>'<th>'+esc(h)+'</th>').join('');
  const imRows=im.items.map(it=>'<tr><td class="itm">'+esc(it.name)+(it.desc?'<span class="desc">'+esc(it.desc)+'</span>':'')+'</td><td class="base">'+esc(it.baseJpy)+(it.usd?'<span style="display:block;font-size:.62rem;font-weight:400;color:#888">'+esc(it.usd)+'</span>':'')+'</td>'+it.discounts.map(d=>'<td>'+esc(d)+'</td>').join('')+'</tr>').join('');
  const imHTML='<div class="tier-h"><span class="lbl">🎨 IMG</span><span class="cap">'+esc(im.cap)+'</span></div><table class="ptbl"><thead><tr>'+imHeads+'</tr></thead><tbody>'+imRows+'</tbody></table>';
  const notesHTML='<div class="notes"><h3>📝 注意事項</h3><div class="fx">'+esc(d.fxNote)+'</div><ul>'+d.notes.map(n=>'<li>'+esc(n)+'</li>').join('')+'</ul></div>';
  document.getElementById('app').innerHTML='<header><a class="back" href="../board.html">← AIGC進捗ボードに戻る</a><h1>💴 AIGCプライスリスト</h1><div class="lead">'+esc(d.intro)+'</div><div class="src">📋 原本: <a href="'+esc(d.sourceUrl)+'" target="_blank" rel="noopener">Google Sheets（最新版・編集可能）</a> ／ 受領: Yifan / 最終更新: '+esc(d.asOf)+'</div></header><div class="wrap"><div class="section-h">🎬 動画コンテンツ（VIDEO）</div>'+t1HTML+t2HTML+t3HTML+custHTML+'</div><div class="wrap"><div class="section-h">📺 ライブ配信 / ビデオコマース</div>'+lsHTML+addonHTML+'</div><div class="wrap"><div class="section-h">🎨 AI生成画像</div>'+imHTML+'</div>'+notesHTML+'<footer><span class="conf">CONFIDENTIAL — 社外秘</span>AIGCプライスリスト 最終更新 '+esc(d.asOf)+' JST</footer>';
  document.getElementById('lock').style.display='none';
  document.getElementById('app').style.display='block';
}
const SS_KEY='aigc_cred';
function tryToken(credential,fromCache){
  return (async()=>{
    const info=_jwt(credential);
    const now=Math.floor(Date.now()/1000);
    const dom=info&&(info.hd||((info.email||'').split('@')[1])||'');
    const ok=info&&dom==='fireworkhq.com'&&info.aud===CLIENT_ID&&(!info.exp||info.exp>now);
    if(!ok){try{sessionStorage.removeItem(SS_KEY);}catch(_){}
      if(!fromCache){document.getElementById('err').textContent='アクセス権がありません（@fireworkhq.com のみ）';}
      return false;}
    try{const d=await decrypt(PP);showData(d);try{sessionStorage.setItem(SS_KEY,credential);}catch(e){}return true;}
    catch(e){if(!fromCache){document.getElementById('err').textContent='データの復号に失敗しました: '+e.message;}return false;}
  })();
}
function onCredential(resp){document.getElementById('err').textContent='認証中…';tryToken(resp.credential,false);}
function initGoogle(){
  if(!window.google||!google.accounts){document.getElementById('err').textContent='Googleログインを読み込めませんでした。再読み込みしてください';return;}
  google.accounts.id.initialize({client_id:CLIENT_ID,callback:onCredential,hd:'fireworkhq.com',auto_select:true});
  google.accounts.id.renderButton(document.getElementById('gbtn'),{theme:'filled_blue',size:'large',text:'signin_with',shape:'pill',width:280});
  google.accounts.id.prompt();
}
window.onload=function(){
  let cached=null;try{cached=sessionStorage.getItem(SS_KEY);}catch(e){}
  if(cached){document.getElementById('err').textContent='読み込み中…';tryToken(cached,true).then(ok=>{if(!ok)initGoogle();});}
  else{initGoogle();}
};
