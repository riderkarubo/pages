<title>AIGC制作ナレッジ｜Firework社内</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📁</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#1a1a2e;--accent:#FA006D;--teal:#1B998B;--navy:#0F3460;--bg:#f6f7f9;--card:#fff;--border:#e7e9ee;--muted:#6c757d;--active:#1B998B;--warn:#f5a623;--danger:#e74c3c;--hold:#8890a0;--check:#0F3460;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans JP",-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;font-size:14px}
#lock{position:fixed;inset:0;background:linear-gradient(135deg,#1a1a2e,#0F3460);display:flex;align-items:center;justify-content:center;z-index:1000}
.lockbox{background:#fff;border-radius:16px;padding:40px 36px;width:min(92vw,400px);text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.lockbox .em{font-size:2.2rem;margin-bottom:10px}
.lockbox h1{font-size:1.12rem;margin-bottom:6px}
.lockbox p{color:var(--muted);font-size:.82rem;margin-bottom:20px}
.lockbox .gwrap{display:flex;justify-content:center;min-height:44px}
.lockbox .err{color:var(--danger);font-size:.8rem;min-height:1.2em;margin-top:14px}
.lockbox .note{color:#aab;font-size:.68rem;margin-top:16px}
#app{display:none;max-width:920px;margin:0 auto;padding:0 0 60px}
header{background:linear-gradient(135deg,#1a1a2e 0%,#0F3460 100%);color:#fff;padding:24px 32px 26px}
header .back{display:inline-block;color:#cdd3e0;font-size:.74rem;text-decoration:none;margin-bottom:14px;border:1px solid rgba(255,255,255,.25);border-radius:20px;padding:4px 12px;transition:background .15s}
header .back:hover{background:rgba(255,255,255,.12)}
header .cat-tag{color:var(--accent);font-weight:700;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase}
header h1{font-size:1.6rem;font-weight:900;margin:6px 0 8px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header .headline{color:#dfe4ee;font-size:.92rem;max-width:760px;margin-top:4px;line-height:1.6}
.wrap{padding:0 32px}
.sumbox{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:10px;padding:16px 18px;margin-top:22px;font-size:.86rem;line-height:1.8}
.sec-h{font-size:1.02rem;font-weight:900;margin:28px 0 12px;padding-left:12px;border-left:4px solid var(--navy)}
.tbl{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.tbl th{background:#f2f4f8;text-align:left;font-size:.72rem;font-weight:700;color:var(--muted);padding:9px 12px;border-bottom:1px solid var(--border)}
.tbl td{padding:10px 12px;border-bottom:1px solid #f0f1f4;font-size:.8rem;vertical-align:top}
.tbl tr:last-child td{border-bottom:none}
.tbl .nm{font-weight:700;width:32%}
.tbl .nt{color:var(--muted);font-size:.76rem}
.tbl .st{display:inline-block;background:#eef1f6;color:var(--navy);border-radius:6px;padding:2px 9px;font-size:.72rem;white-space:nowrap}
.nalist,.rklist{list-style:none;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:6px 8px}
.nalist li,.rklist li{padding:10px 12px 10px 30px;position:relative;font-size:.82rem;border-bottom:1px solid #f0f0f0;line-height:1.6}
.nalist li:last-child,.rklist li:last-child{border-bottom:none}
.nalist li:before{content:"▶";position:absolute;left:11px;color:var(--teal);font-size:.66rem;top:13px}
.rklist li:before{content:"⚠";position:absolute;left:10px;color:var(--warn);top:11px}
.nalist .na-o{display:block;color:var(--muted);font-size:.72rem;margin-top:3px}
.owners .chip{display:inline-block;background:#eef1f6;border-radius:20px;padding:4px 14px;font-size:.78rem;margin:0 6px 6px 0;font-weight:700;color:var(--navy)}
.stat{font-size:.7rem;font-weight:700;padding:3px 12px;border-radius:20px;white-space:nowrap}
.stat.進行中{background:#e6f4f1;color:var(--active)}.stat.停滞{background:#fdf0db;color:#b9791a}.stat.先方検討中{background:#fdf0db;color:#b9791a}.stat.保留{background:#eef0f3;color:var(--hold)}.stat.完了{background:#e8eef7;color:var(--check)}.stat.検討中{background:#e9edf6;color:var(--navy)}.stat.未着手{background:#f0f0f0;color:#999}
.src{margin-top:22px;font-size:.72rem;color:var(--muted);padding:12px 14px;background:#f2f4f8;border-radius:8px}
footer{text-align:center;color:var(--muted);font-size:.72rem;margin-top:40px;padding:20px}
.conf{display:inline-block;background:#fdeaf1;color:var(--accent);font-weight:700;font-size:.7rem;padding:3px 12px;border-radius:20px;margin-right:8px}
/* creative-learnings */
header .scope{margin-top:10px;font-size:.74rem;color:var(--muted);line-height:1.6}
.kpi-grid{display:flex;flex-direction:column;gap:10px}
.wcard{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--check);border-radius:10px;padding:12px 14px}
.wcard .wt{font-size:.86rem;font-weight:900;color:var(--navy);margin-bottom:5px;display:flex;gap:7px;align-items:flex-start}
.wcard .wt .wn{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;background:var(--check);color:#fff;border-radius:50%;font-size:.7rem;flex-shrink:0;margin-top:1px}
.wcard .wb{font-size:.76rem;color:var(--ink);line-height:1.6}
.bcard{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:10px;padding:12px 14px}
.bcard .wt{font-size:.86rem;font-weight:900;color:var(--accent);margin-bottom:5px}
.bcard .wb{font-size:.76rem;color:var(--ink);line-height:1.6}
.catblk{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.cat-h{display:flex;align-items:center;gap:9px;font-size:1rem;font-weight:900;color:var(--ink)}
.cat-h .ico{font-size:1.2rem}
.cat-clients{font-size:.72rem;color:var(--muted);margin:6px 0 12px;line-height:1.5}
.wb-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.wb-cols h4{font-size:.74rem;font-weight:800;margin:0 0 6px;padding-bottom:4px;border-bottom:1px solid var(--border)}
.wb-cols .h-win{color:var(--check)}.wb-cols .h-blk{color:var(--accent)}
.wb-cols ul{margin:0;padding-left:16px}
.wb-cols li{font-size:.76rem;color:var(--ink);line-height:1.55;margin-bottom:5px}
.cv-row{display:flex;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:10px;align-items:flex-start}
.cv-ico{font-size:1.4rem;flex-shrink:0}
.cv-main{flex:1}
.cv-name{font-size:.88rem;font-weight:900;color:var(--ink);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cv-stab{font-size:.66rem;font-weight:800;padding:2px 9px;border-radius:20px;background:#eef1f6;color:var(--navy);white-space:nowrap}
.cv-line{font-size:.76rem;line-height:1.55;margin-top:6px}
.cv-line .lbl{font-weight:800;font-size:.7rem;padding:1px 7px;border-radius:5px;margin-right:6px}
.cv-line .lbl-w{background:rgba(27,153,139,.16);color:var(--teal)}
.cv-line .lbl-b{background:rgba(250,0,109,.14);color:var(--accent)}
.case-grid{display:flex;flex-direction:column;gap:10px}
.case-card{background:var(--card);border:1px solid var(--border);border-top:3px solid var(--check);border-radius:10px;padding:13px 15px}
.case-card.progress{border-top-color:var(--accent)}
.case-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.case-name{font-size:.88rem;font-weight:900;color:var(--navy)}
.case-tag{font-size:.64rem;color:var(--muted);background:#eef1f6;border-radius:20px;padding:2px 9px;white-space:nowrap}
.case-sum{font-size:.77rem;color:var(--ink);line-height:1.55;margin:7px 0}
.case-learn{font-size:.73rem;color:var(--muted);line-height:1.55;border-top:1px dashed var(--border);padding-top:7px}
.case-learn b{color:var(--ink)}
.srclist{list-style:none;margin:0;padding:0}
.srclist li{font-size:.77rem;line-height:1.55;padding:7px 0;border-bottom:1px solid #f0f1f4}
.srclist li:last-child{border-bottom:none}
.srclist .cc{font-weight:800;color:var(--navy);font-family:ui-monospace,monospace;font-size:.74rem}
@media(max-width:640px){.wb-cols{grid-template-columns:1fr}}
</style>
</head>

async function decrypt(pass){
  const enc=new TextEncoder();
  const salt=Uint8Array.from(atob(PAYLOAD.salt),c=>c.charCodeAt(0));
  const iv=Uint8Array.from(atob(PAYLOAD.iv),c=>c.charCodeAt(0));
  const ct=Uint8Array.from(atob(PAYLOAD.ct),c=>c.charCodeAt(0));
  const baseKey=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:PAYLOAD.iters,hash:'SHA-256'},baseKey,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct);
  return JSON.parse(new TextDecoder().decode(pt));
}
function _jwt(t){try{const p=t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');return JSON.parse(decodeURIComponent(escape(atob(p))));}catch(e){return null;}}
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function render(c){
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(x){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[x];});};
  var wins=(c.winPatterns||[]).map(function(w){
    return '<div class="wcard"><div class="wt"><span class="wn">'+esc(w.n)+'</span>'+esc(w.title)+'</div><div class="wb">'+esc(w.body)+'</div></div>';
  }).join('');
  var blks=(c.topBlocks||[]).map(function(b){
    return '<div class="bcard"><div class="wt">'+esc(b.title)+'</div><div class="wb">'+esc(b.body)+'</div></div>';
  }).join('');
  var cats=(c.categories||[]).map(function(k){
    var wl=(k.wins||[]).map(function(x){return '<li>'+esc(x)+'</li>';}).join('')||'<li>—</li>';
    var bl=(k.blocks||[]).map(function(x){return '<li>'+esc(x)+'</li>';}).join('')||'<li>—</li>';
    return '<div class="catblk"><div class="cat-h"><span class="ico">'+esc(k.icon)+'</span>'+esc(k.name)+'</div><div class="cat-clients">対象: '+esc(k.clients||'')+'</div><div class="wb-cols"><div><h4 class="h-win">✅ うまくいっている</h4><ul>'+wl+'</ul></div><div><h4 class="h-blk">⚠️ 躓いている</h4><ul>'+bl+'</ul></div></div></div>';
  }).join('');
  var crs=(c.creatives||[]).map(function(v){

const SS_KEY='aigc_cred';
function showData(d){render(d);document.getElementById('lock').style.display='none';document.getElementById('app').style.display='block';}
function tryToken(credential,fromCache){
  return (async()=>{
    const info=_jwt(credential);
    const now=Math.floor(Date.now()/1000);
    const dom=info&&(info.hd||((info.email||'').split('@')[1])||'');
    const ok=info&&dom==='fireworkhq.com'&&info.aud===CLIENT_ID&&(!info.exp||info.exp>now);
    if(!ok){try{sessionStorage.removeItem(SS_KEY);}catch(_){}
      if(!fromCache){document.getElementById('err').textContent='アクセス権がありません（@fireworkhq.com のみ）';}
      return false;}
    try{const d=await decrypt(PP);showData(d);try{sessionStorage.setItem(SS_KEY,credential);}catch(e){}return true;}
    catch(e){if(!fromCache){document.getElementById('err').textContent='データの復号に失敗しました';}return false;}
  })();
}
function onCredential(resp){document.getElementById('err').textContent='認証中…';tryToken(resp.credential,false);}
function initGoogle(){
  if(!window.google||!google.accounts){document.getElementById('err').textContent='Googleログインを読み込めませんでした。再読み込みしてください';return;}
  google.accounts.id.initialize({client_id:CLIENT_ID,callback:onCredential,hd:'fireworkhq.com',auto_select:true});
  google.accounts.id.renderButton(document.getElementById('gbtn'),{theme:'filled_blue',size:'large',text:'signin_with',shape:'pill',width:280});
  google.accounts.id.prompt();
}
window.onload=function(){
  let cached=null;try{cached=sessionStorage.getItem(SS_KEY);}catch(e){}
  if(cached){document.getElementById('err').textContent='読み込み中…';tryToken(cached,true).then(ok=>{if(!ok)initGoogle();});}
  else{initGoogle();}
};
