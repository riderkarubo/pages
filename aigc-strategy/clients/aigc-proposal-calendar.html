<title>提案カレンダー & サンプル動画制作TL｜Firework社内</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>:root{--ink:#1a1a2e;--accent:#FA006D;--teal:#1B998B;--navy:#0F3460;--bg:#f6f7f9;--card:#fff;--border:#e7e9ee;--muted:#6c757d;--warn:#f5a623;--danger:#e74c3c;--hold:#8890a0}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans JP",-apple-system,sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;font-size:14px}
#lock{position:fixed;inset:0;background:linear-gradient(135deg,#1a1a2e,#0F3460);display:flex;align-items:center;justify-content:center;z-index:1000}
.lockbox{background:#fff;border-radius:16px;padding:40px 36px;width:min(92vw,400px);text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.lockbox .em{font-size:2.2rem;margin-bottom:10px}
.lockbox h1{font-size:1.12rem;margin-bottom:6px}
.lockbox p{color:var(--muted);font-size:.82rem;margin-bottom:20px}
.lockbox .gwrap{display:flex;justify-content:center;min-height:44px}
.lockbox .err{color:var(--danger);font-size:.8rem;min-height:1.2em;margin-top:14px}
.lockbox .note{color:#aab;font-size:.68rem;margin-top:16px}
#app{display:none;max-width:980px;margin:0 auto;padding:0 0 60px}
header{color:#fff;padding:24px 32px 26px;background:linear-gradient(135deg,#1a1a2e 0%,#0F3460 100%)}
header .back{display:inline-block;color:#cdd3e0;font-size:.74rem;text-decoration:none;margin-bottom:14px;border:1px solid rgba(255,255,255,.25);border-radius:20px;padding:4px 12px}
header .cat-tag{color:var(--accent);font-weight:700;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase}
header h1{font-size:1.6rem;font-weight:900;margin:6px 0 8px}
header .headline{color:#dfe4ee;font-size:.92rem;max-width:780px;margin-top:4px;line-height:1.6}
header .scope{margin-top:10px;font-size:.74rem;color:var(--muted);line-height:1.6}
.wrap{padding:0 32px}
.stats-row{display:flex;gap:12px;margin-top:22px;flex-wrap:wrap}
.stat-card{flex:1;min-width:140px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 16px;border-left:4px solid var(--accent)}
.stat-card .lbl{font-size:.7rem;color:var(--muted);font-weight:700;letter-spacing:.05em}
.stat-card .num{font-size:1.7rem;font-weight:900;color:var(--ink);line-height:1.1;margin-top:4px}
.stat-card .sub{font-size:.7rem;color:var(--muted);margin-top:2px}
.sec-h{font-size:1.05rem;font-weight:900;margin:32px 0 14px;padding-left:12px;border-left:4px solid var(--navy)}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:14px}
.card-h{font-size:.96rem;font-weight:900;color:var(--ink);margin-bottom:8px}
.card-sub{font-size:.74rem;color:var(--muted);margin-bottom:8px}
.card-body{font-size:.82rem;line-height:1.7}
.kv{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid #f0f1f4;font-size:.78rem}
.kv:last-child{border-bottom:none}
.kv .k{flex:0 0 140px;color:var(--muted);font-weight:700}
.kv .v{flex:1;color:var(--ink)}
/* calendar */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;background:var(--border);border:1px solid var(--border);border-radius:10px;overflow:hidden;padding:4px}
.cal-cell{background:var(--card);min-height:108px;padding:8px;border-radius:6px;display:flex;flex-direction:column}
.cal-cell.dow{background:#1a1a2e;color:#fff;min-height:auto;text-align:center;padding:6px;font-size:.66rem;font-weight:900;letter-spacing:.05em}
.cal-cell.weekend{background:#f7f9fc}
.cal-cell.today{background:#fff8fb;border:2px solid var(--accent)}
.cal-date{font-size:.78rem;font-weight:900;color:var(--ink);display:flex;align-items:center;gap:4px;margin-bottom:4px}
.cal-date.sat{color:#0066cc}
.cal-date.sun{color:#cc0000}
.cal-events{font-size:.62rem;line-height:1.45;overflow:hidden}
.cal-ev{padding:2px 5px;border-radius:3px;margin-bottom:2px;font-weight:700;border-left:2px solid;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-ev.proposal{background:var(--accent);color:#fff;border-left-color:#c4005a}
.cal-ev.sample{background:#e0f2f1;color:#0f6b5b;border-left-color:var(--teal)}
.cal-ev.internal{background:#eef0f3;color:#555;border-left-color:var(--hold)}
.cal-ev.unavail{background:#fef3d8;color:#9a7400;border-left-color:var(--warn)}
.cal-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.7rem;margin-top:14px;color:var(--muted)}
.cal-legend span{display:inline-flex;align-items:center;gap:5px}
.cal-legend .dot{width:10px;height:10px;border-radius:3px;display:inline-block}
.dot.p{background:var(--accent)}.dot.s{background:var(--teal)}.dot.i{background:var(--hold)}.dot.u{background:var(--warn)}
/* timeline */
.tl-step{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:8px;border-left:4px solid var(--teal);display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.tl-step .tl-date{flex:0 0 100px;font-size:.74rem;font-weight:900;color:var(--teal)}
.tl-step .tl-title{flex:1;min-width:200px;font-size:.82rem;font-weight:700;color:var(--ink)}
.tl-step .tl-owner{flex:0 0 130px;font-size:.7rem;color:var(--muted)}
/* actions */
.timeline-item{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:10px;border-left:4px solid var(--navy)}
.timeline-item.p0{border-left-color:var(--accent)}
.timeline-item.p1{border-left-color:var(--warn)}
.timeline-item.p2{border-left-color:var(--teal)}
.timeline-item.p3{border-left-color:var(--hold)}
.timeline-item.unset{border-left-color:var(--hold);opacity:.85}
.tl-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:5px}
.tl-pri{font-size:.66rem;font-weight:900;padding:3px 9px;border-radius:20px;background:var(--accent);color:#fff}
.tl-pri.p1{background:var(--warn)}
.tl-pri.p2{background:var(--teal)}
.tl-pri.p3{background:var(--hold)}
.tl-due{font-size:.7rem;font-weight:800;background:#1a1a2e;color:#fff;padding:3px 10px;border-radius:20px}
.tl-due.unset{background:var(--warn)}
.tl-action{font-size:.82rem;font-weight:700;color:var(--ink);flex:1;min-width:200px}
.tl-meta{font-size:.72rem;color:var(--muted);margin-top:5px;display:flex;gap:14px;flex-wrap:wrap}
.tl-meta .mk{font-weight:700;color:var(--navy)}
.story-box{background:#fff8fb;border:1px solid #fce0eb;border-left:3px solid var(--accent);border-radius:8px;padding:10px 14px;font-size:.78rem;line-height:1.65;color:var(--ink);margin-top:10px}
.story-box .stx{font-weight:900;color:var(--accent);font-size:.7rem;margin-right:6px}
.src{margin-top:22px;font-size:.72rem;color:var(--muted);padding:12px 14px;background:#f2f4f8;border-radius:8px}
footer{text-align:center;color:var(--muted);font-size:.72rem;margin-top:40px;padding:20px}
.conf{display:inline-block;background:#fdeaf1;color:var(--accent);font-weight:700;font-size:.7rem;padding:3px 12px;border-radius:20px;margin-right:8px}
@media print{body{background:#fff}#lock{display:none!important}#app{display:block!important;max-width:none}}
@media(max-width:640px){.wrap{padding:0 18px}header{padding:20px 18px 22px}.kv .k{flex:0 0 100px}}</style></head>

async function decrypt(pass){const enc=new TextEncoder();const salt=Uint8Array.from(atob(PAYLOAD.salt),c=>c.charCodeAt(0));const iv=Uint8Array.from(atob(PAYLOAD.iv),c=>c.charCodeAt(0));const ct=Uint8Array.from(atob(PAYLOAD.ct),c=>c.charCodeAt(0));const baseKey=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:PAYLOAD.iters,hash:'SHA-256'},baseKey,{name:'AES-GCM',length:256},false,['decrypt']);const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct);return JSON.parse(new TextDecoder().decode(pt));}
function _jwt(t){try{const p=t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');return JSON.parse(decodeURIComponent(escape(atob(p))));}catch(e){return null;}}
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function renderCalendarView(d){
  const dowLabels=['月','火','水','木','金','土','日'];
  const dowCells=dowLabels.map(l=>'<div class="cal-cell dow">'+l+'</div>').join('');
  const startDate=new Date(d.weekStart);
  const cells=[];
  for(let i=0;i<d.daysCount;i++){
    const cur=new Date(startDate);cur.setDate(cur.getDate()+i);
    const y=cur.getFullYear(),m=String(cur.getMonth()+1).padStart(2,'0'),dd=String(cur.getDate()).padStart(2,'0');
    const dateStr=y+'-'+m+'-'+dd;
    const dow=cur.getDay();
    const isWeekend=dow===0||dow===6;
    const isToday=dateStr===d.today;
    const events=d.events[dateStr]||[];
    const evHtml=events.map(e=>'<div class="cal-ev '+esc(e.type)+'">'+esc(e.label)+'</div>').join('');
    const dateClass=dow===6?'sat':(dow===0?'sun':'');
    cells.push('<div class="cal-cell '+(isWeekend?'weekend':'')+' '+(isToday?'today':'')+'"><div class="cal-date '+dateClass+'">'+(cur.getMonth()+1)+'/'+cur.getDate()+(isToday?' <span style="background:#FA006D;color:#fff;padding:1px 5px;border-radius:3px;font-size:.6rem">TODAY</span>':'')+'</div><div class="cal-events">'+evHtml+'</div></div>');
  }
  const grid='<div class="cal-grid">'+dowCells+cells.join('')+'</div>';
  const legend='<div class="cal-legend">'+d.legend.map(l=>'<span><span class="dot '+esc(l.tone)+'"></span>'+esc(l.label)+'</span>').join('')+'</div>';
  return grid+legend;
}
function renderActionsList(actions){
  return actions.map(a=>{
    const isUnset=(a.due||'').includes('未設定');
    const pri=a.priority.toLowerCase();
    return '<div class="timeline-item '+(isUnset?'unset':pri)+'"><div class="tl-head"><span class="tl-pri '+pri+'">'+esc(a.priority)+'</span><span class="tl-action">'+esc(a.action)+'</span><span class="tl-due '+(isUnset?'unset':'')+'">'+esc(a.due)+'</span></div><div class="tl-meta"><span><span class="mk">担当:</span> '+esc(a.owner)+'</span><span><span class="mk">領域:</span> '+esc(a.area)+'</span></div>'+(a.note?'<div class="story-box" style="margin-top:8px"><span class="stx">▶ メモ</span>'+esc(a.note)+'</div>':'')+'</div>';
  }).join('');
}
function renderStatsRow(d){
  return '<div class="stats-row"><div class="stat-card"><div class="lbl">総タスク</div><div class="num">'+d.stats.total+'</div><div class="sub">件</div></div><div class="stat-card"><div class="lbl">P0最優先</div><div class="num">'+d.stats.p0+'</div><div class="sub">件</div></div><div class="stat-card"><div class="lbl">7/3まで</div><div class="num">'+d.stats.week1+'</div><div class="sub">件</div></div><div class="stat-card"><div class="lbl">期限未設定</div><div class="num">'+d.stats.unset+'</div><div class="sub">件</div></div></div>';
}
function render(d){
  const stats='<div class="stats-row"><div class="stat-card"><div class="lbl">今日</div><div class="num" style="font-size:1.05rem;margin-top:10px">'+esc(d.today)+'</div><div class="sub">6月最終週</div></div><div class="stat-card"><div class="lbl">最短アポ</div><div class="num" style="font-size:1.05rem;margin-top:10px">2026/07/03</div><div class="sub">ニトリ西田氏</div></div><div class="stat-card"><div class="lbl">サンプル制作</div><div class="num">3</div><div class="sub">カテゴリ（N+ 洋服/家電/家具）</div></div><div class="stat-card"><div class="lbl">アクション</div><div class="num">'+d.actions.length+'</div><div class="sub">件（P0='+d.stats.p0+'）</div></div></div>';
  const cal=renderCalendarView(d);
  const tlItems=d.sampleTimeline.items.map(t=>'<div class="tl-step" style="'+(t.tone==='today'?'border-left-color:#FA006D':t.tone==='milestone'?'border-left-color:#0F3460':'')+'"><div class="tl-date">'+esc(t.date)+'</div><div class="tl-title">'+esc(t.title)+'</div><div class="tl-owner">👤 '+esc(t.owner)+'</div></div>').join('');
  const naList=renderActionsList(d.actions);
  // 担当者別グルーピング
  const byOwner={};
  d.actions.forEach(a=>{if(!byOwner[a.owner])byOwner[a.owner]=[];byOwner[a.owner].push(a);});
  const ownerCards=Object.keys(byOwner).map(o=>'<div class="card"><div class="card-h">👤 '+esc(o)+' （'+byOwner[o].length+'件）</div>'+byOwner[o].map(t=>'<div class="kv"><div class="k">'+esc(t.due)+'</div><div class="v">'+esc(t.action)+'</div></div>').join('')+'</div>').join('');
  const notes=d.notes.map(n=>'<li style="margin-bottom:6px;font-size:.82rem;line-height:1.6">'+esc(n)+'</li>').join('');
  document.getElementById('app').innerHTML=
    '<header><a class="back" href="../board.html">← AIGC進捗ボードに戻る</a><div class="cat-tag">提案カレンダー & ネクストアクション統合</div><h1>📆 提案カレンダー & サンプル動画TL</h1><div class="headline">'+esc(d.headline)+'</div><div class="scope">'+esc(d.scope)+'</div></header>'+
    '<div class="wrap">'+stats+
    '<div class="sec-h">📅 3週間カレンダー（6/22 〜 7/12）</div>'+cal+
    '<div class="sec-h">🎬 '+esc(d.sampleTimeline.title)+'</div><div class="card"><div class="card-sub">'+esc(d.sampleTimeline.subtitle)+'</div></div>'+tlItems+
    '<div class="sec-h">🎯 最重要ネクストアクション（議事録①②から '+d.actions.length+'件）</div>'+naList+
    '<div class="sec-h">👥 担当者別ビュー</div>'+ownerCards+
    '<div class="sec-h">📝 運用メモ</div><div class="card"><ul style="padding-left:20px">'+notes+'</ul></div>'+
    '<div class="src">本ページは2026-06-26 MTG①+②議事録ベース。週次ステータス更新。最終更新: '+esc(d.asOf)+' JST</div></div>'+
    '<footer><span class="conf">CONFIDENTIAL — 社外秘</span>提案カレンダー & ネクストアクション 最終更新 '+esc(d.asOf)+' JST</footer>';
}
const SS_KEY='aigc_cred';
function showData(d){render(d);document.getElementById('lock').style.display='none';document.getElementById('app').style.display='block';}
function tryToken(credential,fromCache){return(async()=>{const info=_jwt(credential);const now=Math.floor(Date.now()/1000);const dom=info&&(info.hd||((info.email||'').split('@')[1])||'');const ok=info&&dom==='fireworkhq.com'&&info.aud===CLIENT_ID&&(!info.exp||info.exp>now);if(!ok){try{sessionStorage.removeItem(SS_KEY);}catch(_){}if(!fromCache){document.getElementById('err').textContent='アクセス権がありません（@fireworkhq.com のみ）';}return false;}try{const d=await decrypt(PP);showData(d);try{sessionStorage.setItem(SS_KEY,credential);}catch(e){}return true;}catch(e){if(!fromCache){document.getElementById('err').textContent='データの復号に失敗しました';}return false;}})();}
function onCredential(resp){document.getElementById('err').textContent='認証中…';tryToken(resp.credential,false);}
function initGoogle(){if(!window.google||!google.accounts){document.getElementById('err').textContent='Googleログインを読み込めませんでした';return;}google.accounts.id.initialize({client_id:CLIENT_ID,callback:onCredential,hd:'fireworkhq.com',auto_select:true});google.accounts.id.renderButton(document.getElementById('gbtn'),{theme:'filled_blue',size:'large',text:'signin_with',shape:'pill',width:280});google.accounts.id.prompt(function(n){if(n.isNotDisplayed()||n.isSkippedMoment()||n.isDismissedMoment()){console.warn('[FireworkSSO] One Tap not shown.');}});}
window.onload=function(){let cached=null;try{cached=sessionStorage.getItem(SS_KEY);}catch(e){}if(cached){document.getElementById('err').textContent='読み込み中…';tryToken(cached,true).then(ok=>{if(!ok)initGoogle();});}else{initGoogle();}};
</script></body></html>
