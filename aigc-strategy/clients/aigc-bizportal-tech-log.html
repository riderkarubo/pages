<style>
:root{--ink:#1a1a2e;--accent:#FA006D;--teal:#1B998B;--navy:#0F3460;--bg:#f6f7f9;--card:#fff;--border:#e7e9ee;--muted:#6c757d;--active:#1B998B;--warn:#f5a623;--danger:#e74c3c;--hold:#8890a0;--check:#0F3460;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans JP",-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;font-size:14px}
#lock{position:fixed;inset:0;background:linear-gradient(135deg,#1a1a2e,#0F3460);display:flex;align-items:center;justify-content:center;z-index:1000}
.lockbox{background:#fff;border-radius:16px;padding:40px 36px;width:min(92vw,400px);text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.lockbox .em{font-size:2.2rem;margin-bottom:10px}
.lockbox h1{font-size:1.12rem;margin-bottom:6px}
.lockbox p{color:var(--muted);font-size:.82rem;margin-bottom:20px}
.lockbox .gwrap{display:flex;justify-content:center;min-height:44px}
.lockbox .err{color:var(--danger);font-size:.8rem;min-height:1.2em;margin-top:14px}
.lockbox .note{color:#aab;font-size:.68rem;margin-top:16px}
#app{display:none;max-width:920px;margin:0 auto;padding:0 0 60px}
header{background:linear-gradient(135deg,#1a1a2e 0%,#0F3460 100%);color:#fff;padding:24px 32px 26px}
header .back{display:inline-block;color:#cdd3e0;font-size:.74rem;text-decoration:none;margin-bottom:14px;border:1px solid rgba(255,255,255,.25);border-radius:20px;padding:4px 12px;transition:background .15s}
header .back:hover{background:rgba(255,255,255,.12)}
header .cat-tag{color:var(--accent);font-weight:700;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase}
header h1{font-size:1.6rem;font-weight:900;margin:6px 0 8px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header .headline{color:#dfe4ee;font-size:.92rem;max-width:760px;margin-top:4px;line-height:1.6}
header .scope{margin-top:10px;font-size:.74rem;color:var(--muted);line-height:1.6;color:#b9c0d4}
.wrap{padding:0 32px}
.sec-h{font-size:1.02rem;font-weight:900;margin:28px 0 12px;padding-left:12px;border-left:4px solid var(--navy)}
.tool-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-top:20px}
.tool-name{font-size:1rem;font-weight:900;color:var(--navy)}
.tool-desc{font-size:.8rem;color:var(--muted);margin:6px 0 12px;line-height:1.6}
.engine-row{display:flex;gap:12px;flex-wrap:wrap}
.engine-card{flex:1;min-width:220px;background:#f2f4f8;border-radius:10px;padding:12px 14px}
.engine-role{font-size:.68rem;font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:.04em}
.engine-name{font-size:.9rem;font-weight:900;margin:4px 0 6px}
.engine-note{font-size:.76rem;color:var(--muted);line-height:1.55}
.sess-meta{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--check);border-radius:10px;padding:14px 16px;margin-top:8px;font-size:.8rem}
.sess-meta .row{margin-bottom:6px}
.sess-meta .lbl{font-weight:800;color:var(--navy);margin-right:6px}
.chip{display:inline-block;background:#eef1f6;border-radius:20px;padding:3px 12px;font-size:.74rem;margin:0 6px 6px 0;font-weight:700;color:var(--navy)}
.purp-list{list-style:none;padding-left:0;margin-top:4px}
.purp-list li{font-size:.78rem;padding:3px 0 3px 16px;position:relative}
.purp-list li:before{content:"・";position:absolute;left:0}
.issue-card{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--danger);border-radius:10px;padding:13px 15px;margin-bottom:0}
.issue-card.has-res{border-radius:10px 10px 0 0;margin-bottom:0}
.issue-card .it{font-size:.88rem;font-weight:900;color:var(--danger);margin-bottom:5px}
.issue-card .ib{font-size:.78rem;color:var(--ink);line-height:1.6}
.resolved-card{background:#eaf7f2;border:1px solid var(--border);border-top:none;border-left:4px solid var(--active);border-radius:0 0 10px 10px;padding:13px 15px;margin-bottom:10px}
.resolved-card .rc-status{font-size:.8rem;font-weight:900;color:var(--active);margin-bottom:8px}
.res-pattern{background:#fff;border-radius:8px;padding:9px 11px;margin-bottom:7px}
.res-pattern .rp-name{font-size:.78rem;font-weight:800;color:var(--navy)}
.res-pattern .rp-ex{font-size:.72rem;color:var(--accent);font-weight:700;margin:2px 0}
.res-pattern .rp-detail{font-size:.75rem;color:var(--ink);line-height:1.55;margin-top:3px}
.rc-root,.rc-work{font-size:.75rem;color:var(--ink);line-height:1.6;margin-top:6px}
.rc-work{color:#1a1a2e;font-weight:600}
.tbl{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.tbl th{background:#f2f4f8;text-align:left;font-size:.72rem;font-weight:700;color:var(--muted);padding:9px 12px;border-bottom:1px solid var(--border)}
.tbl td{padding:10px 12px;border-bottom:1px solid #f0f1f4;font-size:.8rem;vertical-align:top}
.tbl tr:last-child td{border-bottom:none}
.tbl .nm{font-weight:700;width:28%}
.dec-list,.nalist{list-style:none;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:6px 8px}
.dec-list li,.nalist li{padding:10px 12px 10px 30px;position:relative;font-size:.82rem;border-bottom:1px solid #f0f0f0;line-height:1.6}
.dec-list li:last-child,.nalist li:last-child{border-bottom:none}
.dec-list li:before{content:"✔";position:absolute;left:11px;color:var(--check);font-size:.72rem;top:12px}
.nalist li:before{content:"▶";position:absolute;left:11px;color:var(--teal);font-size:.66rem;top:13px}
.item-o{display:block;color:var(--muted);font-size:.72rem;margin-top:3px}
.nalist li.done{background:#f7fbf9}
.nalist li.done .item-o.done-note{color:var(--active);font-weight:700}
.mood-box{background:#fdf0db;border-radius:10px;padding:12px 14px;font-size:.78rem;line-height:1.65;color:#7a5a12;margin-top:10px}
.next-mtg{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-top:8px;font-size:.8rem}
.next-mtg .row{margin-bottom:5px}
.next-mtg .lbl{font-weight:800;color:var(--navy);margin-right:6px}
.rklist{list-style:none;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:6px 8px}
.rklist li{padding:10px 12px 10px 30px;position:relative;font-size:.82rem;border-bottom:1px solid #f0f0f0;line-height:1.6}
.rklist li:last-child{border-bottom:none}
.rklist li:before{content:"🧠";position:absolute;left:8px;top:10px;font-size:.72rem}
.srclist{list-style:none;margin:0;padding:0}
.srclist li{font-size:.77rem;line-height:1.55;padding:7px 0;border-bottom:1px solid #f0f1f4}
.srclist li:last-child{border-bottom:none}
.srclist .cc{font-weight:800;color:var(--navy);font-family:ui-monospace,monospace;font-size:.74rem}
.src{margin-top:22px;font-size:.72rem;color:var(--muted);padding:12px 14px;background:#f2f4f8;border-radius:8px}
footer{text-align:center;color:var(--muted);font-size:.72rem;margin-top:40px;padding:20px}
.conf{display:inline-block;background:#fdeaf1;color:var(--accent);font-weight:700;font-size:.7rem;padding:3px 12px;border-radius:20px;margin-right:8px}
@media(max-width:640px){.engine-row{flex-direction:column}}
</style>
</head>

async function decrypt(pass){
  const enc=new TextEncoder();
  const salt=Uint8Array.from(atob(PAYLOAD.salt),c=>c.charCodeAt(0));
  const iv=Uint8Array.from(atob(PAYLOAD.iv),c=>c.charCodeAt(0));
  const ct=Uint8Array.from(atob(PAYLOAD.ct),c=>c.charCodeAt(0));
  const baseKey=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:PAYLOAD.iters,hash:'SHA-256'},baseKey,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct);
  return JSON.parse(new TextDecoder().decode(pt));
}

function render(c){

    var tech=(s.techIssues||[]).map(function(t){

        }).join('');

          '<div class="rc-work"><b>対応策:</b> '+esc(res.workaround)+'</div></div>';
      }

    }).join('');

const TOKEN_KEY='fw_aigc_biztl_tok';
const TOKEN_EXPIRY_KEY='fw_aigc_biztl_exp';
const TTL_MS=8*60*60*1000;
function showData(d){render(d);document.getElementById('lock').style.display='none';document.getElementById('app').style.display='block';}
function saveToken(cred){try{localStorage.setItem(TOKEN_KEY,cred);localStorage.setItem(TOKEN_EXPIRY_KEY,String(Date.now()+TTL_MS));}catch(e){}}
function loadToken(){try{const t=localStorage.getItem(TOKEN_KEY);const exp=localStorage.getItem(TOKEN_EXPIRY_KEY);if(!t||!exp)return null;if(Date.now()>parseInt(exp,10)){localStorage.removeItem(TOKEN_KEY);localStorage.removeItem(TOKEN_EXPIRY_KEY);return null;}return t;}catch(e){return null;}}
function clearToken(){try{localStorage.removeItem(TOKEN_KEY);localStorage.removeItem(TOKEN_EXPIRY_KEY);}catch(e){}}
function tryToken(credential,fromCache){
  return (async()=>{
    const info=_jwt(credential);
    const now=Math.floor(Date.now()/1000);
    const dom=info&&(info.hd||((info.email||'').split('@')[1])||'');
    const ok=info&&dom==='fireworkhq.com'&&info.aud===CLIENT_ID&&(!info.exp||info.exp>now);
    if(!ok){clearToken();
      if(!fromCache){document.getElementById('err').textContent='アクセス権がありません（@fireworkhq.com のみ）';}
      return false;}
    try{const d=await decrypt(PP);showData(d);saveToken(credential);return true;}
    catch(e){if(!fromCache){document.getElementById('err').textContent='データの復号に失敗しました';}return false;}
  })();
}
function onCredential(resp){document.getElementById('err').textContent='認証中…';tryToken(resp.credential,false);}
function initGoogle(){
  if(!window.google||!google.accounts){document.getElementById('err').textContent='Googleログインを読み込めませんでした。再読み込みしてください';return;}
  google.accounts.id.initialize({client_id:CLIENT_ID,callback:onCredential,hd:'fireworkhq.com',auto_select:false});
  google.accounts.id.renderButton(document.getElementById('gbtn'),{theme:'filled_blue',size:'large',text:'signin_with',shape:'pill',width:280});
  google.accounts.id.prompt(function(notif){
    if(notif&&(notif.isNotDisplayed()||notif.isSkippedMoment()||notif.isDismissedMoment())){
      console.warn('[BizPortalTechLog] One Tap not shown.');
    }
  });
}
window.onload=function(){
  const cached=loadToken();
  if(cached){document.getElementById('err').textContent='読み込み中…';tryToken(cached,true).then(function(ok){if(!ok)initGoogle();});}
  else{initGoogle();}
};
