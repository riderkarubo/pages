    <div class="stat-card"><div class="lbl">ステータス</div><div class="num" style="font-size:1.05rem;margin-top:10px">たたき台</div><div class="sub">DRAFT</div></div>
  </div>`;
  const tiers=d.tiers.map(t=>{
    const pros=(t.pros||[]).map(p=>`<li style="margin-bottom:4px;font-size:.78rem;line-height:1.55;color:var(--teal)">✓ ${esc(p)}</li>`).join('');
    const cons=(t.cons||[]).map(c=>`<li style="margin-bottom:4px;font-size:.78rem;line-height:1.55;color:var(--warn)">⚠ ${esc(c)}</li>`).join('');
    return `<div class="tier-card ${esc(t.tone)}">
      <div class="tier-head">
        <span class="tier-badge">${esc(t.tier)}</span>
        <span class="tier-name">${esc(t.name)}</span>
        <span class="tier-price">${esc(t.priceRange)}</span>
      </div>
      <div class="tier-lead">${esc(t.target)}　／　目安本数: ${esc(t.count)}</div>
      <div class="card-body" style="margin-top:10px;font-size:.8rem;line-height:1.65">${esc(t.quality)}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px">
        <div><ul style="padding-left:18px;margin:0">${pros}</ul></div>
        <div><ul style="padding-left:18px;margin:0">${cons}</ul></div>
      </div>
      <div class="kv" style="margin-top:8px"><div class="k">サンプル</div><div class="v"><a href="${esc(t.sample.match(/aigc-sample-videos\.html[^)]*/)[0])}" target="_blank" rel="noopener" style="color:var(--accent);font-weight:700">${esc(t.sample)}</a></div></div>
      <div class="kv"><div class="k">適用クライアント例</div><div class="v">${esc(t.clients)}</div></div>
    </div>`;
  }).join('');
  const bundles=d.bundleStrategy.items.map(b=>`<div class="card"><div class="card-h">${esc(b.t)}</div><div class="card-body">${esc(b.b)}</div></div>`).join('');
  const notice=d.draftNotice.map(n=>`<li style="margin-bottom:6px;font-size:.82rem;line-height:1.6">${esc(n)}</li>`).join('');
  document.getElementById('app').innerHTML=
    `<header><a class="back" href="../board.html">← AIGC進捗ボードに戻る</a>
    <div class="cat-tag">AIGC Tier設計 — たたき台（6/30確定）</div>
    <h1>📐 AIGC Tier設計 たたき台</h1>
    <div class="headline">${esc(d.headline)}</div>
    <div class="scope">${esc(d.scope)}</div></header>
    <div class="wrap">${stats}
    <div class="sec-h">📐 Tier1 / Tier2 / Tier3 設計</div>${tiers}
    <div class="sec-h">🎁 ${esc(d.bundleStrategy.title)}</div>${bundles}
    <div class="sec-h">⚠️ たたき台ゆえの注意</div><div class="card"><ul style="padding-left:20px">${notice}</ul></div>
    <div class="src">本ページは2026-06-26 Issy+KazさんMTG議事録ベース。Strategy 6/30確定後に最終版へ更新。最終更新: ${esc(d.asOf)} JST</div>
    </div>
    <footer><span class="conf">CONFIDENTIAL — 社外秘</span>AIGC Tier設計 たたき台　最終更新 ${esc(d.asOf)} JST</footer>`;
}
const SS_KEY='aigc_cred';
function showData(d){render(d);document.getElementById('lock').style.display='none';document.getElementById('app').style.display='block';}
function tryToken(credential,fromCache){
  return (async()=>{
    const info=_jwt(credential);
    const now=Math.floor(Date.now()/1000);
    const dom=info&&(info.hd||((info.email||'').split('@')[1])||'');
    const ok=info&&dom==='fireworkhq.com'&&info.aud===CLIENT_ID&&(!info.exp||info.exp>now);
    if(!ok){try{sessionStorage.removeItem(SS_KEY);}catch(_){}
      if(!fromCache){document.getElementById('err').textContent='アクセス権がありません（@fireworkhq.com のみ）';}
      return false;}
    try{const d=await decrypt(PP);showData(d);try{sessionStorage.setItem(SS_KEY,credential);}catch(e){}return true;}
    catch(e){if(!fromCache){document.getElementById('err').textContent='データの復号に失敗しました';}return false;}
  })();
}
function onCredential(resp){document.getElementById('err').textContent='認証中…';tryToken(resp.credential,false);}
function initGoogle(){
  if(!window.google||!google.accounts){document.getElementById('err').textContent='Googleログインを読み込めませんでした。再読み込みしてください';return;}
  google.accounts.id.initialize({client_id:CLIENT_ID,callback:onCredential,hd:'fireworkhq.com',auto_select:true});
  google.accounts.id.renderButton(document.getElementById('gbtn'),{theme:'filled_blue',size:'large',text:'signin_with',shape:'pill',width:280});
  google.accounts.id.prompt(function(n){if(n.isNotDisplayed()||n.isSkippedMoment()||n.isDismissedMoment()){console.warn('[FireworkSSO] One Tap not shown.');}});
}
window.onload=function(){
  let cached=null;try{cached=sessionStorage.getItem(SS_KEY);}catch(e){}
  if(cached){document.getElementById('err').textContent='読み込み中…';tryToken(cached,true).then(ok=>{if(!ok)initGoogle();});}
  else{initGoogle();}
};
</script>
