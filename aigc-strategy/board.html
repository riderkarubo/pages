<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="robots" content="noindex, nofollow">
<title>AIGC事業 進捗ボード — Firework社内</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#1a1a2e;--accent:#FA006D;--teal:#1B998B;--navy:#0F3460;--bg:#f6f7f9;--card:#fff;--border:#e7e9ee;--muted:#6c757d;
--active:#1B998B;--warn:#f5a623;--danger:#e74c3c;--hold:#8890a0;--check:#0F3460;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans JP",-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--ink);line-height:1.65;font-size:14px}
#lock{position:fixed;inset:0;background:linear-gradient(135deg,#1a1a2e,#0F3460);display:flex;align-items:center;justify-content:center;z-index:1000}
.lockbox{background:#fff;border-radius:16px;padding:40px 36px;width:min(92vw,400px);text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.lockbox h1{font-size:1.15rem;margin-bottom:6px}
.lockbox .em{font-size:2.2rem;margin-bottom:10px}
.lockbox p{color:var(--muted);font-size:.82rem;margin-bottom:20px}
.lockbox .gwrap{display:flex;justify-content:center;min-height:44px}
.lockbox .err{color:var(--danger);font-size:.8rem;min-height:1.2em;margin-top:14px}
.lockbox .note{color:#aab;font-size:.68rem;margin-top:16px}
#app{display:none;max-width:1180px;margin:0 auto;padding:0 0 60px}
header{background:linear-gradient(135deg,#1a1a2e 0%,#0F3460 100%);color:#fff;padding:30px 32px 26px}
header .eyebrow{color:var(--accent);font-weight:700;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase}
header h1{font-size:1.55rem;font-weight:900;margin:6px 0 4px}
header .goal{color:#cdd3e0;font-size:.86rem;max-width:820px;margin-top:8px}
header .ts{color:#8b93a8;font-size:.72rem;margin-top:12px}
.wrap{padding:0 32px}
.section-title{font-size:1.05rem;font-weight:900;margin:32px 0 14px;padding-left:12px;border-left:4px solid var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-top:24px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px}
.kpi .v{font-size:1.7rem;font-weight:900;line-height:1.1}
.kpi .l{font-size:.72rem;color:var(--muted);margin-top:4px}
.kpi .u{font-size:.66rem;color:var(--muted)}
.kpi.active .v{color:var(--active)}.kpi.warn .v{color:var(--warn)}.kpi.danger .v{color:var(--danger)}.kpi.muted .v{color:var(--hold)}
.pipe{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.pstage{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;border-top:3px solid var(--navy)}
.pstage h3{font-size:.82rem;font-weight:900;display:flex;justify-content:space-between;align-items:center}
.pstage .cnt{background:var(--navy);color:#fff;border-radius:20px;font-size:.66rem;padding:1px 9px}
.pstage.empty{opacity:.6;border-top-color:var(--danger)}
.pstage.empty .cnt{background:var(--danger)}
.chip{display:inline-block;background:#eef1f6;border-radius:6px;padding:3px 8px;font-size:.72rem;margin:4px 4px 0 0}
.pstage .note{font-size:.68rem;color:var(--muted);margin-top:8px;line-height:1.5}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.cat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px}
.cat .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.cat h3{font-size:1rem;font-weight:900}
.badge{font-size:.66rem;font-weight:700;padding:2px 10px;border-radius:20px;color:#fff;white-space:nowrap}
.badge.active{background:var(--active)}.badge.muted{background:var(--hold)}.badge.warn{background:var(--warn)}
.cat .leads{margin:6px 0 8px}
.cat .desc{font-size:.76rem;color:#444;line-height:1.6}
.areas{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:14px}
.acard{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.acard .ah{padding:14px 16px;display:flex;gap:10px;align-items:flex-start;border-bottom:1px solid var(--border)}
.sdot{width:10px;height:10px;border-radius:50%;margin-top:6px;flex-shrink:0}
.s-進行中{background:var(--active);box-shadow:0 0 7px var(--active)}.s-停滞{background:var(--warn)}.s-先方検討中{background:var(--warn)}.s-保留{background:var(--hold)}
.s-完了{background:var(--check)}.s-検討中{background:var(--navy)}.s-未着手{background:var(--border)}
.acard h3{font-size:.95rem;font-weight:900}
.acard .cat-tag{font-size:.64rem;color:var(--muted);font-weight:700}
.acard .stat{margin-left:auto;font-size:.66rem;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap;align-self:flex-start}
.stat.進行中{background:#e6f4f1;color:var(--active)}.stat.停滞{background:#fdf0db;color:#b9791a}.stat.先方検討中{background:#fdf0db;color:#b9791a}.stat.保留{background:#eef0f3;color:var(--hold)}
.stat.完了{background:#e8eef7;color:var(--check)}.stat.検討中{background:#e9edf6;color:var(--navy)}.stat.未着手{background:#f0f0f0;color:#999}
.acard .ab{padding:12px 16px}
.acard .head{font-size:.84rem;font-weight:700;color:var(--accent);margin-bottom:6px}
.acard .sum{font-size:.76rem;color:#444;line-height:1.6}
.acard details{margin-top:10px}
.acard summary{cursor:pointer;font-size:.74rem;font-weight:700;color:var(--navy);padding:6px 0;user-select:none}
.acard summary:hover{color:var(--accent)}
.sub{font-size:.68rem;font-weight:700;color:var(--muted);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.04em}
.acard ul{list-style:none;font-size:.74rem}
.acard .itm{padding:5px 0;border-bottom:1px dashed #eee;display:flex;gap:6px;flex-wrap:wrap;align-items:baseline}
.acard .itm .nm{font-weight:700}
.acard .itm .st{font-size:.64rem;background:#eef1f6;border-radius:5px;padding:1px 6px;color:var(--navy)}
.acard .itm .nt{color:var(--muted);font-size:.7rem;width:100%}
.acard .na{padding:4px 0;font-size:.74rem}
.acard .na .o{color:var(--accent);font-weight:700;font-size:.68rem}
.acard .rk{padding:4px 0 4px 16px;font-size:.72rem;color:#7a4a00;position:relative}
.acard .rk:before{content:"▲";position:absolute;left:0;color:var(--warn);font-size:.6rem;top:7px}
.acard .src{font-size:.64rem;color:#aaa;margin-top:8px}
.na-table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;font-size:.78rem}
.na-table th{background:#1a1a2e;color:#fff;text-align:left;padding:9px 12px;font-size:.72rem;font-weight:700}
.na-table td{padding:9px 12px;border-top:1px solid var(--border);vertical-align:top}
.na-table tr:hover td{background:#fafbfc}
.pri{font-size:.64rem;font-weight:700;padding:1px 8px;border-radius:20px;color:#fff}
.pri.高{background:var(--accent)}.pri.中{background:var(--warn)}.pri.低{background:var(--hold)}
.risklist,.gaplist{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:8px 8px}
.risklist li,.gaplist li{list-style:none;padding:9px 12px 9px 30px;position:relative;font-size:.78rem;border-bottom:1px solid #f0f0f0}
.risklist li:last-child,.gaplist li:last-child{border:none}
.risklist li:before{content:"⚠";position:absolute;left:10px;color:var(--warn)}
.gaplist li:before{content:"○";position:absolute;left:11px;color:var(--navy);font-size:.7rem;top:11px}
footer{text-align:center;color:var(--muted);font-size:.72rem;margin-top:40px;padding:20px}
/* === 6/9フィードバック反映: 優先順位マトリクス・期限赤フラグ・営業武器 (追加 260611) === */
.due-cell.miss{color:#d63031;font-weight:700;white-space:nowrap}
.sec-note b{color:var(--accent)}
.excard.ex-team .bar{background:var(--navy)}
.pm-wrap{overflow:auto;max-height:80vh;background:var(--card);border:1px solid var(--border);border-radius:0 0 12px 12px}
.pm-table{width:100%;border-collapse:collapse;font-size:.76rem;min-width:880px}
.pm-table th{background:#f2f4f8;font-size:.66rem;color:var(--muted);padding:8px 6px;text-align:center;border-bottom:1px solid var(--border);white-space:nowrap}
.pm-table thead th{position:sticky;top:0;z-index:3}
.pm-block{margin-bottom:20px}
.pm-cap{display:flex;align-items:center;gap:9px;font-size:.84rem;font-weight:900;color:#fff;padding:9px 14px;border-radius:10px 10px 0 0}
.pm-cap.cap-adv{background:#c20055}
.pm-cap.cap-ex{background:#0F3460}
.pm-cap.cap-new{background:#1B998B}
.pm-cap.cap-adv2{background:#b9791a}
.pm-cnt{font-size:.64rem;font-weight:700;background:rgba(255,255,255,.25);border-radius:20px;padding:1px 9px}
.pm-table th.pmc .pmw{display:block;color:var(--accent);font-weight:900}
.pm-table td{padding:7px 6px;border-bottom:1px solid #f0f1f4;text-align:center;vertical-align:middle}
.pm-table tr:last-child td{border-bottom:none}
.pm-table tr.top3{background:#fff8fb}
.pm-table .pmr{font-weight:900;color:var(--muted)}
.pm-table tr.top3 .pmr{color:var(--accent)}
.pm-table .pmn{text-align:left;font-weight:700;white-space:nowrap}
.pm-table .pmn a{color:var(--ink);text-decoration:underline;text-decoration-color:#f3a8c8}
.pm-table .pmn .pmstage{display:block;font-weight:400;font-size:.62rem;color:var(--muted)}
.pm-table .pmn .pmtype{display:inline-block;font-size:.6rem;padding:1px 5px;border-radius:3px;margin-top:2px;font-weight:700;vertical-align:middle}
.pm-table .pmn .pmtype-ex{background:#e8f4f8;color:#1a6fa0}
.pm-table .pmn .pmtype-new{background:#fef3e2;color:#c07a00}
.pm-table .pms{color:#8b93a5}
.pm-table .pms.v4,.pm-table .pms.v5{color:var(--ink);font-weight:700}
.pm-table .pms.v5{color:var(--accent)}
.pm-table .pms .q{color:#d63031;font-size:.6rem;vertical-align:super}
.pm-table .pmt{min-width:74px}
.pm-table .pmt b{font-size:.95rem}
.pm-table .pmt .bar{height:4px;background:#eef0f4;border-radius:2px;margin-top:3px}
.pm-table .pmt .bar i{display:block;height:100%;background:var(--accent);border-radius:2px}
.pm-table .pmnote{text-align:left;font-size:.68rem;color:var(--muted);min-width:230px;line-height:1.5}
.pm-disc{font-size:.7rem;color:var(--muted);margin:10px 2px 0;padding-left:10px;border-left:3px solid #f5a623}
.bmk{margin-top:16px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 18px}
.bmk-h{font-weight:900;font-size:.92rem;margin-bottom:8px}
.bmk-pitch{font-size:.78rem;background:#fff6e8;border-left:3px solid #f5a623;padding:8px 12px;border-radius:0 8px 8px 0;margin-bottom:12px;line-height:1.7}
.bmk-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.bmk-card{border:1px solid var(--border);border-radius:10px;padding:12px 14px;border-top:3px solid var(--teal)}
.bmk-card .bn{font-weight:900;font-size:.86rem}
.bmk-card .bs{font-size:.74rem;color:var(--ink);margin:4px 0}
.bmk-card .bu{font-size:.68rem;color:var(--muted)}
.bmk-card .bmk-link{display:inline-block;margin-top:8px;font-size:.7rem;font-weight:700;color:var(--accent);text-decoration:none}
.bmk-card .bmk-link:hover{text-decoration:underline}
/* === ストーリー再編・WIPバッジ・ロードマップ (追加 260611b) === */
.wip{display:inline-block;margin-left:10px;background:#fff3cd;color:#8a6d1a;border:1px solid #f0d98c;border-radius:14px;padding:2px 10px;font-size:.62rem;font-weight:700;vertical-align:middle}
.road{display:flex;align-items:stretch;gap:6px;flex-wrap:wrap;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px 16px 16px}
.rstep{flex:1;min-width:150px;position:relative;border:1px solid var(--border);border-radius:12px;padding:14px 14px 12px;text-align:center;background:#fafbfc}
.rstep.now{border-color:var(--accent);background:#fff6fa;box-shadow:0 2px 10px rgba(250,0,109,.08)}
.rnow{position:absolute;top:-9px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;font-size:.6rem;font-weight:900;border-radius:10px;padding:1px 9px;white-space:nowrap}
.rnum{font-size:1.5rem;font-weight:900;color:#dfe3ea;line-height:1}
.rstep.now .rnum{color:var(--accent)}
.rlb{font-size:1.02rem;font-weight:900;margin-top:2px}
.rds{font-size:.7rem;color:var(--muted);margin-top:4px;line-height:1.5}
.rwh{font-size:.66rem;font-weight:700;color:var(--navy);margin-top:6px}
.rarw{align-self:center;color:#c6ccd6;font-weight:900;font-size:1.1rem}
/* === 詳細ページリンクボタン（追加 260610） === */
.detail-btn{display:inline-flex;align-items:center;gap:6px;margin-top:12px;background:var(--ink);color:#fff;text-decoration:none;font-size:.74rem;font-weight:700;padding:7px 14px;border-radius:8px;transition:background .15s,transform .1s}
.detail-btn:hover{background:var(--accent);transform:translateX(2px)}
.acard .detail-btn{margin-top:10px;align-self:flex-start}
/* === 直近プロジェクト（クライアント別）セクション（追加 260610） === */
.sec-note{font-size:.76rem;color:var(--muted);margin:-6px 0 14px;padding-left:12px}
.projgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.projcard{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 18px;border-top:3px solid var(--accent);display:flex;flex-direction:column}
.projcard .pj-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.projcard .pj-head h3{font-size:1rem;font-weight:900}
.projcard .pj-sub{font-size:.68rem;color:var(--muted);margin-bottom:10px}
.projcard .pj-list{list-style:none;margin:0 0 6px;padding:0;flex:1}
.projcard .pj-list li{display:flex;justify-content:space-between;gap:8px;align-items:baseline;padding:6px 0;border-bottom:1px solid #f2f3f6;font-size:.78rem}
.projcard .pj-list li:last-child{border-bottom:none}
.projcard .pj-nm{font-weight:500}
.projcard .pj-st{font-size:.66rem;color:var(--navy);background:#eef1f6;border-radius:6px;padding:1px 8px;white-space:nowrap;flex-shrink:0}
.projcard .pj-na{font-size:.72rem;color:var(--ink);background:#fafbfc;border-left:2px solid var(--teal);padding:6px 10px;border-radius:0 6px 6px 0;margin:4px 0 6px}
.projcard .pj-na .pj-o{display:block;color:var(--muted);font-size:.66rem;margin-top:2px}
.conf{display:inline-block;background:#fdeaf1;color:var(--accent);font-weight:700;font-size:.7rem;padding:3px 12px;border-radius:20px;margin-bottom:8px}
/* === サイドバー目次（スクロールスパイ） === */
html{scroll-behavior:smooth}
body{padding-left:220px}
.section-title,.kpis{scroll-margin-top:16px}
.sidenav{position:fixed;top:0;left:0;bottom:0;width:220px;background:#13132a;color:#cdd3e0;padding:22px 14px;overflow-y:auto;z-index:60;border-right:1px solid #23233f}
.sidenav .brand{font-size:.84rem;font-weight:900;color:#fff;letter-spacing:.02em;line-height:1.32}
.sidenav .brand .em{color:var(--accent)}
.sidenav .sub2{font-size:.62rem;color:#7b84a0;margin:5px 0 18px}
.sidenav a{display:flex;gap:8px;align-items:baseline;color:#aeb6cc;text-decoration:none;font-size:.76rem;font-weight:500;padding:8px 10px;border-radius:8px;margin-bottom:2px;border-left:3px solid transparent;transition:background .15s,color .15s}
.sidenav a:hover{background:#1e1e3a;color:#fff}
.sidenav a.active{background:#1e1e3a;color:#fff;border-left-color:var(--accent);font-weight:700}
.sidenav .num{color:#6c7596;font-size:.66rem;flex:0 0 16px}
.sidenav .foot{margin-top:18px;padding-top:14px;border-top:1px solid #23233f;font-size:.6rem;color:#5f6884;line-height:1.6}
/* === エグゼクティブサマリ（MCCM風・見出しカード） === */
.exhead2{font-size:1.02rem;font-weight:900;color:#fff;background:linear-gradient(135deg,#1a1a2e,#0F3460);padding:13px 18px;border-radius:10px;margin-bottom:14px;line-height:1.45}
.execgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.excard{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;display:flex}
.excard .bar{width:6px;flex-shrink:0}
.excard .body{padding:14px 16px}
.excard .lb{display:inline-block;font-size:.74rem;font-weight:900;color:#fff;padding:3px 14px;border-radius:6px;margin-bottom:9px;letter-spacing:.04em}
.excard .tx{font-size:.83rem;line-height:1.72;color:#2a2a3a}
.ex-now .bar,.ex-now .lb{background:var(--navy)}
.ex-plan .bar,.ex-plan .lb{background:var(--accent)}
.ex-next .bar,.ex-next .lb{background:var(--active)}
.ex-block .bar,.ex-block .lb{background:var(--warn)}
.exasof{font-size:.68rem;color:var(--muted);margin-top:10px}
@media(max-width:900px){
  body{padding-left:0}
  .section-title,.kpis{scroll-margin-top:62px}
  .sidenav{position:sticky;top:0;left:auto;right:auto;bottom:auto;width:auto;height:auto;display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;padding:10px 12px;border-right:none;border-bottom:1px solid #23233f;white-space:nowrap}
  .sidenav .brand,.sidenav .sub2,.sidenav .foot,.sidenav .num{display:none}
  .sidenav a{flex:0 0 auto;border-left:none;border-bottom:3px solid transparent;padding:7px 12px;margin:0;border-radius:6px}
  .sidenav a.active{border-left:none;border-bottom-color:var(--accent)}
}
@media(max-width:600px){.wrap,header{padding-left:16px;padding-right:16px}}

/* === AIGC売上目標・進軍計画 === */
.rev-decl{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:8px}
.rev-hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:12px}
.rev-num{border-radius:12px;padding:14px 16px;color:#fff;overflow:hidden}
.rev-num .rl{font-size:.72rem;font-weight:700;opacity:.92}
.rev-num .rv{font-size:1.5rem;font-weight:900;line-height:1.15;margin:4px 0;font-variant-numeric:tabular-nums}
.rev-num .ru{font-size:.63rem;opacity:.82;line-height:1.45}
.rev-num.goal{background:linear-gradient(135deg,#1a1a2e,#0F3460)}
.rev-num.gap{background:linear-gradient(135deg,#0F3460,#1B6E8B)}
.rev-num.need{background:linear-gradient(135deg,#FA006D,#c80059)}
.rev-num.real{background:linear-gradient(135deg,#1B998B,#127a6e)}
.rev-num.warn{background:linear-gradient(135deg,#f5a623,#d98b0d)}
.rev-verdict{background:#fdeaf1;border-left:4px solid var(--accent);border-radius:8px;padding:12px 16px;font-size:.84rem;font-weight:700;color:#1a1a2e;margin:14px 0 6px;line-height:1.75}
.rev-sub{font-size:.82rem;font-weight:900;color:var(--navy);margin:20px 0 8px;padding-bottom:5px;border-bottom:2px solid var(--accent)}
.rev-coll{margin:0;padding:0;border:none}
.rev-coll>summary.rev-sub{cursor:pointer;list-style:none;display:flex;align-items:center;gap:6px}
.rev-coll>summary.rev-sub::after{content:'\25BC';font-size:.65rem;color:var(--accent);transition:transform .2s;flex-shrink:0}
.rev-coll[open]>summary.rev-sub::after{transform:rotate(180deg)}
.rev-coll>summary.rev-sub .rev-sub-amt{margin-left:auto;font-weight:900;color:var(--accent);font-size:.88rem;font-variant-numeric:tabular-nums;padding-right:4px}
.rev-coll>summary.rev-sub::-webkit-details-marker{display:none}
.rev-flow{border:1px solid var(--border);border-radius:10px;overflow:hidden}
.rev-frow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 16px;font-size:.82rem;border-top:1px solid #eef0f3}
.rev-frow:first-child{border-top:none}
.rev-frow .fv{font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap}
.rev-frow.goal{background:#f3f5f9;font-weight:700}
.rev-frow.minus .fv{color:var(--muted)}
.rev-frow.need{background:#fdeaf1;border-top:2px solid var(--accent)}
.rev-frow.need .fl{font-weight:900}.rev-frow.need .fv{color:var(--accent);font-size:1.05rem}
.rev-tbl .ry{font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap}
.rev-tbl .rc{font-weight:700}
.rev-tbl .rn{color:var(--muted);font-size:.72rem}
.rev-tbl tr.rtot td{background:#f3f5f9;font-weight:900;border-top:2px solid var(--navy)}
.rev-tl{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.rev-tlcard{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px;border-top:4px solid var(--navy)}
.rev-tlcard.q3{border-top-color:var(--accent)}
.rev-tlcard.q4{border-top-color:var(--teal)}
.rev-tlcard .qh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:3px}
.rev-tlcard .qbadge{background:var(--navy);color:#fff;font-weight:900;font-size:.72rem;padding:2px 10px;border-radius:6px}
.rev-tlcard.q3 .qbadge{background:var(--accent)}.rev-tlcard.q4 .qbadge{background:var(--teal)}
.rev-tlcard .qphase{font-weight:900;font-size:.82rem}
.rev-tlcard .qtarget{margin-left:auto;font-size:.7rem;font-weight:700;color:var(--accent)}
.rev-tlcard .qperiod{font-size:.68rem;color:var(--muted);margin-bottom:6px}
.rev-tlcard .qfocus{font-size:.76rem;color:#333;line-height:1.6;margin-bottom:8px}
.rev-tlcard .qacts{list-style:none;font-size:.74rem}
.rev-tlcard .qacts li{padding:4px 0 4px 16px;position:relative;line-height:1.55;border-bottom:1px dashed #eee}
.rev-tlcard .qacts li:before{content:"▸";position:absolute;left:0;color:var(--accent)}
.rev-tlcard .qmile{margin-top:8px;font-size:.74rem;font-weight:700;color:var(--navy);background:#f3f5f9;border-radius:6px;padding:6px 10px;line-height:1.5}
.rev-assume{margin-top:18px;background:#fafbfc;border:1px dashed var(--border);border-radius:10px;padding:12px 16px;font-size:.74rem;color:#555}
.rev-assume ul{margin:6px 0 0 0;padding-left:18px}
.rev-assume li{margin:3px 0;line-height:1.6}
@media(max-width:600px){.rev-frow{font-size:.74rem}.rev-num .rv{font-size:1.3rem}}

.ex-slogan{display:inline-block;background:linear-gradient(135deg,#FA006D,#c80059);color:#fff;font-weight:900;font-size:.92rem;padding:8px 18px;border-radius:24px;margin:0 0 14px;letter-spacing:.02em;box-shadow:0 4px 14px rgba(250,0,109,.25)}
.trial-btn{display:inline-flex;align-items:center;gap:6px;margin:10px 0 0 8px;background:var(--accent);color:#fff;text-decoration:none;font-size:.74rem;font-weight:700;padding:7px 14px;border-radius:8px;transition:background .15s,transform .1s}
.trial-btn:hover{background:#c80059;transform:translateX(2px)}
.acard .trial-btn{align-self:flex-start}
.ps{display:inline-block;font-size:.62rem;font-weight:700;padding:1px 8px;border-radius:20px;white-space:nowrap}
.ps-提案前{background:#eef0f3;color:#6c757d}
.ps-提案中{background:#e8eef7;color:#0F3460}
.ps-検討中{background:#fdf0db;color:#b9791a}

.ps-失注{background:#f7dede;color:#b53030}
.ps-保留{background:#fef3d8;color:#9a7400}

.pm-table .pmcat{text-align:center}

.cattag.cr2{background:#e7f6ee;color:#13806f}

.pm-table .pmown .ow-s,.pm-table .pmown .ow-c{display:block}
.pm-table .pmown .ow-s{font-weight:700;color:var(--ink)}
.pm-table .pmown .ow-c{color:var(--muted);font-weight:500}
.pm-table .pmown i{display:inline-block;width:15px;font-style:normal;font-size:.56rem;font-weight:800;color:#fff;background:var(--navy);border-radius:3px;text-align:center;margin-right:5px;line-height:1.5;vertical-align:middle}
.pm-table .pmown .ow-c i{background:#9aa3b5}
.pm-table .pmown .ow-none{color:#b8bdc7;font-weight:400}
.pm-table .pms.blank{color:#dde0e6}
.pm-table .pmt .pt-na{color:#cfd4dd;font-weight:700}
.pm-table tr.pm-ivs{background:#fcfdff}
.active-panel{background:linear-gradient(135deg,#e8f7f6,#d4edec);border:1px solid #a8d9d7;border-left:4px solid #0d7270;border-radius:12px;padding:16px 20px;margin-bottom:18px}
.ap-title{font-size:.82rem;font-weight:900;color:#0d7270;margin-bottom:12px;text-transform:uppercase;letter-spacing:.04em}
.ap-grid{display:flex;gap:12px;flex-wrap:wrap}
.ap-card{background:#fff;border:1px solid #b8dad8;border-radius:8px;padding:10px 14px;min-width:160px;flex:1 1 160px;max-width:240px}
.ap-name{font-weight:700;font-size:.85rem;color:var(--navy)}
.ap-name a{color:var(--navy);text-decoration:none}
.ap-name a:hover{text-decoration:underline}
.ap-owner{font-size:.72rem;color:#0d7270;font-weight:700;margin-top:2px}
.ap-note{font-size:.7rem;color:#666;margin-top:5px;line-height:1.4}
.pm-lost td{opacity:.55}
.pmown{font-size:.75rem;color:#555;white-space:nowrap;padding:4px 8px}
.pm-table th.pmc-pend{background:#fbeef4;color:#b85b8a}
.pm-table th.pmc-pend .pmw{display:block;color:#b85b8a;font-weight:900;font-size:.6rem}
.pm-table td.pms.un{color:#c7ccd6}
.stat.提案済み{background:#e8eef7;color:#0F3460}
.pricing-card{margin-top:14px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;background:linear-gradient(135deg,#fff,#fff6fa);border:1px solid #f3c6da;border-left:4px solid var(--accent);border-radius:12px;padding:14px 20px}
.pricing-card .pc-h{font-size:.78rem;font-weight:900;color:var(--navy)}
.pricing-card .pc-v{font-size:1.8rem;font-weight:900;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1}
.pricing-card .pc-per{font-size:.78rem;color:#444;margin-left:8px}
.pricing-card .pc-note{font-size:.7rem;color:var(--muted);flex:1;min-width:220px;line-height:1.5}
.bulk-wrap{margin-top:16px;overflow-x:auto}
.bulk-h{font-size:.82rem;font-weight:900;color:var(--navy);margin-bottom:8px}
.bulk-table{width:100%;border-collapse:collapse;font-size:.78rem;background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;min-width:560px}
.bulk-table th{background:#0F3460;color:#fff;font-size:.7rem;font-weight:700;padding:9px 10px;text-align:center;white-space:nowrap}
.bulk-table td{padding:9px 10px;text-align:center;border-bottom:1px solid var(--border);font-variant-numeric:tabular-nums;white-space:nowrap}
.bulk-table tbody tr:last-child td{border-bottom:none}
.bulk-table .bt-range{font-weight:800;color:var(--navy);text-align:left}
.bulk-table .bt-jpy{font-weight:800;color:var(--accent)}
.bulk-table tbody tr:hover{background:#fafbff}
.bulk-note{font-size:.7rem;color:var(--muted);text-align:left;padding:8px 10px;line-height:1.5}
.tb-lead{font-size:.82rem;color:#333;margin:-4px 0 14px;padding-left:12px;line-height:1.7}
.tb-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.tb-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;border-top:3px solid var(--accent);position:relative}

const _b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decrypt(pass){
  const salt=_b64(PAYLOAD.salt),iv=_b64(PAYLOAD.iv),ct=_b64(PAYLOAD.ct);
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:PAYLOAD.iters,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct);
  return JSON.parse(new TextDecoder().decode(pt));
}
function _jwt(t){try{const p=t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');return JSON.parse(decodeURIComponent(escape(atob(p))));}catch(e){return null;}}
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function initSpy(){
  const links=[].slice.call(document.querySelectorAll('.sidenav a'));
  const map=links.map(a=>({a,el:document.getElementById(a.getAttribute('href').slice(1))})).filter(x=>x.el);
  if(!map.length)return;
  let raf=0;
  function compute(){
    raf=0;
    const y=window.pageYOffset;
    const nearBottom=y+window.innerHeight>=document.documentElement.scrollHeight-8;
    let cur=map[0];
    if(nearBottom){cur=map[map.length-1];}
    else{const cursor=y+90;for(const m of map){const top=m.el.getBoundingClientRect().top+y;if(top<=cursor)cur=m;else break;}}
    links.forEach(a=>a.classList.remove('active'));
    cur.a.classList.add('active');
  }
  const onScroll=()=>{if(!raf)raf=requestAnimationFrame(compute);};
  compute();
  window.addEventListener('scroll',onScroll,{passive:true});
  window.addEventListener('resize',onScroll);
}

  const nav=`<nav class="sidenav">

const SS_KEY='aigc_cred';
function showData(d){render(d);document.getElementById('lock').style.display='none';document.getElementById('app').style.display='block';}
// credential(GoogleのIDトークン・約1時間有効)をサーバー検証。成功時はsessionStorageに保持し、
// 次回リロードはこのトークンで無音ログインを試みる(期限内は再ログイン不要)。
function tryToken(credential,fromCache){
  return (async()=>{
    const info=_jwt(credential);
    const now=Math.floor(Date.now()/1000);
    const dom=info&&(info.hd||((info.email||'').split('@')[1])||'');
    const ok=info&&dom==='fireworkhq.com'&&info.aud===CLIENT_ID&&(!info.exp||info.exp>now);
    if(!ok){try{sessionStorage.removeItem(SS_KEY);}catch(_){}
      if(!fromCache){document.getElementById('err').textContent='アクセス権がありません（@fireworkhq.com のみ）';}
      return false;}
    try{const d=await decrypt(PP);showData(d);try{sessionStorage.setItem(SS_KEY,credential);}catch(e){}return true;}
    catch(e){if(!fromCache){document.getElementById('err').textContent='データの復号に失敗しました';}return false;}
  })();
}
function onCredential(resp){document.getElementById('err').textContent='認証中…';tryToken(resp.credential,false);}
function initGoogle(){
  if(!window.google||!google.accounts){document.getElementById('err').textContent='Googleログインを読み込めませんでした。再読み込みしてください';return;}
  google.accounts.id.initialize({client_id:CLIENT_ID,callback:onCredential,hd:'fireworkhq.com',auto_select:true});
  google.accounts.id.renderButton(document.getElementById('gbtn'),{theme:'filled_blue',size:'large',text:'signin_with',shape:'pill',width:280});
  google.accounts.id.prompt();
}
window.onload=function(){
  let cached=null;try{cached=sessionStorage.getItem(SS_KEY);}catch(e){}
  if(cached){
    document.getElementById('err').textContent='読み込み中…';
    tryToken(cached,true).then(ok=>{if(!ok)initGoogle();});
  }else{initGoogle();}
};
</script>
